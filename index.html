he other side."],["overwhelmed","Emotionally overloaded."]],"notes":{"TR":"Both views are given fair, developed treatment, and the writer's own position (accurate reporting with more constructive stories) is stated at the start and confirmed at the end.","CC":"One paragraph per view, with the concessions placed where they belong. <i>Although, however, therefore<\/i> are used to move between positions.","LR":"<i>scrutiny, distorted picture, rolling coverage, constructive, censorship, overwhelmed<\/i>.","GRA":"Conditional (<i>If the media filtered out…, the public would receive<\/i>), reduced relative clauses, passive-like constructions and a concession (<i>Although I understand…<\/i>)."},"task":2},{"id":"t2-08","etype":"discussion","label":"Discussion · transport","short":"Roads or public transport","title":"Public transport or more roads?","minutes":40,"prompt":"Some people believe that governments should spend more on public transport to reduce traffic congestion. Others think that building more roads is a better solution.<br><br>Discuss both views and give your own opinion.","decode":{"q":"Some people believe that [[governments should spend more on public transport]] to [[reduce traffic congestion]]. Others think that [[building more roads]] is a better solution. [[Discuss both views and give your own opinion.]]","why":"<b>Topic:<\/b> solutions to traffic congestion. <b>Two views:<\/b> invest in public transport, or build more roads. <b>Task words:<\/b> “Discuss both views” and “give your own opinion”: two body paragraphs, and a clear final preference.","toks":[["Some",-1],["people",-1],["believe",-1],["that",-1],["governments",0],["should",0],["spend",0],["more",0],["on",0],["public",0],["transport",0],["to",-1],["reduce",1],["traffic",1],["congestion",1],[".",-1],["Others",-1],["think",-1],["that",-1],["building",2],["more",2],["roads",2],["is",-1],["a",-1],["better",-1],["solution.",-1],["Discuss",3],["both",3],["views",3],["and",3],["give",3],["your",3],["own",3],["opinion.",3]],"n":4},"plan":{"thesis":["Although new roads can ease congestion briefly, I believe that investment in public transport is the better long-term solution.","Roads are better than buses and trains because everybody likes driving.","Traffic is a problem in most big cities."],"ans":0,"why":"A concedes the first view (<i>can ease congestion briefly<\/i>) and states a clear preference with a reason (<i>long-term<\/i>). B is unsupported and C is a general statement.","pairs":[["New roads soon fill with extra traffic, so congestion returns.","A new motorway around a city opens, and within a few years the same queues form because more drivers use it."],["Trains and buses carry far more people in the same road space.","A tram line can move thousands of commuters an hour along a street that holds only a few hundred cars."],["Roads are still needed for freight, emergency vehicles and rural areas.","Ambulances and delivery lorries cannot use railway lines, and villages without stations rely on roads."]],"note":"Idea 1 answers the first view, idea 2 supports your preference, and idea 3 is a fair concession to the road-building side."},"upgrade":[["More roads make more cars.",["More roads make more cars come and this is not good for the traffic.","New roads tend to attract extra traffic, so the relief they bring is often temporary.","When governments build more roads, more people buy more cars."],1,"B uses a hedge (<i>tend to<\/i>) and a clear consequence (<i>the relief … is often temporary<\/i>). A and C are vague or repeat <i>more<\/i>."],["Public transport is cheaper and better for the environment.",["Public transport is cheap and it is also better for the environment.","Well-used public transport cuts both journey costs and emissions per passenger compared with private cars.","Public transport is good because it is cheap and does not make a lot of pollution."],1,"B is precise (<i>emissions per passenger<\/i>) and includes a comparison. A and C use simple words."],["So I think governments should spend on trains.",["So I think governments should spend more money on trains and buses.","Overall, sustained investment in rail and bus networks offers cities a more lasting answer to congestion than road building.","In my opinion, trains are better than roads."],1,"B states the position precisely, with a comparison and no <i>I think<\/i>."]],"order":{"para":1,"note":"Reporting the other view first (supporters of roads) → a concession (some truth) → the counter-argument (new roads attract traffic) → the result → the limit of the counter-argument. <i>However<\/i> and <i>As a result<\/i> mark the logic.","sents":["Supporters of road building argue that wider roads and new motorways give drivers more space and therefore reduce queues.","There is some truth in this in the short term.","However, new roads tend to attract additional traffic, because journeys that people previously avoided suddenly become convenient.","As a result, a new motorway often fills up within a few years, and the original congestion returns.","Roads are also essential for freight, emergency vehicles and rural areas that have no railway, so they cannot be neglected."]},"model":["Traffic congestion is a growing problem in cities, and there is disagreement about how to tackle it. Some people argue that more roads are the answer, while others favour spending on public transport. Although roads have their uses, I believe that investment in public transport offers the better long-term solution.","Supporters of road building argue that wider roads and new motorways give drivers more space and therefore reduce queues. There is some truth in this in the short term. However, new roads tend to attract additional traffic, because journeys that people previously avoided suddenly become convenient. As a result, a new motorway often fills up within a few years, and the original congestion returns. Roads are also essential for freight, emergency vehicles and rural areas that have no railway, so they cannot be neglected.","Public transport, by contrast, uses space far more efficiently. A tram line, for instance, can carry thousands of commuters an hour along a street that would hold only a few hundred cars, and a bus with forty passengers takes dozens of vehicles off the road. Well-used networks also cut the cost of travelling and the emissions per passenger, which helps cities to meet environmental targets. For this to work, however, services must be frequent, affordable and reliable; otherwise, people will continue to drive.","In conclusion, while some road building is necessary, it cannot solve congestion on its own. Sustained investment in trains, trams and buses gives cities a more lasting answer and should be the priority for governments. Passengers will choose buses and trains only when they are convenient, so the quality of service matters as much as the quantity."],"band7":{"para":2,"text":"Public transport, but, uses space much more efficient. A tram line can carry thousands commuters in an hour along a street that would hold only a few hundred cars, and a bus with forty passengers take dozens of vehicles from the road. Well-used networks also cut the cost of travelling and the emissions per passenger, that helps cities to meet environmental targets. For this work, however, services must be frequent, affordable and reliable, otherwise people will continue to drive.","faults":[["Public transport, but, uses space much more efficient","Public transport, by contrast, uses space far more efficiently","The correct linker, and an adverb to modify a verb."],["carry thousands commuters in an hour","carry thousands of commuters an hour","<i>thousands of<\/i> and no preposition before <i>an hour<\/i>."],["take dozens of vehicles from the road","takes dozens of vehicles off the road","Agreement, and <i>off the road<\/i>."],["that helps cities to meet","which helps cities to meet","A non-defining relative clause needs <i>which<\/i>."],["For this work, however","For this to work, however","<i>for<\/i> + subject + <i>to<\/i> + verb."],["reliable, otherwise people","reliable; otherwise, people","Punctuation: <i>otherwise<\/i> needs a semicolon before and a comma after."]]},"ideas":[["Build more roads","Roads give drivers more space and faster journeys, at least at first.","A new bypass that shortens travel to work."],["Build more roads","Roads serve freight, emergency vehicles and rural areas.","Ambulances, delivery lorries, villages without a rail line."],["Build more roads","Many people prefer the freedom of a car.","Families with children and shopping."],["Public transport","New roads attract extra traffic and fill up quickly.","A motorway queue returning within a few years."],["Public transport","Trains, trams and buses move far more people per square metre of road.","A tram line carrying thousands per hour."],["Public transport","It cuts cost and emissions per passenger.","Commuters who leave their cars at home."],["Balance","Reliable, frequent and affordable services are essential.","Cities where people still drive because buses are slow."]],"vocab":[["traffic congestion","Too many vehicles on the road: <i>the original congestion returns<\/i>."],["a long-term solution","An answer that lasts."],["attract additional traffic","Cause more vehicles to use a road."],["freight","Goods carried by road, rail or ship."],["emissions per passenger","A measure of pollution."],["take vehicles off the road","Reduce the number of cars: <i>takes dozens of vehicles off the road<\/i>."],["sustained investment","Spending over a long period."],["frequent, affordable and reliable","Three adjectives for good service."],["commuter","A person who travels to work."],["be neglected","Receive too little attention or money."]],"notes":{"TR":"Both views are discussed fairly, the road-building case is acknowledged (and its limit shown), and a clear opinion (<i>public transport, long-term<\/i>) is stated and defended.","CC":"Body 1 = the roads view with its limit; body 2 = the public transport view with its condition. <i>Although, However, as a result, by contrast, otherwise<\/i> are exact in meaning.","LR":"<i>congestion, attract additional traffic, freight, emissions per passenger, sustained investment<\/i>.","GRA":"Concession (<i>Although roads have their uses<\/i>), a relative clause (<i>which helps cities<\/i>), <i>for this to work<\/i>, and passive and conditional structures."},"task":2},{"id":"t2-09","etype":"discussion","label":"Discussion · work","short":"Salary or job satisfaction","title":"Salary or job satisfaction?","minutes":40,"prompt":"Some people think that the most important factor in choosing a job is a high salary. Others believe that job satisfaction is more important.<br><br>Discuss both views and give your own opinion.","decode":{"q":"Some people think that [[the most important factor in choosing a job is a high salary]]. Others believe that [[job satisfaction]] is [[more important]]. [[Discuss both views and give your own opinion.]]","why":"<b>Topic:<\/b> what matters most in choosing a job. <b>Two views:<\/b> salary first versus satisfaction first. <b>Task words:<\/b> discuss both views fairly, then say which you prefer. Notice that the two ideas are not opposites: you can argue that both matter but at different stages.","toks":[["Some",-1],["people",-1],["think",-1],["that",-1],["the",0],["most",0],["important",0],["factor",0],["in",0],["choosing",0],["a",0],["job",0],["is",0],["a",0],["high",0],["salary",0],[".",-1],["Others",-1],["believe",-1],["that",-1],["job",1],["satisfaction",1],["is",-1],["more",2],["important",2],[".",-1],["Discuss",3],["both",3],["views",3],["and",3],["give",3],["your",3],["own",3],["opinion.",3]],"n":4},"plan":{"thesis":["Although a good salary matters, I believe that job satisfaction is more important once basic financial needs are met.","Salary is not important at all, because money cannot buy happiness.","People have different jobs and different needs, so it is difficult to say."],"ans":0,"why":"A accepts the first view in part, states a clear preference, and gives a condition (<i>once basic needs are met<\/i>) that makes the position realistic. B is extreme and C avoids an opinion.","pairs":[["A good salary provides security and choices.","A graduate with high earnings can repay a loan, buy a home and support a family."],["Satisfied workers are more motivated and productive.","A nurse who finds real purpose in the job often gives patients extra care and stays in the profession for years."],["A well-paid but unfulfilling job can lead to stress and burnout.","A banker who works eighty-hour weeks may earn a great deal but leave the career within a few years."]],"note":"Idea 1 supports the salary view; ideas 2 and 3 support satisfaction. The examples are specific people in specific jobs, not general claims."},"upgrade":[["A high salary is good because people can buy things.",["A high salary is good because people can buy many things they want.","A high salary brings financial security, which gives people the freedom to choose where to live and how to spend their time.","People with a high salary can buy a lot of things and be happy."],1,"B explains what a high salary really gives (<i>security, freedom to choose<\/i>) in specific terms. A and C use vague words (<i>things, a lot<\/i>)."],["People who like their job work better.",["People who like their job work harder and better than people who do not.","Employees who find their work meaningful tend to be more motivated, creative and loyal to their employer.","If people like their job, they will work better."],1,"B hedges (<i>tend to<\/i>) and uses three precise adjectives. A and C repeat <i>work better<\/i>."],["In my opinion job satisfaction is more important than money.",["In my opinion, job satisfaction is more important than money, and I think this is true for most people.","Beyond a comfortable income, I would argue that job satisfaction contributes more to long-term wellbeing than extra pay.","I think satisfaction is the most important thing and money is not so important."],1,"B limits the claim (<i>beyond a comfortable income<\/i>) and is specific (<i>long-term wellbeing<\/i>). A and C are absolute and informal."]],"order":{"para":1,"note":"Claim (a good salary brings advantages) → how (security) → a second benefit (choices) → a limit (who needs pay first). The final sentence acknowledges the realistic point before the essay turns to the other view.","sents":["There is no doubt that a good salary brings real advantages.","It provides security, allowing a young graduate to repay a loan, buy a home and support a family without constant worry.","High earnings also give people choices, such as the freedom to move abroad or to retire early.","For people who are struggling to cover rent and food, pay is understandably the first consideration, and it would be unrealistic to ignore it."]},"model":["Choosing a career involves a trade-off between pay and enjoyment, and people disagree about which should come first. While a high salary has obvious attractions, I believe that job satisfaction becomes the more important factor once a person's basic financial needs have been met.","There is no doubt that a good salary brings real advantages. It provides security, allowing a young graduate to repay a loan, buy a home and support a family without constant worry. High earnings also give people choices, such as the freedom to move abroad or to retire early. For people who are struggling to cover rent and food, pay is understandably the first consideration, and it would be unrealistic to ignore it.","Beyond a comfortable income, however, satisfaction contributes far more to a good life. Employees who find their work meaningful tend to be more motivated, creative and loyal. A nurse who finds real purpose in the job, for example, often gives patients extra care and stays in the profession for many years. By contrast, a highly paid but unfulfilling job can lead to stress and exhaustion, and many people who earn large salaries leave their careers within a few years in search of something more rewarding. Over a working life of forty years, enjoyment of daily tasks matters more than a small difference in pay.","In conclusion, a decent salary is essential, but it is not sufficient. Once people can live comfortably, doing work they enjoy and believe in is likely to bring them greater long-term wellbeing than a higher pay cheque, and employers who understand this will keep their best staff for longer."],"band7":{"para":2,"text":"Beyond a comfortable income, but, satisfaction contributes much more for a good life. Employees who finds their work meaningful tends to be more motivated, creative and loyalty. A nurse who find real purpose in the job, for example, often give patients extra care and stay in the profession for many years. In contrast a highly paid but unfulfilling job can lead to stress and exhaustion, and many people who earn large salaries leaves their careers in few years for search something more rewarding.","faults":[["Beyond a comfortable income, but, satisfaction contributes much more for a good life","Beyond a comfortable income, however, satisfaction contributes far more to a good life","The correct linker and prepositions."],["Employees who finds their work meaningful tends to be","Employees who find their work meaningful tend to be","Agreement (plural subject)."],["creative and loyalty","creative and loyal","Parallel adjectives."],["A nurse who find real purpose in the job, for example, often give patients extra care and stay in the profession","A nurse who finds real purpose in the job, for example, often gives patients extra care and stays in the profession","Agreement with a singular subject in every verb."],["In contrast a highly paid","By contrast, a highly paid","A fixed phrase with a comma."],["leaves their careers in few years for search something more rewarding","leave their careers within a few years in search of something more rewarding","Agreement, an article, and the phrase <i>in search of<\/i>."]]},"ideas":[["Salary first","A good salary provides security and choices.","Repaying a loan, buying a home, supporting a family."],["Salary first","For people on low incomes, pay is the first priority.","A worker who cannot cover rent and food."],["Salary first","Money can fund the things that make life enjoyable outside work.","Travel, hobbies, education for children."],["Satisfaction first","Satisfied workers are more motivated, creative and loyal.","A nurse who finds real purpose in the job."],["Satisfaction first","Unfulfilling work can cause stress and burnout, even when well paid.","Long hours in a high-paying job that people leave after a few years."],["Satisfaction first","People spend a large part of their lives at work, so enjoyment matters.","A working life of forty years."],["Balance","Pay matters until basic needs are covered; satisfaction matters more after.","A comfortable but not extravagant income."]],"vocab":[["a trade-off","Giving up one thing to gain another: <i>a trade-off between pay and enjoyment<\/i>."],["job satisfaction","How happy a person is with their work."],["financial security","Not worrying about money."],["a comfortable income","Enough money to live well."],["meaningful / fulfilling work","Work that feels important."],["burnout","Exhaustion caused by too much stress at work."],["tend to be","A hedge for generalisations."],["a pay cheque","A wage or salary payment."],["in search of","Looking for."],["it would be unrealistic to ignore","A concession phrase."]],"notes":{"TR":"Both views are described with reasons and examples, and a conditional opinion (<i>once basic needs are met<\/i>) is given at the start and confirmed at the end.","CC":"Body 1 gives the salary view fairly (including who needs it most); body 2 argues satisfaction. <i>While, however, by contrast, over a working life<\/i> keep the logic clear.","LR":"<i>a trade-off, financial security, meaningful, unfulfilling, burnout-type phrases, in search of<\/i>.","GRA":"Concession and contrast (<i>While…, however, By contrast<\/i>), participle (<i>allowing a young graduate to…<\/i>), relative clauses and a conditional meaning (<i>Once people can live comfortably<\/i>)."},"task":2},{"id":"t2-10","etype":"advdis","label":"Advantages & disadvantages · tourism","short":"Tourism as the main industry","title":"Do the benefits of tourism outweigh the costs?","minutes":40,"prompt":"In some countries, tourism has become the largest industry.<br><br>Do the advantages of this outweigh the disadvantages?","decode":{"q":"In some countries, [[tourism]] has become [[the largest industry]]. [[Do the advantages of this outweigh the disadvantages?]]","why":"<b>Topic:<\/b> countries that depend on tourism. <b>Task words:<\/b> “Do the advantages outweigh the disadvantages?” asks for a <b>judgement<\/b>, not two lists. You must decide which side is heavier and say so in the introduction and again in the conclusion.","toks":[["In",-1],["some",-1],["countries,",-1],["tourism",0],["has",-1],["become",-1],["the",1],["largest",1],["industry",1],[".",-1],["Do",2],["the",2],["advantages",2],["of",2],["this",2],["outweigh",2],["the",2],["disadvantages?",2]],"n":3},"plan":{"thesis":["In my view, the economic and social benefits of tourism outweigh its drawbacks, provided that governments manage its environmental and cultural costs.","Tourism has advantages and disadvantages for countries.","Tourism is bad because tourists cause pollution and damage."],"ans":0,"why":"A answers the question (<i>outweigh<\/i>) and adds the condition that shapes the essay. B repeats the question without answering, and C ignores the advantages.","pairs":[["Tourism creates jobs and brings in foreign currency.","In a coastal resort, hotels, restaurants, guides and transport companies employ thousands of local people."],["Mass tourism can damage the environment and local culture.","Coral reefs can be harmed by boats and divers, and traditional villages can become theme parks for visitors."],["Dependence on one industry makes an economy vulnerable.","When a pandemic or a security crisis stops travel, a tourism-dependent country can lose most of its income almost overnight."]],"note":"Idea 1 is the advantage that carries your argument; ideas 2 and 3 are the two main disadvantages. Each example is something that could really happen."},"upgrade":[["Tourism makes a lot of jobs.",["Tourism makes a lot of jobs for people in many different places.","Tourism generates employment across hotels, restaurants, transport and crafts, often in regions with few other opportunities.","Tourism is good because it gives jobs to many people."],1,"B lists specific sectors and adds a reason why it matters (<i>regions with few other opportunities<\/i>). A and C are vague."],["Tourists can damage the environment.",["Tourists can damage the environment in many ways and this is a big problem.","Large numbers of visitors can erode beaches, pollute water and disturb wildlife unless numbers are controlled.","Tourists damage the environment and make it dirty."],1,"B names three specific harms and a condition (<i>unless numbers are controlled<\/i>). A and C are general and absolute."],["A country should not depend only on tourism.",["A country should not depend only on tourism because it is risky.","Economies that rely heavily on tourism are vulnerable to events beyond their control, so diversification is wise.","It is not good for a country to have only tourism as its industry."],1,"B explains the risk (<i>events beyond their control<\/i>) and gives the solution (<i>diversification<\/i>)."]],"order":{"para":1,"note":"Topic sentence (the main advantage is economic) → general claim (jobs) → specific example (a coastal resort) → a related benefit (small businesses) → the second advantage (foreign currency). <i>also<\/i> adds the extra points.","sents":["The main advantage is economic.","Tourism creates employment across hotels, restaurants, transport and handicrafts, often in regions that offer few other opportunities.","In a coastal resort, for example, thousands of local people may work as guides, cooks, drivers and cleaners, and their wages circulate through the local economy.","Small businesses such as family-run guesthouses can also grow without large amounts of capital.","Tourism also brings in foreign currency, which helps to pay for imports and for public services such as roads and hospitals."]},"model":["In a number of countries, tourism now earns more than any other sector. Although this brings serious risks, I believe that the economic and social advantages outweigh the disadvantages, provided that governments manage the environmental and cultural costs carefully.","The main advantage is economic. Tourism creates employment across hotels, restaurants, transport and handicrafts, often in regions that offer few other opportunities. In a coastal resort, for example, thousands of local people may work as guides, cooks, drivers and cleaners, and their wages circulate through the local economy. Small businesses such as family-run guesthouses can also grow without large amounts of capital. Tourism also brings in foreign currency, which helps to pay for imports and for public services such as roads and hospitals.","The disadvantages are nevertheless real. Large numbers of visitors can erode beaches, pollute water and disturb wildlife, and traditional villages sometimes turn into theme parks designed for outsiders. Moreover, an economy that depends heavily on one industry is vulnerable: when a pandemic or a security crisis stops travel, a tourism-based country can lose most of its income almost overnight. These problems are serious, but they are largely the result of poor management rather than of tourism itself, and careful regulation can address most of them.","In conclusion, tourism offers jobs and income that many countries could not easily obtain elsewhere. If governments limit visitor numbers, protect natural and cultural sites and develop other industries alongside tourism, the benefits will clearly outweigh the costs. Without such safeguards, however, the short-term profits of tourism could easily destroy the very attractions that visitors come to see."],"band7":{"para":1,"text":"The main advantage is economic. Tourism create employment across hotels, restaurants, transport and handicrafts, often in regions what offer few other opportunity. In a coastal resort for example, thousands of local people may works as guides, cooks, drivers and cleaners and their wages is circulate in the local economy. Tourism also bring foreign currency, that helps to pay for imports and public services as roads and hospitals.","faults":[["Tourism create employment","Tourism creates employment","Agreement."],["in regions what offer few other opportunity","in regions that offer few other opportunities","<i>that<\/i> for a defining clause, and a plural noun."],["In a coastal resort for example,","In a coastal resort, for example,","Commas around <i>for example<\/i>."],["may works as guides","may work as guides","A modal is followed by the base verb."],["their wages is circulate in the local economy","their wages circulate through the local economy","A single finite verb, and <i>through<\/i>."],["Tourism also bring foreign currency, that helps to pay for imports","Tourism also brings in foreign currency, which helps to pay for imports","Agreement, <i>brings in<\/i>, and <i>which<\/i> for a non-defining clause."],["public services as roads and hospitals","public services such as roads and hospitals","<i>such as<\/i> introduces examples."]]},"ideas":[["Advantages","Tourism creates employment in many sectors, often in remote regions.","Hotels, restaurants, guides, transport, crafts."],["Advantages","It brings foreign currency that pays for imports and public services.","Taxes from hotels funding roads and hospitals."],["Advantages","It supports small, local businesses.","Family-run guesthouses and market stalls."],["Disadvantages","Large visitor numbers harm the environment.","Eroded beaches, damaged coral reefs, water pollution."],["Disadvantages","Local culture can be commercialised and housing costs can rise.","Villages that become theme parks; residents priced out."],["Disadvantages","Dependence on one industry is risky.","A pandemic or security crisis that stops travel overnight."],["My judgement","The benefits outweigh the costs if governments manage numbers and diversify.","Caps on visitors, protected sites, other industries."]],"vocab":[["generate employment","Create jobs."],["foreign currency / foreign exchange","Money from other countries."],["circulate through the local economy","Spread among local businesses."],["erode / pollute / disturb","Three verbs for environmental harm."],["a theme park","A place that looks authentic only for show: <i>villages sometimes turn into theme parks<\/i>."],["vulnerable","Easily harmed: <i>an economy that depends on one industry is vulnerable<\/i>."],["overnight","Very suddenly."],["diversify","Develop several industries."],["poor management","A cause of problems: <i>the result of poor management<\/i>."],["outweigh","Be greater than: <i>the benefits outweigh the costs<\/i>."]],"notes":{"TR":"The question asks for a judgement and the essay gives one (<i>advantages outweigh, provided that…<\/i>). Both advantages and disadvantages are developed with specifics.","CC":"Introduction with judgement → advantages → disadvantages (with a limit on how serious they are) → conclusion repeating the judgement. <i>nevertheless, moreover, rather than<\/i> are used precisely.","LR":"<i>generate employment, foreign currency, erode, vulnerable, overnight, poor management, outweigh<\/i>.","GRA":"<i>provided that<\/i>, relative clauses (<i>which helps to pay for…<\/i>), a colon for explanation, and a conditional in the conclusion."},"task":2},{"id":"t2-11","etype":"advdis","label":"Advantages & disadvantages · education","short":"Studying abroad","title":"What are the pros and cons of studying abroad?","minutes":40,"prompt":"More and more students choose to study at universities in other countries.<br><br>What are the advantages and disadvantages of this trend?","decode":{"q":"[[More and more students]] choose to [[study at universities in other countries]]. [[What are the advantages and disadvantages of this trend?]]","why":"<b>Topic:<\/b> studying abroad. <b>Task words:<\/b> “advantages and disadvantages” means both, with no instruction to weigh them (unlike <i>outweigh<\/i>). A balanced treatment with a brief overall view in the conclusion is enough. <i>This trend<\/i> refers to the increase in students going abroad.","toks":[["More",0],["and",0],["more",0],["students",0],["choose",-1],["to",-1],["study",1],["at",1],["universities",1],["in",1],["other",1],["countries",1],[".",-1],["What",2],["are",2],["the",2],["advantages",2],["and",2],["disadvantages",2],["of",2],["this",2],["trend?",2]],"n":3},"plan":{"thesis":["Studying abroad offers academic and personal growth, but it also brings financial and emotional costs.","Studying abroad is better than studying at home in every way.","Many students study abroad and many students study at home."],"ans":0,"why":"A names both sides in one sentence and previews the two body paragraphs. B is one-sided and C describes without evaluating.","pairs":[["Students gain access to high-quality teaching and a wider range of courses.","A student who wants to study marine biology can attend a university with research facilities that are not available at home."],["Living abroad builds independence, language skills and international contacts.","A graduate who studied in Canada returns fluent in English and with friends in several countries."],["Studying abroad is expensive and can cause loneliness and culture shock.","International fees, accommodation and flights can cost far more than local tuition, and a student far from family may feel isolated in the first months."]],"note":"Ideas 1 and 2 are advantages (academic, personal), idea 3 is the disadvantages (financial, emotional). The examples are realistic and specific."},"upgrade":[["Students can learn better at foreign universities.",["Students can learn better at foreign universities because they are very good.","Overseas universities may offer specialist courses and research facilities that are unavailable at home.","Foreign universities are better, so students learn more there."],1,"B names what is better (<i>specialist courses, research facilities<\/i>) and hedges (<i>may<\/i>). A and C make a general, unsupported claim."],["They also learn to live by themselves.",["They also learn to live by themselves and this is a good life skill.","Living abroad also forces students to become independent, managing money, cooking and solving problems without family nearby.","They learn to be independent and this is useful for the future."],1,"B lists concrete tasks and uses a participle phrase. A and C stay general."],["But it costs a lot of money.",["But it costs a lot of money for many families.","However, tuition fees, accommodation and flights can place a heavy financial burden on families.","But studying abroad is very expensive, so some people cannot do it."],1,"B lists the costs and uses a precise collocation (<i>place a heavy financial burden on<\/i>)."]],"order":{"para":1,"note":"Topic sentence (the first advantage) → an example (marine biology) → the second advantage → details of independence → why employers care. <i>also<\/i> and <i>for instance<\/i> mark the shift from one advantage to the next.","sents":["The first advantage is access to better teaching and a wider range of courses.","A student who wants to specialise in marine biology, for instance, might find research facilities abroad that simply do not exist at home.","Studying in another country also develops independence and language skills.","Students must manage money, cook for themselves and solve problems without family nearby, and a graduate returning from Canada may be fluent in English and have friends in several countries.","These experiences are valued by employers who operate internationally."]},"model":["An increasing number of students are choosing to complete their studies in another country. This trend offers important academic and personal advantages, but it also brings financial and emotional costs that students should consider carefully.","The first advantage is access to better teaching and a wider range of courses. A student who wants to specialise in marine biology, for instance, might find research facilities abroad that simply do not exist at home. Studying in another country also develops independence and language skills. Students must manage money, cook for themselves and solve problems without family nearby, and a graduate returning from Canada may be fluent in English and have friends in several countries. These experiences are valued by employers who operate internationally.","On the other hand, studying abroad is expensive. International tuition fees, accommodation and flights can cost far more than local study, placing a heavy burden on families and sometimes forcing students to work long hours instead of studying. There is an emotional cost too. A student far from home may feel isolated and homesick in the first months, and adjusting to a new culture and language can be stressful. In some cases, students who struggle to adapt perform worse than they would have done at home.","In conclusion, studying abroad can broaden a student's education and career prospects, but it is demanding in money and in personal resilience. Students who are well prepared and can afford the cost are likely to gain the most. Universities and governments can help by offering scholarships and clear support services for newcomers."],"band7":{"para":1,"text":"The first advantage is access to more good teaching and a wide range of courses. A student who want to specialise in marine biology, for instance, might find research facilities abroad that simply not exist at home. Studying in other country also develop independence and language skills. Students must manage money, cook for them and solve problems without family nearby, and a graduate return from Canada may be fluent in English and has friends in several countries.","faults":[["access to more good teaching and a wide range of courses","access to better teaching and a wider range of courses","Comparatives: <i>better<\/i> and <i>wider<\/i>."],["A student who want to specialise","A student who wants to specialise","Agreement."],["that simply not exist at home","that simply do not exist at home","Negative present simple needs <i>do not<\/i>."],["Studying in other country also develop independence","Studying in another country also develops independence","<i>another<\/i>, article-like singular form, and agreement."],["cook for them and solve","cook for themselves and solve","A reflexive pronoun for the same subject."],["a graduate return from Canada may be fluent in English and has friends","a graduate returning from Canada may be fluent in English and have friends","A participle, and the modal <i>may<\/i> governs both verbs."]]},"ideas":[["Advantages","Access to better teaching and specialist facilities.","A marine biology research centre abroad."],["Advantages","Independence, confidence and problem-solving.","Managing money, cooking and daily life alone."],["Advantages","Language skills and an international network.","Fluent English and friends in several countries."],["Advantages","A degree from a respected foreign university can help careers.","Employers who operate internationally."],["Disadvantages","It is expensive: fees, accommodation and flights.","A family that must borrow to pay."],["Disadvantages","Homesickness, isolation and culture shock.","A student alone in the first months."],["Disadvantages","Some students struggle academically in a second language.","Poor results at first because of language and teaching style."]],"vocab":[["specialise in","Focus on a subject: <i>specialise in marine biology<\/i>."],["research facilities","Equipment and laboratories."],["independence","Being able to manage without help."],["an international network","Contacts in several countries."],["place a heavy burden on","Cause great difficulty."],["homesick / isolated","Missing home / alone."],["culture shock","Feeling confused in a new culture."],["adapt to","Adjust to new conditions."],["personal resilience","The ability to cope with difficulty."],["career prospects","Chances of a good career."]],"notes":{"TR":"Both advantages and disadvantages are addressed in depth, each with specific examples, and a short overall view closes the essay.","CC":"Body 1 = advantages (academic, then personal, then career), body 2 = disadvantages (financial, then emotional). <i>On the other hand, There is … too<\/i> signal the shift.","LR":"<i>specialise in, research facilities, independence, burden, homesick, resilience, career prospects<\/i>.","GRA":"Relative clauses (<i>that simply do not exist, who struggle to adapt<\/i>), participle (<i>placing a heavy burden<\/i>) and a conditional perfect (<i>than they would have done at home<\/i>)."},"task":2},{"id":"t2-12","etype":"advdis","label":"Advantages & disadvantages · technology","short":"A cashless society","title":"What are the pros and cons of a cashless society?","minutes":40,"prompt":"More shops and services now accept only cards and mobile payments, and cash is used less and less.<br><br>What are the advantages and disadvantages of a cashless society?","decode":{"q":"[[More shops and services now accept only cards and mobile payments]], and [[cash is used less and less]]. [[What are the advantages and disadvantages of a cashless society?]]","why":"<b>Topic:<\/b> the end of cash. <b>Task words:<\/b> “advantages and disadvantages” again asks for both. The topic sentence describes a trend (cash use falling), which you may restate in your introduction.","toks":[["More",0],["shops",0],["and",0],["services",0],["now",0],["accept",0],["only",0],["cards",0],["and",0],["mobile",0],["payments",0],[",",-1],["and",-1],["cash",1],["is",1],["used",1],["less",1],["and",1],["less",1],[".",-1],["What",2],["are",2],["the",2],["advantages",2],["and",2],["disadvantages",2],["of",2],["a",2],["cashless",2],["society?",2]],"n":3},"plan":{"thesis":["A cashless society offers speed, convenience and security for most people, but it risks excluding vulnerable groups and threatening privacy.","Cash is old-fashioned and should be abolished.","Money is used in all societies."],"ans":0,"why":"A names advantages and disadvantages precisely and previews the structure. B is an opinion without balance and C is a general fact.","pairs":[["Electronic payments are fast and reduce the cost of handling cash.","A shop that accepts only cards serves customers faster and avoids counting and banking notes."],["Digital payments can reduce crime and make transactions traceable.","A thief cannot steal a bag of notes from a business that holds none, and authorities can trace illegal payments."],["A cashless system excludes people without bank accounts or smartphones and can fail when technology does.","An elderly person with no smartphone cannot pay for bus tickets, and a power cut can leave a whole town unable to buy food."]],"note":"Ideas 1 and 2 are advantages (efficiency, security); idea 3 is a disadvantage with two parts (exclusion, technical failure)."},"upgrade":[["It is faster to pay with a card.",["It is faster to pay with a card than with cash, so it is good.","Electronic payments speed up transactions and spare businesses the cost of counting, storing and banking cash.","Cards are quick, so there is no need to wait."],1,"B names the benefit for businesses (<i>spare … the cost of<\/i>). A and C only restate speed in simple words."],["Cashless payment helps the police find criminals.",["Cashless payment helps the police to find criminals more easily than before.","Because every electronic transaction leaves a record, cashless systems make it harder to launder money or evade tax.","The police can see all payments so criminals cannot hide."],1,"B gives the mechanism (<i>leaves a record<\/i>) and two specific crimes. A and C are general."],["But some old people cannot use phones.",["But some old people cannot use phones, which is a big problem.","However, elderly people and those without bank accounts risk being excluded from basic services.","Old people are not good with phones, so it is difficult for them."],1,"B names two groups and the consequence in neutral language (<i>risk being excluded<\/i>)."]],"order":{"para":1,"note":"Topic sentence (the advantages are considerable) → first advantage with a colon explanation → second advantage (security) → third (traceability). <i>Moreover<\/i> introduces the last, most socially important point.","sents":["The advantages are considerable.","Electronic payments speed up transactions: a shop that accepts only cards serves customers faster and avoids the cost of counting, storing and banking cash.","Security also improves, since a thief cannot steal a bag of notes from a business that holds none.","Moreover, because every electronic payment leaves a record, it becomes harder to launder money or evade tax, which benefits society as a whole."]},"model":["Cash is disappearing from many shops, restaurants and transport systems, as customers increasingly pay by card or phone. A cashless society has clear advantages in speed, convenience and security for most people, but it also has disadvantages, because it risks excluding vulnerable groups and weakening privacy.","The advantages are considerable. Electronic payments speed up transactions: a shop that accepts only cards serves customers faster and avoids the cost of counting, storing and banking cash. Security also improves, since a thief cannot steal a bag of notes from a business that holds none. Moreover, because every electronic payment leaves a record, it becomes harder to launder money or evade tax, which benefits society as a whole.","The drawbacks, however, should not be ignored. A cashless system excludes people who have no bank account or smartphone, such as some elderly or low-income residents, who may find that they cannot pay for a bus ticket or a meal. Technology can also fail: during a power cut or a cyber-attack, a whole town might be unable to buy food. Finally, electronic payments create a detailed record of what people buy, raising legitimate concerns about privacy and the commercial use of personal data.","In conclusion, going cashless brings real gains in efficiency and security, but these come at the price of inclusion and privacy. For that reason, governments should keep cash available for those who need it while encouraging safe digital alternatives. Without such safeguards, the people with the least money and technology would pay the highest price for a convenience that mostly benefits others."],"band7":{"para":2,"text":"The drawbacks, but, should not be ignored. A cashless system exclude people who has no bank account or smartphone, such as some elderly or low-income residents, which may find that they can't pay for a bus ticket or a meal. Technology can also fail: during a power cut or a cyber-attack, a whole town might be unable buy food. Finally, electronic payments create a detailed record about what people buy, raising legitimate concerns for privacy.","faults":[["The drawbacks, but, should not be ignored","The drawbacks, however, should not be ignored","The correct linker."],["A cashless system exclude people who has no bank account","A cashless system excludes people who have no bank account","Agreement in both clauses."],["residents, which may find that they can't pay","residents, who may find that they cannot pay","<i>who<\/i> for people, and no contractions in formal writing."],["unable buy food","unable to buy food","<i>unable to<\/i> + verb."],["record about what people buy","record of what people buy","<i>a record of<\/i>."],["concerns for privacy","concerns about privacy","<i>concerns about<\/i>."]]},"ideas":[["Advantages","Payments are faster and cheaper for businesses.","No counting, storing or banking cash."],["Advantages","Security: no cash to steal.","A shop with no notes in the till."],["Advantages","Every payment leaves a record, which makes tax evasion and money laundering harder.","Traceable transactions."],["Disadvantages","It excludes people without bank accounts or smartphones.","Some elderly and low-income residents."],["Disadvantages","Technology can fail.","A power cut or a cyber-attack."],["Disadvantages","Privacy: companies hold data on what people buy.","Detailed records used for advertising."],["Balance","Keep cash available and promote safe digital options.","Laws that require shops to accept cash."]],"vocab":[["cashless society","A society that does not use banknotes and coins."],["speed up transactions","Make payments faster."],["launder money / evade tax","Crimes that digital records make harder."],["vulnerable groups","People at risk of exclusion."],["excluded from","Not able to take part."],["cyber-attack","An attack on computer systems."],["legitimate concerns","Reasonable worries: <i>legitimate concerns about privacy<\/i>."],["personal data","Information about individuals."],["come at the price of","Have a negative result: <i>these come at the price of inclusion<\/i>."],["encourage safe alternatives","A recommendation phrase."]],"notes":{"TR":"Both advantages and disadvantages are explained with precise examples, and the conclusion makes a practical recommendation that follows from them.","CC":"Body 1 = three linked advantages in logical order; body 2 = three drawbacks, with <i>Finally<\/i> introducing the one that is hardest to see. A final sentence of conclusion gives a balance.","LR":"<i>speed up transactions, launder money, evade tax, vulnerable, cyber-attack, legitimate concerns, come at the price of<\/i>.","GRA":"A colon explanation, causal clauses (<i>since, because<\/i>), a participle (<i>raising legitimate concerns<\/i>), relative clauses and conditional <i>might<\/i>."},"task":2},{"id":"t2-13","etype":"problem","label":"Problems & solutions · housing","short":"Unaffordable housing","title":"What can be done about unaffordable housing?","minutes":40,"prompt":"In many cities, housing has become too expensive for ordinary people to buy or rent.<br><br>What problems does this cause, and what can be done to solve them?","decode":{"q":"In many cities, [[housing has become too expensive]] for [[ordinary people to buy or rent]]. [[What problems does this cause, and what can be done to solve them?]]","why":"<b>Topic:<\/b> housing costs. <b>Two tasks:<\/b> (1) the problems caused, (2) the solutions. A problem–solution essay needs both in a clear order, and each solution should match a problem. Do not spend the whole essay on causes.","toks":[["In",-1],["many",-1],["cities,",-1],["housing",0],["has",0],["become",0],["too",0],["expensive",0],["for",-1],["ordinary",1],["people",1],["to",1],["buy",1],["or",1],["rent",1],[".",-1],["What",2],["problems",2],["does",2],["this",2],["cause,",2],["and",2],["what",2],["can",2],["be",2],["done",2],["to",2],["solve",2],["them?",2]],"n":3},"plan":{"thesis":["Unaffordable housing causes financial stress, long commutes and staff shortages, but these can be tackled by building more affordable homes and protecting tenants.","Housing is expensive because there are too many people in cities.","The government should solve the housing problem."],"ans":0,"why":"A previews both parts (problems, then solutions) and the specific measures. B is a cause with no solution, and C is a vague instruction.","pairs":[["Workers priced out of the city face long, costly commutes.","A teacher who cannot afford to live near the school spends three hours travelling each day."],["High rents leave little money for other needs and cause stress and debt.","A family spending half its income on rent cuts back on food, health care and savings."],["Governments can build more affordable and social housing.","A city that builds thousands of subsidised flats on public land gives low-income households a place to live."]],"note":"Ideas 1 and 2 are problems, idea 3 is a solution. In your essay, each solution must be explained to address a problem you described earlier."},"upgrade":[["People have to live far from work.",["People have to live far from their work and this is bad for them.","Many workers are forced to live in distant suburbs, spending hours commuting and losing time with their families.","Workers live a long way from their work because houses are expensive."],1,"B names the consequence and the cost (<i>hours commuting, losing time with family<\/i>). A and C repeat the idea in simple words."],["Rents are too high so people are stressed.",["Rents are too high and this makes people very stressed and unhappy.","When rent consumes half of a household's income, families fall into debt and struggle to afford food and health care.","People are stressed because rents are too high for them."],1,"B is specific (<i>half of a household's income<\/i>) and shows the result (<i>fall into debt<\/i>). A and C use general feelings."],["The government should build more houses.",["The government should build more houses so that everybody can have one.","Governments can increase the supply of affordable housing by building on public land and giving incentives to developers.","More houses should be built by the government in cities."],1,"B gives two concrete methods with a precise verb phrase (<i>increase the supply of<\/i>)."]],"order":{"para":1,"note":"First problem (workers pushed out) → example (teacher or nurse) → consequence for employers and services → second problem (financial stress) → its effect → a further effect for young adults. <i>As a result<\/i> and <i>A second problem<\/i> mark the logic.","sents":["The first problem is that workers are pushed out of the areas where they work.","For example, a teacher or nurse who cannot afford to live near the school or hospital may spend three hours a day travelling, which is exhausting, costly and takes time away from family life.","As a result, employers in expensive cities struggle to recruit staff for essential jobs, and public services suffer.","A second problem is financial stress.","When rent consumes half of a household's income, families cut back on food and health care, and many fall into debt.","Young adults are often forced to live with their parents into their thirties, delaying independence, marriage and children."]},"model":["In many large cities, the price of buying or renting a home has risen far faster than wages. This causes serious problems for ordinary families, but they can be reduced if governments act to increase the supply of affordable housing and to protect tenants.","The first problem is that workers are pushed out of the areas where they work. For example, a teacher or nurse who cannot afford to live near the school or hospital may spend three hours a day travelling, which is exhausting, costly and takes time away from family life. As a result, employers in expensive cities struggle to recruit staff for essential jobs, and public services suffer. A second problem is financial stress. When rent consumes half of a household's income, families cut back on food and health care, and many fall into debt. Young adults are often forced to live with their parents into their thirties, delaying independence, marriage and children.","Several measures could ease the crisis. Governments can increase the supply of affordable homes by building subsidised flats on public land and by giving developers incentives to include low-cost units in new projects. Limits on rent increases would protect tenants in the short term, while higher taxes on empty properties would discourage speculation. In the long term, better transport links to cheaper outer areas would reduce the pressure on city centres, giving workers more choice about where to live. These solutions work best together, because building homes takes years while rent protection helps families immediately.","In conclusion, unaffordable housing damages family finances, forces long commutes and threatens essential services. Increasing the supply of affordable homes, supported by rent protection and better transport, offers the most effective response."],"band7":{"para":2,"text":"Several measures could ease the crisis. Governments can increase the supply of affordable homes by build subsidised flats on public land and by give developers incentives to include low-cost units in new projects. Limits on rent increases would protect tenants in short term, while higher taxes on empty properties would discourage speculation. In long term, better transport links to cheaper outer areas would reduce the pressure on city centres, give workers more choice about where living.","faults":[["by build subsidised flats","by building subsidised flats","A gerund after a preposition."],["by give developers incentives","by giving developers incentives","A gerund after a preposition."],["in short term","in the short term","A fixed phrase with an article."],["In long term","In the long term","A fixed phrase with an article."],["give workers more choice about where living","giving workers more choice about where to live","A participle clause, and <i>where to live<\/i>."]]},"ideas":[["Problems","Workers priced out face long, costly commutes.","A nurse commuting three hours a day."],["Problems","Employers cannot recruit for essential jobs.","Schools and hospitals short of staff."],["Problems","High rents cause stress and debt.","Families spending half their income on rent."],["Problems","Young people delay independence, marriage and children.","Adults living with parents into their thirties."],["Solutions","Build more affordable and social housing.","Subsidised flats on public land."],["Solutions","Regulate rents and tax empty properties.","Rent increase limits; taxes on homes left empty."],["Solutions","Improve transport to cheaper outer areas.","A new rail line to a suburb."],["Solutions","Give developers incentives to include low-cost units.","Planning permission linked to affordable homes."]],"vocab":[["priced out","Unable to afford to live somewhere: <i>workers are priced out<\/i>."],["affordable housing","Homes ordinary people can pay for."],["subsidised / social housing","Homes with government support."],["consume half of a household's income","Cost a large share of earnings."],["fall into debt","Start owing money."],["increase the supply of","Provide more of: <i>the supply of affordable homes<\/i>."],["speculation","Buying property only to sell at a profit."],["rent control / limits on rent increases","Rules that cap rents."],["essential jobs / public services","Teachers, nurses, firefighters."],["ease the crisis","Make a serious problem less severe."]],"notes":{"TR":"Both parts are answered fully: two problems (commuting and financial stress) and a package of solutions that clearly match them.","CC":"Problems in one body paragraph, solutions in the next, in the same order of importance. <i>As a result, A second problem, In the short term / long term<\/i> keep the structure clear.","LR":"<i>priced out, essential jobs, consumes, subsidised, speculation, ease the crisis<\/i>.","GRA":"Relative clauses (<i>who cannot afford…<\/i>), a participle clause (<i>giving workers more choice<\/i>), conditionals and passives (<i>are pushed out<\/i>)."},"task":2},{"id":"t2-14","etype":"problem","label":"Problems & solutions · society","short":"Loneliness in big cities","title":"Why are people lonely in cities, and what can be done?","minutes":40,"prompt":"Many people in big cities feel lonely and isolated, even though they live among millions of others.<br><br>What are the causes of this problem, and what can be done to solve it?","decode":{"q":"Many people in [[big cities]] [[feel lonely and isolated]], even though they live among millions of others. [[What are the causes of this problem, and what can be done to solve it?]]","why":"<b>Topic:<\/b> loneliness in cities. <b>Two tasks:<\/b> the causes, then the solutions. The phrase <i>even though they live among millions of others<\/i> signals that the problem is surprising: your causes should explain it.","toks":[["Many",-1],["people",-1],["in",-1],["big",0],["cities",0],["feel",1],["lonely",1],["and",1],["isolated",1],[",",-1],["even",-1],["though",-1],["they",-1],["live",-1],["among",-1],["millions",-1],["of",-1],["others.",-1],["What",2],["are",2],["the",2],["causes",2],["of",2],["this",2],["problem,",2],["and",2],["what",2],["can",2],["be",2],["done",2],["to",2],["solve",2],["it?",2]],"n":3},"plan":{"thesis":["Loneliness in cities is caused mainly by busy lifestyles, constant mobility and a reliance on screens, and it can be reduced by community spaces and activities that bring people together.","Cities are lonely because there are too many people.","Loneliness is a feeling that many people have."],"ans":0,"why":"A names the three causes and previews the solution, which becomes the plan of the essay. B is a weak explanation and C describes a feeling without answering.","pairs":[["Long working hours and commutes leave little time for friends.","A manager who leaves home at seven and returns at nine has no energy to meet neighbours."],["People rely on phones and social media instead of meeting in person.","A group of friends who message each other all week may rarely meet."],["Community centres and shared spaces help neighbours meet.","A weekly neighbourhood market or a community garden gives strangers a reason to talk."]],"note":"Ideas 1 and 2 are causes, idea 3 is a solution. A strong essay matches each cause with a solution."},"upgrade":[["People work a lot so they have no time.",["People work a lot and have no time for anything else.","Long working hours and tiring commutes leave city dwellers with little time or energy to build friendships.","People are very busy at work, so they cannot meet their friends."],1,"B uses precise nouns (<i>working hours, commutes, friendships<\/i>) and a precise verb phrase. A and C use <i>a lot, very busy<\/i>."],["People talk on phones more than they meet.",["People talk on phones and the internet more than they meet in real life.","Online communication can replace, rather than supplement, face-to-face contact, leaving people connected yet lonely.","People like phones more than they like meeting people."],1,"B hedges (<i>can<\/i>), contrasts (<i>replace, rather than supplement<\/i>) and ends with a participle phrase."],["Cities should have more places for people to meet.",["Cities should have more places where people can meet and this will make them happy.","Local authorities can fund community centres, parks and events that give neighbours reasons to meet.","More places for people to meet should be built by the city."],1,"B says who should act (<i>local authorities<\/i>) and what they should fund, with a relative clause."]],"order":{"para":1,"note":"First cause (the pace of urban life) → how it works → an example (the manager) → a second cause (mobility) → a third cause (technology) → its effect. <i>In addition<\/i> and <i>A third cause<\/i> list the causes.","sents":["One major cause is the pace of urban life.","Long working hours and tiring commutes leave city dwellers with little time or energy to build friendships, and a manager who leaves home at seven and returns at nine may not even know the neighbours.","In addition, people move frequently for work or study, so social networks are constantly broken and have to be rebuilt.","A third cause is technology.","Messaging and social media allow people to stay in contact with little effort, but they can replace, rather than supplement, face-to-face meetings, leaving people connected yet lonely."]},"model":["Despite living among millions of people, many city dwellers describe themselves as lonely. This problem has several causes, but it can be reduced by measures that bring people together and by a change in how we use technology.","One major cause is the pace of urban life. Long working hours and tiring commutes leave city dwellers with little time or energy to build friendships, and a manager who leaves home at seven and returns at nine may not even know the neighbours. In addition, people move frequently for work or study, so social networks are constantly broken and have to be rebuilt. A third cause is technology. Messaging and social media allow people to stay in contact with little effort, but they can replace, rather than supplement, face-to-face meetings, leaving people connected yet lonely.","There are practical ways to tackle the problem. Local authorities can fund community centres, parks and regular events, such as neighbourhood markets or community gardens, that give strangers a natural reason to talk. Employers can help by offering flexible hours and encouraging social activities, so that work does not consume all of an employee's free time. Finally, individuals should make a conscious effort to meet in person, for example by joining a sports club or volunteering, since shared activity builds friendships more quickly than conversation alone.","In conclusion, loneliness in cities is caused mainly by busy lifestyles, constant mobility and a reliance on screens. Community spaces, flexible work and a deliberate effort to meet in person can all help to create stronger social bonds, and these changes need little money, yet they could make crowded cities feel much more welcoming."],"band7":{"para":1,"text":"One major cause is the pace of urban life. Long working hours and tired commutes leave city dwellers with little time or energy for build friendships, and a manager who leave home at seven and return at nine may not even know the neighbours. In addition, people moves frequently for work or study, so social networks is constantly broken. A third cause is technology. Messaging and social media allow people to stay in contact easily, but they can replace face-to-face meetings, so people are connected but are lonely.","faults":[["tired commutes","tiring commutes","<i>-ing<\/i> for the thing that causes tiredness."],["for build friendships","to build friendships","Purpose: <i>to<\/i> + verb."],["who leave home at seven and return at nine","who leaves home at seven and returns at nine","Agreement."],["people moves frequently","people move frequently","Agreement."],["social networks is constantly broken","social networks are constantly broken","Agreement."],["so people are connected but are lonely","leaving people connected yet lonely","A participle phrase is more concise, and <i>yet<\/i> expresses the paradox."]]},"ideas":[["Causes","Long working hours and tiring commutes leave little time.","A manager out of the house from seven to nine."],["Causes","Frequent moves break up social networks.","People who change city for work or study."],["Causes","Technology can replace face-to-face contact.","Friends who message all week but rarely meet."],["Causes","Weak neighbourhood ties and anonymous housing.","High-rise buildings where neighbours do not know each other."],["Solutions","Community centres, parks and regular local events.","Neighbourhood markets, community gardens."],["Solutions","Flexible working hours and employer-organised social activities.","Companies that offer a shorter working day."],["Solutions","Individuals making an effort to meet in person.","Joining a sports club or volunteering."]],"vocab":[["city dwellers","People who live in a city."],["isolated / socially disconnected","Without contact."],["tiring commutes","Journeys to work that exhaust people."],["social networks","The circle of friends and acquaintances (not only online)."],["supplement / replace","Add to / take the place of."],["face-to-face contact","Meeting in person."],["community gardens","Shared growing spaces."],["a conscious effort","A deliberate attempt."],["create stronger social bonds","Build closer relationships."],["connected yet lonely","A paradox phrase."]],"notes":{"TR":"Three causes are explained and three solutions match them one by one. The paradox in the question (lonely among millions) is explicitly addressed.","CC":"Causes in order of importance (pace of life, mobility, technology), then solutions by who acts (authorities, employers, individuals). <i>In addition, A third cause, Finally<\/i> sequence the points.","LR":"<i>city dwellers, tiring commutes, supplement, face-to-face, community gardens, social bonds<\/i>.","GRA":"Participle clause (<i>leaving people connected yet lonely<\/i>), relative clauses, <i>so that<\/i>, <i>by<\/i> + <i>-ing<\/i> and a comparative (<i>more quickly than<\/i>)."},"task":2},{"id":"t2-15","etype":"problem","label":"Problems & solutions · culture","short":"Disappearing languages","title":"Protecting the world's languages","minutes":40,"prompt":"Many of the world's languages are disappearing.<br><br>What problems does this cause, and what can be done to protect them?","decode":{"q":"Many of the world's [[languages are disappearing]]. [[What problems does this cause]], and [[what can be done to protect them?]]","why":"<b>Topic:<\/b> language loss. <b>Two tasks:<\/b> the problems it causes, then the protective measures. The solutions must be about <i>protecting languages<\/i>, not about why they disappear.","toks":[["Many",-1],["of",-1],["the",-1],["world's",-1],["languages",0],["are",0],["disappearing",0],[".",-1],["What",1],["problems",1],["does",1],["this",1],["cause",1],[",",-1],["and",-1],["what",2],["can",2],["be",2],["done",2],["to",2],["protect",2],["them?",2]],"n":3},"plan":{"thesis":["The loss of a language destroys cultural knowledge and identity, but it can be slowed by teaching minority languages in schools, recording them and giving them a place in public life.","Languages disappear because people want to speak English.","Languages are important to people all over the world."],"ans":0,"why":"A names the two problems (knowledge and identity) and three solutions in one sentence. B is only a cause, and C is a general claim.","pairs":[["A language carries unique knowledge about nature, history and culture.","Indigenous words for local plants and seasons contain knowledge that scientists have not recorded elsewhere."],["When young people stop speaking a language, communities lose identity and links between generations.","Grandparents who speak only the old language cannot easily share stories with grandchildren who speak the national language."],["Schools and media can keep a language alive.","A radio station and a primary school that teach in a minority language give children reasons to use it."]],"note":"Ideas 1 and 2 are problems, idea 3 is a solution. In the essay, show that the solution addresses the loss of knowledge and identity."},"upgrade":[["When a language dies, a lot of knowledge is lost.",["When a language dies, a lot of knowledge about many things is lost forever.","Each language that vanishes takes with it unique knowledge of local ecology, history and customs.","A language that disappears takes some knowledge with it, and this is a pity."],1,"B names the kinds of knowledge and uses a precise verb phrase (<i>takes with it<\/i>). A and C are vague."],["Young people do not want to speak old languages.",["Young people do not want to speak old languages because they think they are not useful.","Many young people abandon minority languages in favour of dominant ones, which they associate with education and jobs.","Young people prefer to speak languages that are more modern than the old ones."],1,"B explains why with a relative clause (<i>which they associate with…<\/i>). A and C use simple words."],["Schools should teach the languages.",["Schools should teach these languages so that children can learn them.","Introducing minority languages into the school curriculum would give children both the skills and the pride to keep them alive.","The languages should be taught in schools by teachers."],1,"B uses a subject gerund phrase and says what the result would be."]],"order":{"para":1,"note":"Main problem (loss of knowledge) → what is lost → example (indigenous words) → second problem (identity) → illustration (grandparents) → effect on the community. <i>A second problem<\/i> and <i>eventually<\/i> mark the progression.","sents":["The most serious problem is the loss of knowledge.","Each language that vanishes takes with it unique information about local ecology, history and customs; indigenous words for plants and seasons, for example, may contain knowledge that scientists have never recorded.","A second problem is the weakening of identity.","When young people stop speaking the language of their ancestors, links between generations break down, and grandparents who speak only the old language cannot share their stories with grandchildren who use the national language.","A community may eventually lose its sense of who it is."]},"model":["Linguists estimate that thousands of the world's languages may disappear within this century. The loss of a language is not simply a loss of words, but of a way of understanding the world, and several practical steps could slow it.","The most serious problem is the loss of knowledge. Each language that vanishes takes with it unique information about local ecology, history and customs; indigenous words for plants and seasons, for example, may contain knowledge that scientists have never recorded. A second problem is the weakening of identity. When young people stop speaking the language of their ancestors, links between generations break down, and grandparents who speak only the old language cannot share their stories with grandchildren who use the national language. A community may eventually lose its sense of who it is.","Governments and communities can act in several ways. Schools can teach minority languages as part of the curriculum, giving children the skills and the pride to keep them alive, and radio, television and online media can broadcast in them so that they remain useful in daily life. Linguists should record elders speaking and create dictionaries and teaching materials before this knowledge is lost. Most importantly, young people need to see that a language can bring opportunities, so official recognition and jobs that require it would give it real value.","In conclusion, the disappearance of languages harms both knowledge and identity. Education, media support and careful recording can slow this loss, provided that speakers themselves feel that their language has a future, and every language saved preserves a different way of seeing the world."],"band7":{"para":2,"text":"Governments and communities can act in several ways. Schools can teach minority languages as part of the curriculum, giving children the skills and the pride for keep them alive, and radio, television and online media can broadcast in them so that they remains useful in daily life. Linguists should record elders speak and create dictionaries and teaching materials before this knowledge lost. Most important, young people need to see that a language can bring opportunities, so official recognition and jobs that require it would give it a real value.","faults":[["the pride for keep them alive","the pride to keep them alive","Purpose: <i>to<\/i> + verb."],["so that they remains useful","so that they remain useful","Agreement."],["record elders speak","record elders speaking","<i>record<\/i> + object + <i>-ing<\/i>."],["before this knowledge lost","before this knowledge is lost","A passive needs <i>is<\/i>."],["Most important, young people","Most importantly, young people","A sentence adverb."],["give it a real value","give it real value","<i>value<\/i> is uncountable here."]]},"ideas":[["Problems","Loss of unique knowledge about nature, history and customs.","Indigenous words for plants and seasons."],["Problems","Weakened identity and broken links between generations.","Grandparents and grandchildren who share no language."],["Problems","A loss of cultural diversity and ways of thinking.","Unique stories, songs and sayings that cannot be translated."],["Solutions","Teach minority languages in schools.","A primary school that teaches in the local language."],["Solutions","Use them in media and public life.","Radio and online programmes; official signs."],["Solutions","Record and document them before it is too late.","Recording elders, writing dictionaries."],["Solutions","Make the language useful for jobs and status.","Public-sector jobs that require the language."]],"vocab":[["linguist","An expert in languages."],["minority / indigenous language","A language spoken by a small or native group."],["vanish / die out / become extinct","Disappear completely."],["local ecology","Knowledge of the natural environment."],["customs and traditions","Habits passed through generations."],["links between generations","Connections between old and young."],["the curriculum","The subjects taught in schools."],["document / record","Write down or film a language."],["official recognition","Formal status given by government."],["give … real value","Make it matter in daily life."]],"notes":{"TR":"Two problems and a set of solutions that fit them: education (identity), recording (knowledge) and official status (value). The essay stays on language protection throughout.","CC":"Problems in body 1, solutions in body 2, with the final sentence of each paragraph pointing to the next idea. <i>A second problem, Most importantly<\/i> structure each paragraph.","LR":"<i>vanish, indigenous, local ecology, links between generations, curriculum, official recognition<\/i>.","GRA":"Participle clauses (<i>giving children…, recording…<\/i>), relative clauses, a conditional (<i>would give it real value<\/i>) and <i>so that<\/i>."},"task":2},{"id":"t2-16","etype":"twopart","label":"Two-part question · population","short":"An ageing population","title":"Why are populations ageing, and what will the effects be?","minutes":40,"prompt":"In many countries, the proportion of older people in the population is increasing.<br><br>Why is this happening? What effects will it have on society?","decode":{"q":"In many countries, [[the proportion of older people in the population is increasing]]. [[Why is this happening?]] [[What effects will it have on society?]]","why":"<b>Topic:<\/b> population ageing. <b>Two separate questions:<\/b> (1) <i>why<\/i> (causes) and (2) <i>what effects<\/i> (consequences). A two-part essay answers each question in its own body paragraph, in the same order. Unlike a problem–solution essay, there is no need to suggest solutions.","toks":[["In",-1],["many",-1],["countries,",-1],["the",0],["proportion",0],["of",0],["older",0],["people",0],["in",0],["the",0],["population",0],["is",0],["increasing",0],[".",-1],["Why",1],["is",1],["this",1],["happening?",1],["What",2],["effects",2],["will",2],["it",2],["have",2],["on",2],["society?",2]],"n":3},"plan":{"thesis":["The population is ageing because people live longer and have fewer children, and the main effects will be pressure on health care and pensions and a shortage of workers.","Old people are a problem for society because they do not work.","Many countries have more older people than before."],"ans":0,"why":"A answers both questions in a single sentence, in the order of the body paragraphs. B is an offensive and one-sided judgement and C repeats the question.","pairs":[["Better health care, nutrition and living conditions mean people live longer.","Vaccines and treatments for heart disease allow many people to reach their eighties and nineties."],["Falling birth rates mean fewer young people to balance the numbers.","Couples who delay children for careers or because of housing costs often have only one child or none."],["An older population increases demand for health care and pensions while fewer people pay taxes.","A country with two workers for every pensioner finds it harder to fund hospitals than one with five."]],"note":"Ideas 1 and 2 answer <i>Why<\/i>; idea 3 answers <i>What effects<\/i>. The examples are logical and could be real."},"upgrade":[["People live longer because of better medicine.",["People live longer because the medicine is very good now.","Advances in medicine, nutrition and sanitation have steadily raised life expectancy in most countries.","Medicine is better, so old people live a lot longer than before."],1,"B lists three specific causes and uses a precise phrase (<i>steadily raised life expectancy<\/i>). A and C use <i>very good, a lot longer<\/i>."],["Fewer babies are born.",["Fewer babies are born, so there are fewer young people in the population.","Falling birth rates, linked to later marriage and the cost of raising children, mean that each generation is smaller than the one before.","People are having fewer children these days."],1,"B gives a reason and a clear consequence (<i>each generation is smaller<\/i>). A and C only restate the fact."],["Governments will need more money for old people.",["Governments will need much more money to look after old people.","Ageing populations will place heavy demands on health services and pension systems, forcing governments to raise taxes or retirement ages.","More money will be needed by the government for old people."],1,"B uses a precise noun phrase and ends with a participle clause that shows consequences."]],"order":{"para":1,"note":"First reason (longer lives) → evidence → second reason (falling birth rates) → why → the combined effect on the population. <i>The first reason, The second reason, therefore<\/i> keep the answer to <i>Why<\/i> organised.","sents":["The
