 first reason is that people are living longer.","Advances in medicine, nutrition and sanitation have steadily raised life expectancy, and treatments for conditions such as heart disease allow many people to reach their eighties and nineties.","The second reason is that birth rates are falling.","Women now have greater opportunities to study and work, many couples delay having children because of the cost of housing and raising a family, and as a result many have only one child or none.","Each generation is therefore smaller than the one before, which makes the elderly a larger proportion of the whole."]},"model":["In many countries, older people make up a growing share of the population. This trend has two main causes, longer life expectancy and falling birth rates, and its effects will include higher costs for health care and pensions and a shortage of workers, which governments need to plan for now.","The first reason is that people are living longer. Advances in medicine, nutrition and sanitation have steadily raised life expectancy, and treatments for conditions such as heart disease allow many people to reach their eighties and nineties. The second reason is that birth rates are falling. Women now have greater opportunities to study and work, many couples delay having children because of the cost of housing and raising a family, and as a result many have only one child or none. Each generation is therefore smaller than the one before, which makes the elderly a larger proportion of the whole.","The effects on society will be significant. An older population needs more medical care, long-term nursing and pensions, while a smaller working-age group pays the taxes that fund them. A country with two workers for every pensioner, for example, will find it much harder to finance hospitals than one with five. Businesses may also struggle to find skilled employees, and housing and transport will need to be redesigned for people with limited mobility. On the other hand, older people also contribute, as carers, volunteers and experienced workers, and societies that make use of them may benefit.","In conclusion, ageing populations result from longer lives and smaller families, and they will raise the cost of services while shrinking the workforce. Governments can respond by raising retirement ages gradually, encouraging older people to stay active and investing in health prevention."],"band7":{"para":2,"text":"The effects on society will be significant. An older population need more medical care, long-term nursing and pensions, while a more small working-age group pay the taxes who fund them. A country with two workers for every pensioner, for example, will find it much more hard to finance hospitals than one with five. Businesses may also struggle to find skilled employees, and housing and transport will need to redesign for people with limited mobility.","faults":[["An older population need more medical care","An older population needs more medical care","Agreement with a singular subject."],["a more small working-age group pay the taxes who fund them","a smaller working-age group pays the taxes that fund them","A comparative, agreement, and <i>that<\/i> for things."],["much more hard to finance hospitals","much harder to finance hospitals","One-syllable adjective: <i>-er<\/i>."],["will need to redesign for people","will need to be redesigned for people","A passive infinitive."]]},"ideas":[["Why","Medical advances, better nutrition and sanitation raise life expectancy.","Vaccines, heart-disease treatment."],["Why","Falling birth rates make each generation smaller.","Couples delaying children for careers or housing costs."],["Why","Women's education and work change family decisions.","Women with careers having fewer children."],["Effects","More demand for health care, nursing and pensions.","Hospitals and care homes under pressure."],["Effects","A smaller workforce pays the taxes that fund services.","Two workers for every pensioner."],["Effects","Skills shortages and changes to housing and transport.","Buildings redesigned for limited mobility."],["Effects","Older people also contribute as carers, volunteers and workers.","Grandparents who look after children; retired professionals who volunteer."]],"vocab":[["life expectancy","The average number of years a person lives."],["birth rate","The number of births per thousand people."],["sanitation","Clean water and sewage systems."],["working-age group","People aged roughly 15 to 64."],["pensioner / pension system","A retired person / the way retirement income is paid."],["long-term nursing / elderly care","Care for older people."],["limited mobility","Difficulty moving around."],["skills shortages","Not enough qualified workers."],["raise the retirement age","Make people work longer."],["make use of","Use well: <i>societies that make use of older people<\/i>."]],"notes":{"TR":"Both questions are answered fully and separately: two reasons (longer lives, fewer children) and several effects (costs, workforce, planning, but also contributions). The conclusion answers both again.","CC":"Body 1 answers <i>Why<\/i> (first reason, second reason, summary), body 2 answers <i>What effects<\/i> (costs, workforce, planning, balance). The order matches the questions.","LR":"<i>life expectancy, birth rates, working-age group, pensioner, long-term nursing, limited mobility<\/i>.","GRA":"<i>while<\/i> contrast, relative clauses (<i>which makes the elderly…<\/i>), passive infinitive (<i>will need to be redesigned<\/i>) and a calculation with comparatives."},"task":2},{"id":"t2-17","etype":"twopart","label":"Two-part question · technology","short":"Sharing personal information online","title":"Why do people share so much online, and should they worry?","minutes":40,"prompt":"Many people share personal information, such as photos and opinions, on social media.<br><br>Why do people do this? Should they be worried about the risks of sharing so much?","decode":{"q":"Many people [[share personal information, such as photos and opinions, on social media]]. [[Why do people do this?]] [[Should they be worried about the risks of sharing so much?]]","why":"<b>Topic:<\/b> sharing personal information online. <b>Two separate questions:<\/b> (1) the reasons, (2) whether people should worry. The second is a <b>yes/no judgement question<\/b>: you must answer it directly (yes, with qualifications), not just list risks.","toks":[["Many",-1],["people",-1],["share",0],["personal",0],["information,",0],["such",0],["as",0],["photos",0],["and",0],["opinions,",0],["on",0],["social",0],["media",0],[".",-1],["Why",1],["do",1],["people",1],["do",1],["this?",1],["Should",2],["they",2],["be",2],["worried",2],["about",2],["the",2],["risks",2],["of",2],["sharing",2],["so",2],["much?",2]],"n":3},"plan":{"thesis":["People share personal details online because they want connection, approval and self-expression, and they should be concerned about privacy, security and reputation, although sensible precautions can reduce the risks.","Social media is dangerous and everyone should stop using it.","Many people use social media every day."],"ans":0,"why":"A answers both questions in order, with a clear position on the second. B is an extreme opinion that ignores the first question, and C repeats the topic.","pairs":[["People want connection and approval from friends and family.","A user who posts holiday photos receives likes and comments that make them feel valued."],["Personal data can be misused by criminals and companies.","Information in a public profile, such as a birthday and address, can help a criminal steal an identity."],["Posts can damage reputations and future opportunities.","An employer who finds an offensive post from years ago may reject a job applicant."]],"note":"Idea 1 answers <i>Why<\/i>; ideas 2 and 3 answer <i>Should they be worried<\/i>. The examples are realistic situations."},"upgrade":[["People post photos because they like likes.",["People post photos because they like to get likes and feel popular.","Sharing photos brings instant approval from friends, which satisfies a basic human need to feel valued and connected.","People post photos to show their life to everyone."],1,"B names the need behind the behaviour (<i>to feel valued and connected<\/i>). A and C describe the behaviour in simple words."],["Criminals can use your information.",["Criminals can use your information to do bad things to you.","Details such as a birthday, address or holiday dates can be used by criminals to steal identities or burgle empty homes.","You should not tell criminals about your life."],1,"B lists specific details and crimes with a passive. A and C are vague or informal."],["Old posts can cause problems later.",["Old posts can cause problems for people later in their lives.","Posts that seemed harmless at the time can resurface years later and damage a person's reputation or career.","Posts from the past may be a problem in the future."],1,"B uses a relative clause and precise verbs (<i>resurface, damage<\/i>) and names the consequence."]],"order":{"para":1,"note":"Introduce the answer (several reasons) → first reason (connection) → an example (holiday photos) → second reason (self-expression) → third reason (platform design). <i>First, Second, Finally<\/i> organise the answer to <i>Why<\/i>.","sents":["There are several reasons why people share so much.","First, social media satisfies the desire to feel valued and connected.","A user who posts holiday photos receives likes and comments from friends within minutes, which provides instant approval and strengthens relationships, especially with people who live far away.","Second, it gives people a space for self-expression, allowing them to present a chosen image of themselves and to share opinions with an audience.","Finally, platforms are designed to encourage sharing, using notifications and rewards that make it feel normal and even expected."]},"model":["Social media has made it normal for people to share photos, opinions and even their locations with hundreds of contacts. People do this mainly because of basic human needs for connection and approval, and I believe they should be concerned about the risks, although simple precautions can reduce them.","There are several reasons why people share so much. First, social media satisfies the desire to feel valued and connected. A user who posts holiday photos receives likes and comments from friends within minutes, which provides instant approval and strengthens relationships, especially with people who live far away. Second, it gives people a space for self-expression, allowing them to present a chosen image of themselves and to share opinions with an audience. Finally, platforms are designed to encourage sharing, using notifications and rewards that make it feel normal and even expected.","Nevertheless, people should be worried about the risks. Details such as a birthday, an address or holiday dates can be used by criminals to steal identities or to burgle empty homes. Companies also collect and sell personal data to advertisers, often without users fully understanding what they have agreed to. Posts can damage reputations, too: material that seemed harmless at the time may resurface years later, and an employer who finds an offensive comment may reject an otherwise suitable applicant. Because information spreads quickly and is rarely deleted, mistakes can follow people for life.","In conclusion, people share personal information online because it meets their need for approval, connection and self-expression, but they should treat privacy seriously. Using strict privacy settings, thinking carefully before posting and keeping sensitive details private can allow users to enjoy the benefits while limiting the dangers."],"band7":{"para":2,"text":"Nevertheless, people should be worry about the risks. Details such as a birthday, an address or holiday dates can be used by criminals for steal identities or to burgle empty homes. Companies also collect and sell personal data to advertisers, often without users understand what they have agreed. Posts can damage reputations, too: material that seemed harmless at the time may resurface years later, and an employer who find an offensive comment may reject a suitable applicant.","faults":[["should be worry about the risks","should be worried about the risks","The participle adjective <i>worried<\/i>."],["for steal identities or to burgle","to steal identities or to burgle","Parallel infinitives of purpose."],["without users understand what they have agreed","without users fully understanding what they have agreed to","<i>without<\/i> + <i>-ing<\/i>, and <i>agree to<\/i>."],["an employer who find an offensive comment","an employer who finds an offensive comment","Agreement."]]},"ideas":[["Why people share","They want connection and approval from friends and family.","Likes and comments on holiday photos."],["Why people share","Self-expression: presenting an image and opinions.","A user who posts about hobbies and views."],["Why people share","Platforms are designed to encourage sharing.","Notifications, rewards and constant prompts."],["Why people share","Social pressure: it feels normal to share.","Friends who all post and expect responses."],["Worries: yes","Criminals can misuse personal details.","A birthday and address used for identity theft."],["Worries: yes","Companies collect and sell data.","Advertising profiles built from posts."],["Worries: yes","Posts can harm reputations and jobs.","An old offensive comment found by an employer."],["Reducing the risk","Privacy settings, careful posting, keeping sensitive details private.","Not sharing holiday dates publicly."]],"vocab":[["personal data / sensitive details","Information that identifies a person."],["instant approval","Immediate positive feedback."],["self-expression","Showing one's personality and ideas."],["steal an identity","Use another person's details to commit fraud."],["burgle an empty home","Break into a house when nobody is there."],["resurface","Appear again after a long time."],["damage a reputation","Harm how others see you."],["privacy settings","Controls that limit who can see posts."],["legitimate concerns","Reasonable worries."],["strict / sensible precautions","Careful safety measures."]],"notes":{"TR":"Both questions are answered separately and fully: three reasons for sharing, then a clear yes (with precautions) to the question about worry, with specific risks.","CC":"Body 1 answers <i>Why<\/i> with <i>First, Second, Finally<\/i>. Body 2 answers the risks question, introduced by <i>Nevertheless<\/i>. The conclusion answers both questions again.","LR":"<i>instant approval, self-expression, resurface, privacy settings, steal identities, personal data<\/i>.","GRA":"Participle clauses (<i>allowing them to present…, using notifications<\/i>), passive (<i>are designed to<\/i>), a relative clause (<i>who finds…<\/i>) and <i>although<\/i> contrast."},"task":2},{"id":"t2-18","etype":"twopart","label":"Two-part question · public money","short":"Spending on major sports events","title":"Why do governments host big sports events, and is it worth it?","minutes":40,"prompt":"Governments in many countries spend large amounts of public money on hosting major sporting events such as the Olympic Games.<br><br>Why do governments do this? Is it a good use of public money?","decode":{"q":"[[Governments]] in many countries [[spend large amounts of public money on hosting major sporting events]] such as the Olympic Games. [[Why do governments do this?]] [[Is it a good use of public money?]]","why":"<b>Topic:<\/b> public spending on sporting events. <b>Two questions:<\/b> (1) the reasons governments have, (2) a judgement on value for money. Question 2 is not the same as “are there disadvantages?”: you must decide whether the money is well spent and defend it.","toks":[["Governments",0],["in",-1],["many",-1],["countries",-1],["spend",1],["large",1],["amounts",1],["of",1],["public",1],["money",1],["on",1],["hosting",1],["major",1],["sporting",1],["events",1],["such",-1],["as",-1],["the",-1],["Olympic",-1],["Games.",-1],["Why",2],["do",2],["governments",2],["do",2],["this?",2],["Is",3],["it",3],["a",3],["good",3],["use",3],["of",3],["public",3],["money?",3]],"n":4},"plan":{"thesis":["Governments host major events for prestige, tourism and regeneration, but I believe the cost is rarely justified unless the facilities are used for years afterwards.","Governments waste money on sport because they do not care about the poor.","The Olympic Games take place every four years."],"ans":0,"why":"A answers both questions: the reasons (prestige, tourism, regeneration) and a qualified judgement (rarely justified unless…). B is an unsupported accusation and C is a fact with no argument.","pairs":[["Hosting brings international prestige and national pride.","A country that stages a successful opening ceremony is watched by billions of viewers and gains a positive image."],["Events can boost tourism and regenerate run-down districts.","A derelict riverside area is transformed into a park, housing and transport links for the Games."],["Costs often exceed budgets and facilities can become empty ‘white elephants’.","A stadium built for a few weeks is left almost unused afterwards while its upkeep costs millions."]],"note":"Ideas 1 and 2 answer <i>Why<\/i>; idea 3 answers <i>Is it a good use of money<\/i>. The best essays also show where the answer depends on conditions."},"upgrade":[["Governments want to show the world how good they are.",["Governments want to show everyone how good and rich their country is.","Hosting a global event allows a country to showcase its culture and capabilities to an audience of billions.","A country shows the world how great it is by hosting the Olympics."],1,"B uses precise verbs (<i>showcase<\/i>) and a specific image (<i>an audience of billions<\/i>). A and C use simple words."],["Sports events bring tourists and money.",["Sports events bring a lot of tourists, and tourists spend a lot of money.","Major events can attract visitors and investment, and often accelerate improvements to transport and housing.","Many tourists come for sports events, so the country makes money."],1,"B uses hedged, precise language (<i>can attract, often accelerate<\/i>) and adds a second benefit."],["But stadiums cost too much and are not used after.",["But stadiums cost too much money and are not used much after the event.","However, purpose-built stadiums can cost millions to maintain and may stand empty once the event has finished.","Stadiums are expensive and later people do not use them."],1,"B names the cost (<i>millions to maintain<\/i>) and the problem (<i>stand empty<\/i>) precisely."]],"order":{"para":1,"note":"Introduce the answer to Why → first reason (prestige) → how it works → second reason (economic) → an example (a derelict district) → a political motive. <i>The first, The second, also<\/i> organise the reasons.","sents":["There are several reasons why governments take on this expense.","The first is prestige.","A successful opening ceremony is watched by billions of viewers, giving a country the chance to showcase its culture and capabilities and to build national pride.","The second is economic: major events can attract visitors and investment, and they often speed up improvements to transport and housing.","A derelict riverside district, for example, may be transformed into a park, flats and rail links because the Games need them.","Politicians also hope that success will be remembered by voters."]},"model":["Hosting a major event such as the Olympic Games requires billions of dollars of public money, yet governments compete to stage them. They do so mainly for prestige, tourism and regeneration, but in my view the investment is rarely justified unless the facilities are used for years afterwards.","There are several reasons why governments take on this expense. The first is prestige. A successful opening ceremony is watched by billions of viewers, giving a country the chance to showcase its culture and capabilities and to build national pride. The second is economic: major events can attract visitors and investment, and they often speed up improvements to transport and housing. A derelict riverside district, for example, may be transformed into a park, flats and rail links because the Games need them. Politicians also hope that success will be remembered by voters.","However, the economic case is often weaker than it appears. Costs regularly exceed budgets, and the money spent on a stadium that is used for only a few weeks could have built schools or hospitals that serve people for decades. Some cities are left with empty venues that cost millions a year to maintain, while the extra tourists displace other visitors rather than increasing the total. On the other hand, events that reuse existing facilities or leave useful infrastructure can represent good value.","In conclusion, governments seek prestige and economic benefits when they host major sporting events, but the cost frequently outweighs the gain. Public money would be better spent on such events only when new facilities will serve the community long after the closing ceremony has ended."],"band7":{"para":2,"text":"However, the economic case is often more weak than it appears. Costs regular exceed budgets, and the money spend on a stadium that is used for only a few weeks could have built schools or hospitals that serves people for decades. Some cities are left with empty venues who cost millions a year to maintain, while the extra tourists displace other visitors rather than increase the total. On the other hand, events that reuse existing facilities or leave useful infrastructure can represent a good value.","faults":[["more weak than it appears","weaker than it appears","A short adjective takes <i>-er<\/i>."],["Costs regular exceed budgets","Costs regularly exceed budgets","An adverb modifies a verb."],["the money spend on a stadium","the money spent on a stadium","A reduced passive relative clause."],["hospitals that serves people","hospitals that serve people","Agreement with a plural noun."],["empty venues who cost millions","empty venues that cost millions","<i>that<\/i> for things."],["rather than increase the total","rather than increasing the total","Parallel with <i>displace<\/i>: <i>rather than<\/i> + <i>-ing<\/i>."],["represent a good value","represent good value","<i>value<\/i> is uncountable in this phrase."]]},"ideas":[["Why governments host","Prestige and national pride from global exposure.","An opening ceremony watched by billions."],["Why governments host","Tourism and investment.","Visitors who spend on hotels and restaurants."],["Why governments host","Regeneration of run-down areas and faster infrastructure.","A derelict riverside district turned into a park and flats."],["Why governments host","Political motives: success can win votes.","Leaders who are associated with a successful Games."],["Good use of money?","Costs often exceed budgets.","A stadium built for a few weeks."],["Good use of money?","Empty venues cost millions to maintain.","Stadiums with few events afterwards."],["Good use of money?","The same money could fund schools and hospitals.","A hospital that serves people for decades."],["Good use of money?","Reusing existing facilities can offer good value.","Events held in cities that already have stadiums."]],"vocab":[["showcase","Display attractively: <i>showcase its culture<\/i>."],["national pride / international prestige","Positive feelings about a country."],["regeneration / regenerate","Improve a run-down area."],["derelict","Abandoned and in poor condition."],["exceed the budget","Cost more than planned."],["purpose-built","Built for one particular use."],["maintain / upkeep","Pay to keep in good condition."],["displace","Replace: <i>extra tourists displace other visitors<\/i>."],["infrastructure","Roads, railways, utilities."],["good value for money","Worth the cost."]],"notes":{"TR":"Both questions are answered: four reasons (prestige, economics, regeneration, politics), then a firm, qualified judgement on value for money with conditions.","CC":"Body 1 = reasons (<i>The first… The second… also<\/i>), body 2 = the judgement (<i>However…, On the other hand…<\/i>). The conclusion answers both questions again.","LR":"<i>showcase, regeneration, derelict, exceed budgets, purpose-built, displace, infrastructure<\/i>.","GRA":"Participle clauses (<i>giving a country the chance to…<\/i>), a conditional perfect (<i>could have built<\/i>), <i>while<\/i> and <i>rather than<\/i> contrasts, and relative clauses."},"task":2},{"id":"t2-19","etype":"posneg","label":"Positive or negative · language","short":"English as a global language","title":"Is the spread of English positive or negative?","minutes":40,"prompt":"English is increasingly used as the main language of business, science and education around the world.<br><br>Is this a positive or negative development?","decode":{"q":"[[English]] is increasingly used as [[the main language of business, science and education]] around the world. [[Is this a positive or negative development?]]","why":"<b>Topic:<\/b> the global role of English. <b>Task words:<\/b> “positive or negative” asks for a <b>judgement<\/b>. You may say it is mostly positive, mostly negative, or mixed, but you must state your judgement clearly and support it with the strongest arguments.","toks":[["English",0],["is",-1],["increasingly",-1],["used",-1],["as",-1],["the",1],["main",1],["language",1],["of",1],["business,",1],["science",1],["and",1],["education",1],["around",-1],["the",-1],["world.",-1],["Is",2],["this",2],["a",2],["positive",2],["or",2],["negative",2],["development?",2]],"n":3},"plan":{"thesis":["On balance, this is a positive development because it makes communication and the sharing of knowledge easier, although it carries risks for local languages and creates unfair advantages.","English is the best language and everyone should speak it.","English is used in many countries."],"ans":0,"why":"A gives a judgement (<i>positive on balance<\/i>), the reason, and acknowledges the opposing side. B is an unsupported opinion and C describes the situation.","pairs":[["A shared language makes international communication and collaboration easier.","Scientists from different countries publish and discuss research in English at conferences."],["It creates opportunities for people who learn it.","A graduate who speaks English well can apply for jobs in multinational companies."],["It threatens minority languages and disadvantages non-native speakers.","Parents in a small community may stop teaching the local language because English seems more useful."]],"note":"Ideas 1 and 2 support your judgement; idea 3 is the main counter-argument, which you acknowledge and answer."},"upgrade":[["English helps people talk to each other in different countries.",["English helps people to talk to each other in many different countries.","A common language removes barriers between people of different nationalities and speeds up collaboration.","People can talk to each other when they use English."],1,"B uses a metaphor (<i>removes barriers<\/i>) and adds a second effect (<i>speeds up collaboration<\/i>). A and C use simple words."],["English gives you better jobs.",["English gives you a better job and a better life in the end.","Fluency in English widens a person's career options, particularly in multinational companies and international organisations.","If you know English, you can find good jobs easily."],1,"B is precise (<i>widens career options<\/i>) and names where it matters. A and C are absolute."],["But small languages might disappear.",["But small languages might disappear and that would be very sad.","However, the dominance of English puts smaller languages under pressure, as families may see little point in passing them on.","Small languages are in danger because English is more popular."],1,"B explains the mechanism (<i>families may see little point in passing them on<\/i>)."]],"order":{"para":1,"note":"Main benefit (barriers removed) → an example (scientists) → a second area (business) → a third (individuals). <i>In business, also<\/i> mark the move between areas.","sents":["The most obvious benefit is that a shared language removes barriers between nations.","Scientists from different countries publish and discuss research in English, which allows knowledge to spread faster and speeds up progress in fields such as medicine.","In business, a common language makes negotiation and cooperation simpler and cheaper, since companies do not need to translate every document.","English also opens opportunities for individuals: a graduate who speaks it well can apply for jobs in multinational companies, study abroad and follow a wider range of information online."]},"model":["English is now the main language of international business, science and education. Although this has some disadvantages, I believe that on balance it is a positive development, because it makes communication easier and opens up opportunities for millions of people.","The most obvious benefit is that a shared language removes barriers between nations. Scientists from different countries publish and discuss research in English, which allows knowledge to spread faster and speeds up progress in fields such as medicine. In business, a common language makes negotiation and cooperation simpler and cheaper, since companies do not need to translate every document. English also opens opportunities for individuals: a graduate who speaks it well can apply for jobs in multinational companies, study abroad and follow a wider range of information online.","There are, however, real costs. The dominance of English puts smaller languages under pressure, because parents may stop passing on a local language when English seems more useful for their children's future, and a language that is lost takes a culture with it. Native English speakers also enjoy an unfair advantage in international meetings and exams, while others must spend years studying. These drawbacks can be reduced if governments support local languages in schools and media alongside English, so that people become bilingual rather than replacing one language with another.","In conclusion, the global role of English promotes cooperation, learning and opportunity, and these benefits are greater than the disadvantages. The most sensible approach is to treat English as an additional language rather than a replacement for local ones, so that nobody has to choose between a global future and a local identity."],"band7":{"para":2,"text":"There are, but, real costs. The dominance of English put smaller languages under pressure, because parents may stop pass on a local language when English seems more useful for their children's future, and a language that lost takes a culture with it. Native English speakers also enjoy a unfair advantage in international meetings and exams, while other must spend years studying. These drawbacks can be reduced if governments support local languages in schools and media alongside English, so that people become bilingual rather than replace one language with another.","faults":[["There are, but, real costs","There are, however, real costs","The correct linker."],["The dominance of English put smaller languages","The dominance of English puts smaller languages","Agreement."],["may stop pass on a local language","may stop passing on a local language","<i>stop<\/i> + <i>-ing<\/i>."],["a language that lost takes a culture","a language that is lost takes a culture","A passive."],["enjoy a unfair advantage","enjoy an unfair advantage","<i>an<\/i> before a vowel sound."],["while other must spend years studying","while others must spend years studying","The pronoun <i>others<\/i>."],["rather than replace one language","rather than replacing one language","Parallel <i>-ing<\/i> forms."]]},"ideas":[["Positive","A shared language removes barriers and speeds up collaboration.","Scientists publishing in English."],["Positive","It makes business simpler and cheaper.","No need to translate every document."],["Positive","It opens opportunities for individuals.","Jobs in multinational companies, study abroad, wider information."],["Positive","Access to knowledge and entertainment online.","Websites, courses and films in English."],["Negative","It puts minority languages under pressure.","Parents who stop passing on a local language."],["Negative","Native speakers have an unfair advantage.","International meetings and exams."],["Negative","Cultural homogeneity: a loss of diversity.","Local expressions replaced by global ones."],["My judgement","Positive if English is an additional language, not a replacement.","Bilingual education in schools."]],"vocab":[["lingua franca","A common language used between speakers of different languages."],["remove barriers","Make communication easier."],["multinational companies","Companies that operate in many countries."],["dominance","A position of greatest power or influence."],["put under pressure","Make survival harder: <i>puts smaller languages under pressure<\/i>."],["pass on a language","Teach it to the next generation."],["an unfair advantage","A benefit that others do not have."],["bilingual","Able to speak two languages well."],["an additional language","A language learned beside the first."],["promote cooperation","Encourage working together."]],"notes":{"TR":"A clear judgement (<i>positive on balance<\/i>) is given at the start and defended with strong arguments. The opposing side is treated seriously and a way to reduce its harm is offered.","CC":"Body 1 = benefits (science, business, individuals), body 2 = costs and how to reduce them. <i>however, rather than<\/i> and the conclusion link the judgement.","LR":"<i>lingua franca-type vocabulary, remove barriers, multinational, dominance, puts under pressure, bilingual<\/i>.","GRA":"Concession (<i>Although this has some disadvantages<\/i>), a relative clause (<i>who speaks it well<\/i>), conditional (<i>can be reduced if…<\/i>) and <i>so that<\/i>."},"task":2},{"id":"t2-20","etype":"posneg","label":"Positive or negative · technology","short":"Machines taking over jobs","title":"Is automation a positive or negative development?","minutes":40,"prompt":"Machines and artificial intelligence are now doing many jobs that were once done by people.<br><br>Is this a positive or negative development?","decode":{"q":"[[Machines and artificial intelligence]] are now doing [[many jobs that were once done by people]]. [[Is this a positive or negative development?]]","why":"<b>Topic:<\/b> automation replacing human work. <b>Task words:<\/b> “positive or negative” asks for a judgement. Notice that <i>jobs that were once done by people<\/i> already hints at job loss: a strong essay discusses it rather than ignoring it.","toks":[["Machines",0],["and",0],["artificial",0],["intelligence",0],["are",-1],["now",-1],["doing",-1],["many",1],["jobs",1],["that",1],["were",1],["once",1],["done",1],["by",1],["people",1],[".",-1],["Is",2],["this",2],["a",2],["positive",2],["or",2],["negative",2],["development?",2]],"n":3},"plan":{"thesis":["Overall, this development is positive because it increases productivity and removes dangerous and boring work, but governments must manage job losses through retraining.","Machines will take all the jobs and people will have nothing to do.","Artificial intelligence is a new technology."],"ans":0,"why":"A gives a judgement and a condition that shows awareness of the main objection. B is an extreme prediction and C is a statement of fact.","pairs":[["Machines can do dangerous, repetitive work, protecting people.","Robots working in mines or welding in factories avoid accidents that harm workers."],["Automation raises productivity and lowers prices.","A factory using robots produces more cars at lower cost, so cars become cheaper for consumers."],["Workers who lose jobs need retraining and support.","A cashier replaced by self-service machines could train to repair or program them with government help."]],"note":"Ideas 1 and 2 support your judgement. Idea 3 answers the counter-argument by showing that the problem can be managed."},"upgrade":[["Robots can do dangerous jobs so people are safe.",["Robots can do dangerous jobs and this is good because people are safe.","Robots can take over hazardous and repetitive tasks, such as welding or mining, protecting workers from injury and strain.","Dangerous jobs are done by machines, which is better for everyone."],1,"B uses precise adjectives (<i>hazardous, repetitive<\/i>), examples and a participle clause."],["Machines make things cheaper.",["Machines make things cheaper and everybody can buy more.","Automation raises productivity and reduces production costs, which can lead to lower prices for consumers.","With machines, things become cheaper than before."],1,"B explains the chain (<i>productivity → costs → prices<\/i>) and hedges (<i>can lead to<\/i>)."],["People who lose jobs need help.",["People who lose their jobs because of machines need a lot of help.","Workers displaced by automation will need retraining and temporary financial support to move into new roles.","The government should help people with no jobs."],1,"B uses a reduced relative clause (<i>displaced by automation<\/i>) and names the help precisely."]],"order":{"para":1,"note":"Main advantage (dangerous, tiring, repetitive tasks) → example (robots in factories and mines) → a second benefit (productivity and prices) → a third (AI beyond human ability). <i>also<\/i> and <i>moreover<\/i> add the further benefits.","sents":["The main advantage is that machines can take over tasks that are dangerous, exhausting or repetitive.","Robots welding in factories or working in mines, for example, avoid accidents and strain that harm human workers.","Automation also raises productivity and reduces production costs, which can lead to lower prices for consumers and higher profits that can be reinvested.","Artificial intelligence, moreover, can perform tasks beyond human ability, such as detecting early signs of disease in thousands of scans, saving lives and freeing doctors to spend more time with patients."]},"model":["Machines and artificial intelligence are increasingly performing work that people once did, from assembling cars to analysing medical scans. Although this will cause disruption, I believe that the development is positive overall, provided that society helps workers to adapt.","The main advantage is that machines can take over tasks that are dangerous, exhausting or repetitive. Robots welding in factories or working in mines, for example, avoid accidents and strain that harm human workers. Automation also raises productivity and reduces production costs, which can lead to lower prices for consumers and higher profits that can be reinvested. Artificial intelligence, moreover, can perform tasks beyond human ability, such as detecting early signs of disease in thousands of scans, saving lives and freeing doctors to spend more time with patients.","The main disadvantage is the loss of jobs. A cashier replaced by a self-service machine, for instance, may find it difficult to find similar work, and entire communities that depend on one industry can suffer. However, history suggests that technology also creates new kinds of employment, such as programming, maintenance and data analysis, even if the transition is painful. Governments can ease it by funding retraining and temporary financial support, so that displaced workers can move into new roles rather than being left behind.","In conclusion, the growing use of machines and artificial intelligence brings greater safety, productivity and medical progress. While job losses are a real concern, they can be managed with foresight and investment in people, so I regard the development as essentially positive. The aim should be a society in which machines do the work that people should not have to do, and people are free to do the work that only people can."],"band7":{"para":2,"text":"The main disadvantage is the loss of jobs. A cashier who replaced by a self-service machine, for instance, may find it difficult to find similar work, and entire communities that depends on one industry can suffer. However, history suggest that technology also create new kinds of employment, such as programming, maintenance and data analysis, even if the transition is painful. Governments can ease it by fund retraining and temporary financial support, so that displaced workers can move to new roles instead of leaving behind.","faults":[["A cashier who replaced by a self-service machine","A cashier replaced by a self-service machine","A reduced passive relative clause."],["communities that depends on one industry","communities that depend on one industry","Agreement with a plural noun."],["history suggest that technology also create new kinds","history suggests that technology also creates new kinds","Agreement in both verbs."],["by fund retraining","by funding retraining","A gerund after a preposition."],["move to new roles","move into new roles","A more precise preposition."],["instead of leaving behind","rather than being left behind","A passive and a more formal linker."]]},"ideas":[["Positive","Machines remove dangerous and repetitive work.","Robots in mines and welding lines."],["Positive","Automation raises productivity and lowers prices.","Cheaper cars from robot factories."],["Positive","AI can do things beyond human ability.","Detecting disease in thousands of scans."],["Positive","People can focus on creative and caring work.","Doctors with more time for patients."],["Negative","Job losses and local economic damage.","A cashier replaced by a self-service machine."],["Negative","Inequality: owners of machines gain more than workers.","Profits that go to a few shareholders."],["Negative","Over-reliance on technology can be risky.","Systems that fail or make mistakes."],["My judgement","Positive if governments fund retraining and support.","Programmes to move workers into programming and maintenance."]],"vocab":[["automation / automate","Using machines instead of people."],["hazardous / repetitive tasks","Dangerous / repeated work."],["productivity","Output per worker or per hour."],["production costs","The cost of making goods."],["displaced workers","People who have lost their jobs because of change."],["retraining","Teaching new skills."],["the transition","The period of change."],["left behind","Not helped to adapt."],["disruption","Serious change that causes problems."],["with foresight","By planning ahead."]],"notes":{"TR":"A clear judgement (<i>positive overall, provided that…<\/i>) is argued with three benefits, and the main objection (job loss) is recognised and answered with a solution.","CC":"Body 1 = benefits (safety, productivity, ability), body 2 = the disadvantage and how to manage it. <i>moreover, However, for instance<\/i> mark each step.","LR":"<i>hazardous, repetitive, productivity, displaced workers, retraining, the transition, disruption<\/i>.","GRA":"Participle phrases (<i>saving lives and freeing doctors…<\/i>), reduced relative (<i>replaced by a self-service machine<\/i>), <i>provided that<\/i>, <i>rather than being left behind<\/i>."},"task":2}],"G":{"etypes":[["opinion","Opinion (agree / disagree)"],["discussion","Discussion of two views + your opinion"],["advdis","Advantages and disadvantages"],["problem","Problems and solutions"],["twopart","Two-part question"],["posneg","Positive or negative development"]],"crit1":[["TA","Task Achievement",{"5":"Some features are reported but there is no clear overview. Detail is mechanical or mixed with irrelevant data. Some figures are wrong.","6   if (a === 'self') { const s = S.self[t.id] || (S.self[t.id] = {}); s[d.c] = +d.b; save(); const crit = t.task === 1 ? D.G.crit1 : D.G.crit2; if (crit.every(c => s[c[0]])) markDone(t, 'cmp'); renderStep(); return; }
});
work.addEventListener('change', e => {
  const s = e.target.closest('[data-act="match"]'); if (!s || !curTask) return;
  const st = stepState(curTask, 'plan'); (st.m || (st.m = {}))[+s.dataset.i] = s.value === '' ? undefined : +s.value; if (s.value === '') delete st.m[+s.dataset.i]; save(); renderStep();
});
/* drag and drop for the order step */
let dragPos = null;
work.addEventListener('dragstart', e => { const li = e.target.closest('.ordl li'); if (!li) return; dragPos = +li.dataset.pos; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragPos)); } catch (x) {} });
work.addEventListener('dragover', e => { const li = e.target.closest('.ordl li'); if (!li || dragPos == null) return; e.preventDefault(); $$('.ordl li.over').forEach(x => x.classList.remove('over')); li.classList.add('over'); });
work.addEventListener('drop', e => {
  const li = e.target.closest('.ordl li'); if (!li || dragPos == null) return; e.preventDefault();
  const to = +li.dataset.pos, st = stepState(curTask, 'order'), x = st.o.splice(dragPos, 1)[0]; st.o.splice(to, 0, x); dragPos = null; save(); renderStep();
});
work.addEventListener('dragend', () => { dragPos = null; $$('.ordl li').forEach(x => x.classList.remove('drag', 'over')); });
$('#menubtn').addEventListener('click', () => document.body.classList.toggle('railopen'));
document.addEventListener('click', e => { if (document.body.classList.contains('railopen') && !e.target.closest('#rail') && !e.target.closest('#menubtn')) document.body.classList.remove('railopen'); });

render();
})();

</script>
