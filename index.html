<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="IELTS Writing workbench: 20 Task 1 reports and 20 Task 2 essays, each with its own data, step-by-step exercises and a band 9 model answer.">
<title>IELTS Writing Workbench</title>
<style>
/* IELTS Writing workbench: the same navy / Georgia colours as the Reading and Listening pages,
   but an app layout (task rail + step-by-step workbench) instead of the long sheet. */
:root {
  color-scheme: light;
  --bg: #EDF0F4; --page: #FFFFFF; --ink: #111111; --muted: #3D4A56; --faint: #5A6773; --line: #D7DEE5; --row: #F8FAFB;
  --navy: #14365A; --navy-ink: #FFFFFF; --qn: #2C6E9B;
  --tech: #EEF3F8; --tech-edge: #2C6E9B; --tech-lab: #1F5D87;
  --psg: #FCFAF4; --psg-edge: #C9A227; --psg-lab: #96781C; --psg-line: #E8DDC0;
  --get: #F1F7F1; --get-edge: #2E7D32; --get-lab: #256428;
  --same: #F5F2FA; --same-edge: #5B4B9A; --same-lab: #4A3D82;
  --bad-bg: #FDF2F1; --bad: #B23A2E; --bad-lab: #96291F;
  --ok: #2E7D32; --ok-soft: #E6F3E7; --mid: #9A6A0E; --mid-soft: #FBF2DE;
  --hA: #FFF3B0; --hP: #D6EDD6; --hT: #FBD5D0;
  --f-text: Georgia, "Times New Roman", serif;
  --f-ui: "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 17px; line-height: 1.55; }
button, select, input, textarea { font-family: var(--f-ui); }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--tech-edge); outline-offset: 2px; }
[hidden] { display: none !important; }
b, strong { color: var(--navy); font-weight: 700; }
a { color: var(--qn); }
h1, h2, h3, h4 { font-family: var(--f-ui); color: var(--navy); text-wrap: balance; margin: 0; }
h2 { font-size: 21px; line-height: 1.25; margin: 26px 0 10px; }
h3 { font-size: 16.5px; margin: 20px 0 8px; }
p { margin: 0 0 12px; }
ul, ol { margin: 0 0 12px; padding-left: 24px; }
li { margin-bottom: 6px; }
.small { font-family: var(--f-ui); font-size: 14px; color: var(--faint); }

/* ---------- top bar + layout ---------- */
.topbar { position: sticky; top: 0; z-index: 30; background: var(--navy); color: var(--navy-ink); display: flex; align-items: center; gap: 14px; padding: 9px 18px; font-family: var(--f-ui); }
.topbar .menu { display: none; background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff; padding: 5px 10px; font-size: 14px; }
.topbar .brand { font-size: 18px; font-weight: 700; color: #fff; text-decoration: none; letter-spacing: .2px; }
.topbar .sp { flex: 1; }
.topbar .prog { display: flex; align-items: center; gap: 10px; font-size: 13px; opacity: .95; }
.topbar .pbar { width: 150px; height: 6px; background: rgba(255,255,255,.25); } .topbar .pbar i { display: block; height: 100%; background: var(--psg-edge); }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); max-width: 1320px; margin: 0 auto; align-items: start; }
.rail { position: sticky; top: 49px; height: calc(100vh - 49px); overflow-y: auto; background: var(--page); border-right: 1px solid var(--line); padding: 14px 12px 40px; font-family: var(--f-ui); }
.rail .nv { display: block; padding: 8px 10px; color: var(--ink); text-decoration: none; font-size: 14.5px; font-weight: 600; border-left: 3px solid transparent; }
.rail .nv:hover { background: var(--row); }
.rail .nv.on { background: var(--tech); border-left-color: var(--navy); color: var(--navy); }
.rail .rg { margin: 16px 0 4px; padding: 0 10px; font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--psg-lab); display: flex; justify-content: space-between; }
.rail .rt { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 6px 10px; color: var(--ink); text-decoration: none; font-size: 13.8px; border-left: 3px solid transparent; line-height: 1.3; }
.rail .rt:hover { background: var(--row); }
.rail .rt.on { background: var(--tech); border-left-color: var(--navy); }
.rail .rt .n { font-weight: 700; color: var(--qn); font-size: 12px; }
.rail .rt .st { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.rail .rt.done .st { color: var(--ok); font-weight: 700; }
.rail .ty { display: block; font-size: 11.5px; color: var(--faint); }
main { padding: 22px 26px 80px; min-width: 0; outline: none; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .topbar .menu { display: inline-block; }
  .topbar .prog .pbar { width: 70px; }
  .rail { position: fixed; top: 49px; left: 0; width: 86vw; max-width: 340px; z-index: 40; transform: translateX(-102%); transition: transform .2s; box-shadow: 3px 0 14px rgba(0,0,0,.25); }
  body.railopen .rail { transform: none; }
  main { padding: 14px 12px 70px; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }

/* ---------- home + toolkit pages ---------- */
.hero { background: var(--page); border: 1px solid var(--line); border-top: 6px solid var(--navy); padding: 26px 30px; }
.hero h1 { font-size: clamp(28px, 4.5vw, 38px); line-height: 1.15; margin-bottom: 10px; }
.hero .sub { font-size: 19px; font-style: italic; color: var(--muted); margin-bottom: 14px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin: 16px 0; }
.card { background: var(--page); border: 1px solid var(--line); padding: 16px 20px; }
.card.edge { border-left: 4px solid var(--navy); }
.card h3 { margin-top: 0; }
.box { padding: 16px 22px; margin: 16px 0; }
.box > :last-child { margin-bottom: 0; }
.lab { display: block; font-family: var(--f-ui); font-size: 12.5px; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
.tech { background: var(--tech); border-left: 4px solid var(--tech-edge); } .tech .lab { color: var(--tech-lab); }
.qbox { background: var(--psg); border: 1px solid var(--psg-line); border-left: 4px solid var(--psg-edge); } .qbox .lab { color: var(--psg-lab); }
.get { background: var(--get); border-left: 4px solid var(--get-edge); } .get .lab { color: var(--get-lab); }
.same { background: var(--same); border-left: 4px solid var(--same-edge); } .same .lab { color: var(--same-lab); }
.warn { background: var(--bad-bg); border-left: 4px solid var(--bad); } .warn .lab { color: var(--bad-lab); }
.tablewrap { overflow-x: auto; margin: 12px 0; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { background: var(--navy); color: var(--navy-ink); text-align: left; padding: 8px 10px; font-family: var(--f-ui); font-size: 12.5px; letter-spacing: .6px; text-transform: uppercase; font-weight: 600; }
td { padding: 8px 10px; border-bottom: 1px solid #E0E6EA; vertical-align: top; }
tr:nth-child(even) td { background: var(--row); }
td.k { font-weight: 700; color: var(--navy); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tl { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: 10px 0; }
.tl a { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 6px; padding: 9px 11px; background: var(--page); border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-size: 14.5px; font-family: var(--f-ui); align-items: baseline; }
.tl a:hover { border-color: var(--navy); }
.tl .n { font-weight: 700; color: var(--qn); font-size: 12.5px; }
.tl .st { font-size: 12px; color: var(--faint); }
.tl a.done .st { color: var(--ok); font-weight: 700; }
.chip { display: inline-block; font-family: var(--f-ui); font-size: 12px; font-weight: 700; letter-spacing: .5px; padding: 2px 9px; background: var(--tech); color: var(--tech-lab); margin-right: 6px; text-transform: uppercase; }
.chip.gold { background: var(--psg); color: var(--psg-lab); border: 1px solid var(--psg-line); }

/* ---------- task header + stepper ---------- */
.taskhead { margin-bottom: 14px; }
.pnum { display: inline-block; background: var(--navy); color: var(--navy-ink); font-family: var(--f-ui); font-size: 13.5px; font-weight: 600; letter-spacing: 2px; padding: 5px 12px; text-transform: uppercase; }
.ptype { display: inline-block; font-family: var(--f-ui); font-size: 14px; color: var(--navy); font-weight: 600; margin-left: 14px; text-transform: uppercase; letter-spacing: .6px; }
.ptitle { font-size: 26px; font-weight: 700; color: var(--navy); margin: 12px 0 0; line-height: 1.25; font-family: var(--f-text); }
.stepper { display: flex; gap: 4px; overflow-x: auto; margin: 16px 0 14px; padding-bottom: 4px; font-family: var(--f-ui); scrollbar-width: thin; }
.stepper button { flex: 1 0 auto; display: flex; align-items: center; gap: 8px; background: var(--page); border: 1px solid var(--line); padding: 8px 14px 8px 8px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.stepper button .ci { width: 24px; height: 24px; border-radius: 50%; background: var(--line); color: var(--muted); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; }
.stepper button.on { background: var(--navy); color: #fff; border-color: var(--navy); } .stepper button.on .ci { background: #fff; color: var(--navy); }
.stepper button.done:not(.on) .ci { background: var(--ok); color: #fff; }
.stepper button:hover:not(.on) { border-color: var(--navy); }
.stepbody { background: var(--page); border: 1px solid var(--line); padding: 22px 26px 26px; }
.stepbody > h2:first-child { margin-top: 0; }
.stepnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
@media (max-width: 640px) { .stepbody { padding: 16px 14px 20px; } .ptitle { font-size: 22px; } }

/* ---------- task card + visuals ---------- */
details.taskcard { background: var(--psg); border: 1px solid var(--psg-line); border-left: 4px solid var(--psg-edge); margin-bottom: 4px; }
details.taskcard > summary { cursor: pointer; list-style: none; padding: 12px 18px; font-family: var(--f-ui); font-size: 12.5px; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; color: var(--psg-lab); display: flex; gap: 10px; align-items: center; }
details.taskcard > summary::-webkit-details-marker { display: none; }
details.taskcard > summary::after { content: "hide"; margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--faint); font-size: 13px; }
details.taskcard:not([open]) > summary::after { content: "show"; }
.taskcard .tc { padding: 0 20px 16px; }
.taskcard .prompt { font-size: 17.5px; font-style: italic; margin-bottom: 8px; }
.taskcard .lim { font-family: var(--f-ui); font-size: 13.5px; color: var(--faint); margin-bottom: 8px; }
.visual { background: #fff; border: 1px solid var(--line); margin: 10px 0; padding: 10px 12px 8px; }
.visual .vt { font-family: var(--f-ui); font-weight: 700; font-size: 14.5px; color: var(--navy); text-align: center; margin: 2px 0 6px; }
.visual .scroll { overflow-x: auto; }
.visual svg { display: block; width: 100%; height: auto; min-width: 520px; max-width: 640px; margin: 0 auto; }
.visual svg text { font-family: "Segoe UI", Arial, sans-serif; fill: #333; }
.pies { display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: center; }
.pies .pie { flex: 0 1 300px; }
.pies svg { min-width: 0; max-width: 300px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; font-family: var(--f-ui); font-size: 13px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 11px; height: 11px; margin-right: 5px; vertical-align: -1px; }
.maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
.maps .scroll svg { min-width: 300px; }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px 6px; justify-content: center; padding: 8px 0; font-family: var(--f-ui); }
.flow .node { flex: 0 1 150px; border: 1.5px solid var(--navy); background: #fff; padding: 8px 10px; font-size: 13.5px; line-height: 1.3; text-align: center; display: flex; flex-direction: column; justify-content: center; }
.flow .node small { display: block; color: var(--faint); font-size: 12px; margin-top: 3px; }
.flow .arr { align-self: center; color: var(--navy); font-size: 20px; font-weight: 700; }
details.exact { margin-top: 6px; font-family: var(--f-ui); font-size: 13.5px; }
details.exact > summary { cursor: pointer; color: var(--qn); font-weight: 600; }
details.exact table { font-size: 13.5px; margin-top: 6px; }

/* ---------- exercise controls ---------- */
.opt { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; text-align: left; background: var(--page); border: 1px solid var(--line); padding: 11px 14px; margin: 0 0 8px; font-family: var(--f-text); font-size: 16.5px; color: var(--ink); line-height: 1.45; }
.opt:hover { border-color: var(--navy); }
.opt .bx { width: 20px; height: 20px; border: 1.5px solid var(--faint); display: grid; place-items: center; font-family: var(--f-ui); font-size: 13px; font-weight: 700; margin-top: 2px; background: #fff; }
.opt.radio .bx { border-radius: 50%; }
.opt.sel { border-color: var(--navy); background: var(--tech); } .opt.sel .bx { background: var(--navy); border-color: var(--navy); color: #fff; }
.opt.sel .bx::after { content: "✓"; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); } .opt.ok .bx { background: var(--ok); border-color: var(--ok); color: #fff; } .opt.ok .bx::after { content: "✓"; }
.opt.no { border-color: var(--bad); background: var(--bad-bg); } .opt.no .bx { background: var(--bad); border-color: var(--bad); color: #fff; } .opt.no .bx::after { content: "✗"; }
.opt.miss { border-color: var(--ok); border-style: dashed; } .opt.miss .bx { border-color: var(--ok); color: var(--ok); } .opt.miss .bx::after { content: "!"; }
.opt:disabled { cursor: default; }
.why { font-family: var(--f-ui); font-size: 14px; color: var(--muted); margin: -2px 0 10px 36px; padding: 6px 10px; background: var(--row); border-left: 3px solid var(--line); }
.why.ok { border-left-color: var(--ok); } .why.no { border-left-color: var(--bad); }
.tagk { display: inline-block; font-family: var(--f-ui); font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; padding: 1px 7px; margin-right: 6px; color: #fff; background: var(--faint); }
.tagk.key { background: var(--ok); } .tagk.detail { background: var(--mid); } .tagk.false { background: var(--bad); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0 4px; font-family: var(--f-ui); }
.primary { background: var(--navy); color: var(--navy-ink); border: 1px solid var(--navy); padding: 9px 18px; font-weight: 600; font-size: 14.5px; letter-spacing: .3px; }
.primary:disabled { opacity: .5; cursor: default; }
.ghost { background: var(--page); color: var(--navy); border: 1px solid var(--line); padding: 9px 14px; font-size: 14.5px; font-weight: 600; }
.ghost:hover { border-color: var(--navy); }
.danger { background: var(--bad); color: #fff; border: 1px solid var(--bad); padding: 8px 14px; font-weight: 600; font-size: 14px; }
.sm { padding: 6px 12px; font-size: 13.5px; }
.result { border: 1px solid var(--line); border-left: 4px solid var(--navy); background: #F4F7FA; padding: 12px 16px; margin: 12px 0; font-family: var(--f-ui); font-size: 15px; }
.result.good { border-left-color: var(--ok); background: var(--ok-soft); } .result.mid { border-left-color: var(--mid); background: var(--mid-soft); } .result.low { border-left-color: var(--bad); background: var(--bad-bg); }
.seg { display: inline-flex; border: 1px solid var(--line); background: #fff; flex: none; }
.seg button { border: 0; background: #fff; color: var(--muted); padding: 6px 11px; font-size: 13.5px; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--navy); color: #fff; }
.grow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; border: 1px solid var(--line); padding: 9px 12px; margin-bottom: 8px; background: #fff; }
.grow.ok { border-color: var(--ok); background: var(--ok-soft); } .grow.no { border-color: var(--bad); background: var(--bad-bg); }
.grow .gt { font-size: 16px; }
.grow .gw { grid-column: 1 / -1; font-family: var(--f-ui); font-size: 13.5px; color: var(--muted); }
.cloze { font-size: 17.5px; line-height: 2.3; background: var(--psg); border: 1px solid var(--psg-line); border-left: 4px solid var(--psg-edge); padding: 14px 20px; margin-bottom: 12px; }
.cloze p { margin: 0 0 6px; }
.gapb { display: inline-block; min-width: 5.2em; text-align: center; font-family: var(--f-ui); font-size: 15px; border: 0; border-bottom: 2px solid var(--navy); background: #fff; color: var(--navy); padding: 1px 8px; margin: 0 2px; }
.gapb.act { background: var(--hA); }
.gapb.fill { font-weight: 700; }
.gapb.ok { background: var(--ok-soft); border-bottom-color: var(--ok); color: var(--ok); }
.gapb.no { background: var(--bad-bg); border-bottom-color: var(--bad); color: var(--bad); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.bank button { font-family: var(--f-ui); font-size: 15px; font-weight: 600; background: #fff; border: 1px solid var(--navy); color: var(--navy); padding: 5px 13px; }
.bank button:disabled { opacity: .3; cursor: default; border-style: dashed; }
.toks { font-size: 18px; line-height: 2.2; background: var(--psg); border: 1px solid var(--psg-line); border-left: 4px solid var(--psg-edge); padding: 12px 18px; }
.tok { font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1.5px dotted #B8C2CC; padding: 0 1px; margin: 0; cursor: pointer; }
.tok:hover { background: var(--row); border-bottom-color: var(--navy); }
.tok.on { background: var(--navy); color: #fff; }
.tok.hit { background: #CBE8CC; border-bottom-color: var(--ok); } .tok.hit.on { background: var(--ok); color: #fff; }
.tok.miss { background: var(--hA); border-bottom: 2px solid var(--mid); }
.tok.stray { background: var(--hT); }
.ordl { list-style: none; padding: 0; margin: 0 0 10px; }
.ordl li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--line); padding: 9px 12px; margin-bottom: 7px; cursor: grab; font-size: 16.5px; }
.ordl li .no { font-family: var(--f-ui); font-weight: 700; color: var(--qn); text-align: center; }
.ordl li.drag { opacity: .4; } .ordl li.over { border-color: var(--navy); border-style: dashed; }
.ordl li.ok { background: var(--ok-soft); border-color: var(--ok); } .ordl li.no2 { background: var(--bad-bg); border-color: var(--bad); }
.ordl .mv { display: flex; gap: 4px; }
.ordl .mv button { border: 1px solid var(--line); background: #fff; width: 32px; height: 32px; font-size: 14px; color: var(--navy); }
.sel { font-size: 15.5px; padding: 7px 9px; border: 1px solid var(--line); background: #fff; max-width: 100%; color: var(--ink); }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 8px 14px; align-items: center; border: 1px solid var(--line); padding: 10px 12px; margin-bottom: 8px; background: #fff; }
.mrow.ok { background: var(--ok-soft); border-color: var(--ok); } .mrow.no { background: var(--bad-bg); border-color: var(--bad); }
.mrow .mw { grid-column: 1 / -1; font-family: var(--f-ui); font-size: 13.5px; color: var(--muted); }
@media (max-width: 640px) { .mrow { grid-template-columns: 1fr; } }

/* ---------- writing box ---------- */
.wrap2 { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .wrap2 { grid-template-columns: 1fr; } }
textarea.wbox { width: 100%; min-height: 380px; resize: vertical; font-family: var(--f-text); font-size: 17.5px; line-height: 1.6; padding: 14px 16px; border: 1px solid var(--navy); background: #fff; color: var(--ink); }
.side { font-family: var(--f-ui); font-size: 14px; }
.meter { background: #fff; border: 1px solid var(--line); padding: 12px 14px; margin-bottom: 10px; }
.meter .big { font-size: 34px; font-weight: 700; color: var(--navy); line-height: 1; font-variant-numeric: tabular-nums; }
.meter .big b { color: var(--navy); }
.meter .big span { font-size: 14px; color: var(--faint); font-weight: 400; }
.meter .bar { height: 6px; background: var(--line); margin: 8px 0 4px; } .meter .bar i { display: block; height: 100%; background: var(--navy); max-width: 100%; }
.meter.ok .bar i { background: var(--ok); }
.timer { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--navy); padding: 8px 12px; margin-bottom: 10px; }
.timer .tt { font-size: 22px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.timer.low .tt { color: var(--bad); }
.checks { list-style: none; padding: 0; margin: 0; }
.checks li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-bottom: 1px solid #E0E6EA; font-size: 13.8px; line-height: 1.35; margin: 0; }
.checks li::before { content: "•"; color: var(--faint); font-weight: 700; text-align: center; }
.checks li.ok::before { content: "✓"; color: var(--ok); } .checks li.warn::before { content: "!"; color: var(--mid); } .checks li.no::before { content: "✗"; color: var(--bad); }
.checks b { font-weight: 700; }

/* ---------- compare + self score ---------- */
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 860px) { .cmp { grid-template-columns: 1fr; } }
.cmp .pane { background: #fff; border: 1px solid var(--line); padding: 14px 18px; }
.cmp .pane.model { border-top: 4px solid var(--same-edge); } .cmp .pane.mine { border-top: 4px solid var(--navy); }
.cmp .pane h3 { margin-top: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; }
.cmp .pane p { font-size: 16.5px; }
.cmp .empty { color: var(--faint); font-style: italic; }
.band7 { background: #fff; border: 1px solid var(--line); border-left: 4px solid #8A94A0; padding: 12px 18px; margin: 8px 0; }
.band7 p { margin: 0; }
.fault { background: var(--hT); padding: 0 2px; }
.fix { background: var(--hP); padding: 0 2px; }
.selft { width: 100%; }
.selft td { vertical-align: middle; }
.selft .seg { flex-wrap: wrap; }
.descr { font-family: var(--f-ui); font-size: 13.5px; color: var(--muted); padding: 4px 0 8px; }
.final { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; font-family: var(--f-ui); }
.final .big { font-size: 44px; font-weight: 700; color: var(--navy); line-height: 1; }

.sidehd { font-size: 12.5px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--psg-lab); margin: 18px 0 2px; font-weight: 700; }
@media (max-width: 900px) {
  .topbar { gap: 10px; padding: 8px 12px; }
  .topbar .brand { font-size: 15px; white-space: nowrap; }
  .topbar .prog #progtxt { display: none; }
  .topbar .prog .pbar { width: 60px; }
}
</style>

<script>window.W={"T1":[{"id":"t1-01","label":"Line graph · growth","short":"Smartphone ownership","title":"Smartphone ownership in four countries","minutes":20,"prompt":"The graph below shows the percentage of adults who owned a smartphone in four countries between 2008 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"line","title":"Adults owning a smartphone, 2008–2020 (%)","ytitle":"Adults owning a smartphone (%)","xtitle":"Year","x":["2008","2010","2012","2014","2016","2018","2020"],"series":[{"name":"South Korea","values":[12,30,62,78,87,94,96]},{"name":"Germany","values":[7,18,37,55,68,78,85]},{"name":"Brazil","values":[3,8,22,38,54,68,76]},{"name":"Nigeria","values":[1,3,9,17,27,36,45]}]},"vocab":[["rose steeply / leapt from … to …","A big rise: <i>leapt from 30% to 62%<\/i>."],["levelled off at","A rise that stops: <i>levelled off at 96%<\/i>."],["approaching saturation","Almost everyone already has the item (near 100%)."],["percentage points","The gap between two percentages: <i>nine percentage points below Germany<\/i>, not “nine percent”."],["throughout the period","A position that never changes: <i>ahead throughout the period<\/i>."],["the fastest growth","Superlative for the steepest line."],["never passed the halfway mark","A way to say “below 50%” without repeating the number."],["with a delay / lagged behind","One line follows another later: <i>Germany followed the same pattern with a delay<\/i>."]],"plan":["<b>Introduction:<\/b> paraphrase: <i>shows the percentage of adults who owned a smartphone<\/i> → <i>compares the proportion of adults with a smartphone<\/i>.","<b>Overview:<\/b> (1) every country rose; (2) South Korea highest and Nigeria lowest throughout. No numbers.","<b>Body 1:<\/b> the leading pair (South Korea, Germany): start, fastest growth, levelling off.","<b>Body 2:<\/b> the trailing pair (Brazil, Nigeria): slower, steadier growth and the end figures."],"read":[["Ownership increased in all four countries over the period.","key","A trend that applies to every line: exactly what an overview needs."],["South Korea had the highest ownership in every year, ending on 96%.","key","The ranking never changes, which is a main feature."],["Nigeria had the lowest figures throughout and was still below 50% in 2020.","key","The lowest line and its end point (45%) are central."],["In 2012, Brazil's ownership was 22%.","detail","True, but a single figure. Use it only if it helps a comparison."],["Germany's ownership rose from 55% to 68% between 2014 and 2016.","detail","True, but one small stretch of one line. Not a key feature."],["Brazil overtook Germany in 2016.","false","The lines never cross: Germany (68%) stays above Brazil (54%)."],["South Korea's growth was fastest in the final four years.","false","South Korea grew fastest early (30% to 62% from 2010 to 2012) and nearly stopped at the end."]],"overview":[["Overall, smartphone ownership rose in all four countries, with South Korea highest and Nigeria lowest throughout.",true,"Main trend plus the ranking, no figures. This is a model overview."],["The main trend is rapid growth, which slowed in the countries that were approaching 100%.",true,"A second valid overview: a trend and a change of pace."],["In 2008, 12% of South Koreans owned a smartphone, compared with 7% of Germans, 3% of Brazilians and 1% of Nigerians.",false,"Detailed figures belong in the body paragraphs, not the overview."],["I think smartphones are the most important invention of the century, so ownership rose everywhere.",false,"Task 1 never contains opinions."],["The graph shows the percentage of adults who owned smartphones in four countries.",false,"This repeats the introduction. It reports no feature."],["South Korea's ownership grew by 32 percentage points between 2010 and 2012.",false,"A true but narrow detail about one country in one period."]],"group":{"names":["South Korea and Germany","Brazil and Nigeria"],"instr":"The model describes the data in two body paragraphs. <b>Which paragraph does each fact belong in?<\/b>","note":"The top two countries behave alike: a steep rise followed by levelling off near saturation. Brazil and Nigeria start lower and grow more slowly and steadily. Grouping by pattern, not country by country, lets you compare.","items":[["South Korea reached 96% in 2020",0],["Germany reached 85% in 2020",0],["South Korea's rise flattened after 2018",0],["Nigeria stayed below 50% throughout",1],["Brazil started 2008 at 3%",1],["Nigeria rose from 1% in 2008 to 45% in 2020",1]]},"cloze":{"para":2,"words":["slower","climbed","from","to","finished","at","below","never","by","roughly","reach","less"],"extra":["faster","fell","above","over"],"note":"<i>from … to …<\/i> gives a start and end point, <i>by<\/i> gives the size of a change, and <i>at<\/i> gives a final level.","segs":["Growth in the other two countries was "," but steadier. Ownership in Brazil "," "," 8% in 2010 "," 54% in 2016 and "," "," 76%, nine percentage points "," Germany. Nigeria "," passed the halfway mark; from 2014 its figure rose "," "," nine or ten points every two years to "," 45% in 2020, "," than half the South Korean level."]},"model":["The line graph compares the proportion of adults who owned a smartphone in South Korea, Germany, Brazil and Nigeria between 2008 and 2020. Overall, ownership rose steeply in every country, with South Korea ahead and Nigeria behind throughout, although growth slowed in the countries that were approaching saturation.","In 2008, smartphones were still rare, owned by just 12% of South Koreans and 7% of Germans, and by only 3% of Brazilians and 1% of Nigerians. South Korea then recorded the fastest growth, leaping from 30% in 2010 to 62% in 2012, before levelling off at 96% in 2020. Germany followed the same pattern with a delay, reaching 85% by the end of the period.","Growth in the other two countries was slower but steadier. Ownership in Brazil climbed from 8% in 2010 to 54% in 2016 and finished at 76%, nine percentage points below Germany. Nigeria never passed the halfway mark; from 2014 its figure rose by roughly nine or ten points every two years to reach 45% in 2020, less than half the South Korean level."],"band7":{"para":2,"text":"Growth in the other two countries was slower but steadier. Ownership in Brazil was going up from 8% in 2010 to 54% in 2016 and it finished with 76%, which is 9 percentage points lower than Germany. Nigeria never was more than half, and the rises was about 9 or 10 points every two years from 2014 until in 2020 it was 45%, that is less than half of South Korea.","faults":[["was going up from 8%","climbed from 8%","A completed trend needs a precise past simple verb, not <i>was going up<\/i>."],["finished with 76%","finished at 76%","A final level takes <i>at<\/i>."],["which is 9 percentage points lower than Germany","nine percentage points below Germany","Keep the tense consistent (<i>was<\/i>) and compare with <i>below<\/i>."],["Nigeria never was more than half","Nigeria never passed the halfway mark","Word order with <i>never<\/i>, and a more precise collocation."],["the rises was about","its figure rose by roughly","Subject–verb agreement, and a verb instead of a noun phrase."],["that is less than half of South Korea","less than half the South Korean level","Compare figures with figures, not a figure with a country."]]},"notes":{"TA":"All four lines are covered, with a clear overview (rise everywhere, ranking never changes, growth slows near saturation) and accurate, selected figures.","CC":"Two body paragraphs grouped by pattern (leaders, then followers). <i>then, before, in contrast<\/i>-style links are used lightly; the logic does the work.","LR":"<i>leaping, levelling off, approaching saturation, never passed the halfway mark<\/i>: precise, varied verbs and collocations; <i>percentage points<\/i> used correctly.","GRA":"A participle clause (<i>owned by just…<\/i>), a <i>before + -ing<\/i> clause, reduced comparison (<i>less than half the South Korean level<\/i>) and error-free tense control."},"task":1},{"id":"t1-02","label":"Line graph · seasonal pattern","short":"Park visitors by month","title":"Visitors to two national parks across a year","minutes":20,"prompt":"The graph below shows the average number of visitors per day to two national parks, Lakeland and Coastal, in each month of one year. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"line","title":"Average daily visitors by month","ytitle":"Average daily visitors","xtitle":"Month","x":["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],"series":[{"name":"Lakeland","values":[120,140,260,480,760,1180,1540,1620,980,520,210,150]},{"name":"Coastal","values":[420,450,520,640,760,900,1010,1040,860,640,480,440]}]},"vocab":[["seasonal / a seasonal pattern","A rise and fall tied to the time of year: <i>far more seasonal<\/i>."],["peak in August / reach a peak of","The highest point: <i>peaking at 1,620 in August<\/i>."],["the quietest / busiest month","Superlatives for the lowest and highest months."],["a steadier flow","Less variation: <i>attracted a steadier flow all year<\/i>."],["soar / collapse","Very big rises and falls: <i>numbers soared<\/i>, <i>collapsed to 210<\/i>."],["over ten times as many … as","A multiple: <i>over ten times as many visitors as its quietest month<\/i>."],["overtake","One line passes another: <i>Lakeland overtook Coastal from June<\/i>."],["were level at","Two lines meet: <i>level at 760 in May<\/i>."]],"plan":["<b>Introduction:<\/b> paraphrase <i>average number of visitors per day … in each month of one year<\/i>.","<b>Overview:<\/b> both parks peak in summer; Lakeland is far more seasonal, Coastal much steadier.","<b>Body 1:<\/b> Lakeland: low winter, steep rise from April, August peak, sharp autumn fall.","<b>Body 2:<\/b> Coastal's gentler curve, then the comparison: which park is busier when."],"read":[["Both parks had their highest number of visitors in August.","key","A shared feature of both lines, and a main feature."],["Lakeland's visitor numbers changed far more across the year than Coastal's.","key","The contrast in seasonality is the central difference."],["Coastal was the busier park in the colder months, from October to April.","key","The two lines cross, so who is busier changes with the season."],["Lakeland had 760 visitors per day in May.","detail","True, but this is one point (and Coastal had the same figure)."],["Coastal had 440 visitors per day in December.","detail","True, but a single figure. Not a key feature."],["Lakeland had more visitors than Coastal in every month.","false","In the winter months Coastal is higher (for example 450 against 140 in February)."],["Coastal's numbers fell below 400 in winter.","false","Its lowest figure is 420 in January."]],"overview":[["Overall, both parks were busiest in summer, but Lakeland was far more seasonal, while Coastal attracted a steadier number of visitors all year.",true,"Shared pattern plus the key difference. No figures."],["The graph shows that more people visit Lakeland than Coastal.",false,"This is not true for the whole year, so it misreports the data."],["Lakeland had 120 visitors a day in January and 1,620 in August, while Coastal had 420 and 1,040.",false,"Four figures in an overview. Save them for the body."],["Coastal was the more popular park in winter and Lakeland in summer.",true,"A clear comparison across the whole year, with no figures."],["The data are interesting because tourism affects local economies.",false,"Irrelevant: it adds an opinion not shown in the graph."],["Visitors to Lakeland rose and then fell between April and November.",false,"Only describes one line for part of the year."]],"group":{"names":["Lakeland","Coastal"],"instr":"Body paragraph 1 is about <b>Lakeland<\/b> and paragraph 2 about <b>Coastal<\/b>. Which paragraph does each fact belong in?","note":"This is a rare case where grouping by park works better than by trend, because each park has its own shape. The comparison between them goes at the end of paragraph 2.","items":[["Fewer than 150 visitors a day in January and February",0],["A peak of 1,620 in August",0],["A fall to 210 in November",0],["Never below 400 visitors in any month",1],["A peak of only 1,040 in August",1],["About two and a half times as many visitors in August as in January",1]]},"cloze":{"para":1,"words":["began","stayed","below","soared","passing","peaking","before","collapsing","by","In other words","over","as"],"extra":["rose","above","than","while"],"note":"<i>peaking at<\/i> and <i>collapsing to<\/i> are participles that add information without starting a new sentence.","segs":["Lakeland "," the year with just 120 visitors a day in January and "," "," 300 until March. From April numbers ",", "," 1,000 in June and "," at 1,620 in August, "," "," to 210 "," November and 150 in December. ",", its busiest month attracted "," ten times "," many visitors as its quietest."]},"model":["The graph illustrates how the average number of daily visitors to two national parks, Lakeland and Coastal, changed month by month over a year. Overall, both parks were busiest in summer, but Lakeland's visitor numbers were far more seasonal, whereas Coastal attracted a steadier flow all year.","Lakeland began the year with just 120 visitors a day in January and stayed below 300 until March. From April numbers soared, passing 1,000 in June and peaking at 1,620 in August, before collapsing to 210 by November and 150 in December. In other words, its busiest month attracted over ten times as many visitors as its quietest.","Coastal's pattern was much gentler. Its figures rose from 420 in January to a peak of 1,040 in August, only about two and a half times the winter level, and never fell below 400, even in December (440). As a result, Coastal was the more popular park from October to April, drawing, for example, 480 visitors a day in November against Lakeland's 210, although Lakeland overtook it from June to September."],"band7":{"para":1,"text":"Lakeland started the year with only 120 visitors a day in January and it stayed under 300 until March. From April the numbers goes up very fast, passing 1,000 in June and the peak was 1,620 in August, then it fall to 210 in November and 150 in December. In other words, the busiest month attract over ten times visitors than the quietest.","faults":[["started the year with only","began the year with just","A small step up in precision: <i>began … with just<\/i> is more natural."],["the numbers goes up very fast","numbers soared","Agreement error, and <i>go up very fast<\/i> is band 5 vocabulary."],["the peak was 1,620 in August","peaking at 1,620 in August","A participle clause links the ideas instead of starting a new clause."],["then it fall to","before collapsing to","Wrong verb form, and a weak linker."],["attract over ten times visitors than the quietest","attracted over ten times as many visitors as its quietest","A multiple needs <i>times as many … as<\/i> and the right tense."]]},"notes":{"TA":"The overview names the shared peak and the key difference (seasonality). Details are selected: the extremes of each line and the winter crossover.","CC":"Paragraph 1 covers one park fully, paragraph 2 the other and then compares them. The comparison is saved for the end, where it is clearest.","LR":"<i>soared, collapsing, seasonal, steadier flow, overtook<\/i> and the multiple <i>over ten times as many as<\/i> show precise, varied language.","GRA":"Participle clauses (<i>peaking, collapsing, drawing<\/i>), a concessive <i>although<\/i> clause and accurate comparatives and multiples."},"task":1},{"id":"t1-03","label":"Line graph · overtaking lines","short":"Electricity sources","title":"Electricity generation by source, 1980–2020","minutes":20,"prompt":"The graph below shows the amount of electricity generated from four sources in one country between 1980 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"line","title":"Electricity generated by source (terawatt-hours)","ytitle":"Terawatt-hours (TWh)","xtitle":"Year","x":["1980","1990","2000","2010","2020"],"series":[{"name":"Coal","values":[220,245,210,130,40]},{"name":"Gas","values":[40,70,160,230,250]},{"name":"Nuclear","values":[30,90,140,120,100]},{"name":"Renewables","values":[10,12,20,70,190]}]},"vocab":[["a transformation / transformed","A big change in the whole picture: <i>the energy mix was transformed<\/i>."],["dominated / dominant","Clearly the largest: <i>coal dominated in 1980<\/i>."],["overtake","One line passes another: <i>gas overtook coal before 2010<\/i>."],["negligible","So small it hardly counts: <i>renewables were negligible until 2000<\/i>."],["rocketed","A very sudden, very steep rise."],["eased back","A small fall after a peak: <i>nuclear eased back to 100<\/i>."],["in the opposite direction","A line that moves the other way: <i>gas moved in the opposite direction<\/i>."],["total generation","The sum of all sources: used for a final, general comparison."]],"plan":["<b>Introduction:<\/b> paraphrase <i>amount of electricity generated … four sources … 1980 and 2020<\/i>.","<b>Overview:<\/b> the mix changed completely: coal fell from leader to smallest; gas and renewables grew strongly.","<b>Body 1:<\/b> coal and gas, the two lines that cross: start, peak, fall and rise, overtaking.","<b>Body 2:<\/b> nuclear (rise and fall) and renewables (late surge), with the total at the end."],"read":[["Coal fell from the largest source in 1980 to the smallest in 2020.","key","The biggest change in the whole graph."],["Gas rose steadily and became the biggest source by the end of the period.","key","The clearest growth trend, ending on the highest figure (250)."],["Renewables were almost nothing until 2000, then grew very rapidly.","key","A major change of pace, and the line with the largest late growth."],["Nuclear output was 140 TWh in 2000.","detail","True, but it is only its peak. The pattern (rise then fall) matters more."],["Gas produced 70 TWh in 1990.","detail","True, but one point on the way up."],["Nuclear power was always the lowest source.","false","Renewables were lower until 2010 and coal was lower in 2020."],["Coal output rose throughout the period.","false","It peaked in 1990 and then fell sharply."]],"overview":[["Overall, the energy mix was transformed: coal went from the leading source to the smallest, while gas and renewables grew strongly.",true,"Names the main change for each line with no figures."],["Gas was 40 TWh in 1980 and 250 TWh in 2020, whereas coal was 220 and 40.",false,"Four figures in an overview. They belong in the body."],["Overall, electricity generation became cleaner, which is good for the environment.",false,"An opinion or evaluation that the graph does not support."],["Total generation almost doubled, and renewables overtook both nuclear and coal by 2020.",true,"Two broad, accurate features. Totals need a calculation, but the claim is safe."],["The graph has four lines and five years on the horizontal axis.",false,"Describes the layout, not the data."],["In 1990 coal was higher than gas.",false,"A single-year comparison, not an overview."]],"group":{"names":["Coal and gas","Nuclear and renewables"],"instr":"The model uses two body paragraphs. <b>Which paragraph does each fact belong in?<\/b>","note":"Coal and gas make the first pair because they move in opposite directions and cross. Nuclear and renewables are the second pair: one rises then eases back, the other stays tiny and then surges.","items":[["Coal peaked at 245 TWh in 1990",0],["Gas overtook coal between 2000 and 2010",0],["Gas reached 250 TWh in 2020",0],["Nuclear peaked at 140 TWh in 2000",1],["Renewables were only 20 TWh in 2000",1],["Renewables reached 190 TWh in 2020",1]]},"cloze":{"para":1,"words":["dominated","more than","well ahead of","peaked","dropping","in the opposite direction","rising","overtaking","finally"],"extra":["fell","less than","behind"],"note":"Notice how <i>peaked at … but then declined<\/i> and <i>moved in the opposite direction<\/i> link the coal and gas lines into one story.","segs":["In 1980, coal "," with 220 terawatt-hours, "," five times the output of gas (40) and "," nuclear (30) and renewables (10). Coal "," at 245 in 1990 but then declined, "," to 130 in 2010 and just 40 in 2020. Gas moved ",", "," steadily to 160 in 2000 and "," coal before 2010, "," reaching a peak of 250."]},"model":["The line graph shows how much electricity a country generated from coal, gas, nuclear power and renewable sources at ten-year intervals between 1980 and 2020. Overall, the energy mix was transformed: coal went from market leader to the smallest contributor, while gas and, in particular, renewables grew strongly.","In 1980, coal dominated with 220 terawatt-hours, more than five times the output of gas (40) and well ahead of nuclear (30) and renewables (10). Coal peaked at 245 in 1990 but then declined, dropping to 130 in 2010 and just 40 in 2020. Gas moved in the opposite direction, rising steadily to 160 in 2000 and overtaking coal before 2010, finally reaching a peak of 250.","The other two sources followed different paths. Nuclear output grew from 30 to 140 between 1980 and 2000, then eased back to 100 by 2020. Renewables were negligible until 2000, when they stood at only 20, but they then rocketed to 70 in 2010 and 190 in 2020, overtaking both nuclear and coal, so that total generation almost doubled from 300 to 580 terawatt-hours."],"band7":{"para":1,"text":"In 1980, coal was the biggest with 220 terawatt-hours, that was more than five times than gas (40) and more than nuclear (30) and renewables (10). Coal reached the top at 245 in 1990 but after that it was decreasing, to 130 in 2010 and just 40 in 2020. Gas went the other way, it rised to 160 in 2000 and passed coal before 2010, and the last was a peak of 250.","faults":[["that was more than five times than gas","more than five times the output of gas","A multiple does not take <i>than<\/i>, and a relative clause is not needed."],["more than nuclear (30) and renewables (10)","well ahead of nuclear (30) and renewables (10)","<i>Well ahead of<\/i> is more precise than repeating <i>more than<\/i>."],["Coal reached the top at 245","Coal peaked at 245","A single verb is more precise than a phrase."],["it was decreasing","it declined","A completed past change needs past simple, not past continuous."],["Gas went the other way, it rised","Gas moved in the opposite direction, rising","A comma splice, an incorrect past form, and informal vocabulary."],["and the last was a peak of 250","finally reaching a peak of 250","<i>the last was<\/i> is not grammatical here."]]},"notes":{"TA":"The overview captures the transformation of the mix. The body covers every line, with the key points: peaks, the crossing of gas and coal, and the late surge of renewables.","CC":"Coal and gas (which cross) form paragraph 2, nuclear and renewables paragraph 3. A final sentence about total generation ties the whole graph together.","LR":"<i>dominated, peaked, negligible, rocketed, eased back, overtaking<\/i> and the multiple <i>more than five times the output of<\/i>.","GRA":"Participles (<i>dropping, rising, overtaking<\/i>), a relative clause (<i>when they stood at only 20<\/i>), and tense used correctly for every period."},"task":1},{"id":"t1-04","label":"Bar chart · two groups","short":"Leisure time by age","title":"Weekly leisure time: young and older adults","minutes":20,"prompt":"The chart below shows the number of hours per week that two age groups spend on five leisure activities. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"bar","title":"Hours per week spent on leisure activities","ytitle":"Hours per week","x":["Watching TV","Gaming","Sport","Reading","Socialising"],"series":[{"name":"Aged 16–24","values":[9,12,6,3,11]},{"name":"Aged 55 and over","values":[21,2,4,8,7]}]},"vocab":[["devote … to / spend … on","Time vocabulary: <i>devote almost the same total time to leisure<\/i>."],["whereas / while / by contrast","Contrast two groups in one sentence."],["the reverse is true","The opposite pattern: <i>gaming is the reverse<\/i>."],["more than twice / six times as long as","Multiples: <i>more than twice the figure for<\/i>."],["favour / concentrate on","A formal way to say “mostly do”: <i>older people concentrate on television<\/i>."],["respectively","Match two figures to two items in order: <i>7 and 4 hours respectively<\/i>."],["the only other activity in which …","Signals the last difference: <i>the only other activity in which older people lead<\/i>."],["in total","The sum: <i>in total, the younger group spends about 41 hours<\/i>."]],"plan":["<b>Introduction:<\/b> paraphrase <i>number of hours per week … two age groups … five leisure activities<\/i>.","<b>Overview:<\/b> totals are almost equal, but the age groups choose different activities.","<b>Body 1:<\/b> the biggest contrast: television (older) and gaming (younger).","<b>Body 2:<\/b> the smaller differences: socialising, sport, reading; then the totals."],"read":[["Older people spent far more time watching television than younger people did.","key","The largest difference between the groups: 21 hours against 9."],["Younger people spent far more time gaming, while older people spent very little.","key","The second largest gap, and in the opposite direction."],["Overall, the two groups spend almost the same total time on these activities.","key","A less obvious feature you find only by adding: 41 against 42 hours."],["Sport was the third most popular activity for the 16–24 group.","detail","A ranking detail that adds little to the comparison."],["Young people spend 3 hours a week reading.","detail","True but only a single figure."],["Older people spend more time socialising than young people.","false","Reversed: the young spend 11 hours, the older group 7."],["Gaming was the most popular activity for both groups.","false","For the older group it is the least popular (2 hours)."]],"overview":[["Overall, the two age groups spend almost the same total time on leisure, but younger people favour gaming and socialising, whereas older people prefer television and reading.",true,"The surprising similarity plus the main difference, no figures."],["Young people spend 12 hours gaming and older people spend 21 hours on television.",false,"Two figures in an overview. Move them into the body."],["The chart shows leisure activities for two age groups.",false,"Repeats the introduction."],["Older people watch the most television and younger people play the most games, which is a sad change from the past.",false,"An opinion and a claim about “the past” that the chart does not show."],["The two groups differ most in television and gaming, and least in sport.",true,"A valid second overview: the largest and the smallest differences."],["There are five activities and two age groups.",false,"Describes the layout, not the data."]],"group":{"names":["Biggest contrast: TV and gaming","Smaller differences and totals"],"instr":"Body 1 deals with the biggest contrast, body 2 with the rest. <b>Which paragraph?<\/b>","note":"Putting the two biggest gaps together gives a strong first body paragraph, and the smaller differences plus the totals finish the report with a general comparison.","items":[["Older people watch TV for 21 hours; younger people 9",0],["Young people game for 12 hours; older people 2",0],["Gaming: six times as long for the younger group",0],["Socialising: 11 hours against 7",1],["Reading: the only other activity where older people lead",1],["Total time: about 41 hours against 42",1]]},"cloze":{"para":1,"words":["contrast","lies","watch","twice","whereas","reverse","play","six times","who","only"],"extra":["gap","manage","less"],"note":"<i>whereas<\/i> puts the two groups in one sentence; <i>who manage only<\/i> adds a comparison without a new sentence.","segs":["The biggest "," "," in screen-based activities. Older people "," television for 21 hours a week, more than "," the figure for the younger group (9 hours), "," gaming is the ",": 16- to 24-year-olds "," for 12 hours, "," as long as the over-55s, "," manage "," 2 hours."]},"model":["The bar chart compares how many hours per week people aged 16 to 24 and people over 55 spend on five leisure activities. Overall, the two age groups devote almost the same total time to leisure, but they spend it very differently: young people favour gaming and socialising, whereas older people concentrate on television and reading.","The biggest contrast lies in screen-based activities. Older people watch television for 21 hours a week, more than twice the figure for the younger group (9 hours), whereas gaming is the reverse: 16- to 24-year-olds play for 12 hours, six times as long as the over-55s, who manage only 2 hours.","The remaining activities show smaller differences. Young people socialise for 11 hours and play sport for 6, compared with 7 and 4 hours respectively among older people. Reading is the only other activity in which older people lead, at 8 hours against just 3 for the young. In total, the younger group spends about 41 hours on these pastimes and the older group 42."],"band7":{"para":1,"text":"The biggest difference is in screen-based activities. Older people are watching television for 21 hours a week, which is more than two times of the younger group (9 hours), but gaming is opposite: 16- to 24-year-olds play 12 hours, it is six times longer than over-55s, who only manage 2 hours.","faults":[["The biggest difference is in","The biggest contrast lies in","A collocation upgrade."],["are watching television","watch television","A habit or routine is present simple, not present continuous."],["which is more than two times of the younger group","more than twice the figure for the younger group","<i>times of<\/i> is not used; <i>twice the figure for<\/i> is the model collocation."],["but gaming is opposite","whereas gaming is the reverse","A more precise contrast linker, and the standard phrase <i>the reverse<\/i>."],["it is six times longer than over-55s","six times as long as the over-55s","A comma splice and an inaccurate comparison structure."],["who only manage 2 hours","who manage only 2 hours","Position of <i>only<\/i>: it modifies the number."]]},"notes":{"TA":"The overview captures both the similarity (totals) and the difference (type of activity). All five activities and both groups are covered with accurate figures.","CC":"Body 1 = the biggest contrast, body 2 = the rest, in descending order of importance. <i>whereas, compared with, only other<\/i> link comparisons clearly.","LR":"<i>devote, favour, concentrate on, screen-based, respectively, the reverse<\/i>.","GRA":"Comparison structures (<i>more than twice the figure for, six times as long as<\/i>), relative clauses (<i>who manage only 2 hours<\/i>), and a calculation for the totals."},"task":1},{"id":"t1-05","label":"Bar chart · change over time","short":"Graduates by subject","title":"University graduates by subject, 2000 and 2020","minutes":20,"prompt":"The chart below shows the number of university graduates, in thousands, in six subject areas in 2000 and in 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"bar","title":"University graduates by subject (thousands)","ytitle":"Graduates (thousands)","x":["Business","Engineering","Medicine and health","Arts and humanities","Computer science","Education"],"series":[{"name":"2000","values":[120,95,60,110,20,105]},{"name":"2020","values":[190,110,135,85,140,70]}]},"vocab":[["a sevenfold increase","Multiples: <i>a sevenfold increase<\/i>, <i>more than doubled<\/i>, <i>tripled<\/i>."],["the most dramatic growth","A superlative for the biggest change."],["lost ground","Fell or became less important: <i>two traditional subjects lost ground<\/i>."],["modest growth","A small rise: <i>engineering grew only modestly<\/i>."],["in both years","A feature that does not change: <i>Business was the largest in both years<\/i>."],["a mere / only / just","To stress a small figure: <i>from a mere 20 thousand<\/i>."],["the second largest field","Ordinal + superlative: <i>the second largest, the third highest<\/i>."],["taken together","A summing-up phrase for the total."]],"plan":["<b>Introduction:<\/b> paraphrase <i>number of university graduates, in thousands, in six subject areas<\/i>.","<b>Overview:<\/b> four subjects grew (computer science and medicine most), two fell (arts, education).","<b>Body 1:<\/b> the four subjects that grew, biggest changes first.","<b>Body 2:<\/b> the two that fell, and the overall total."],"read":[["Computer science grew faster than any other subject, from 20 to 140 thousand.","key","The biggest change on the chart (a sevenfold increase)."],["Business was the largest subject in both years.","key","A stable ranking at the top, useful for the overview."],["Arts and humanities and education were the only subjects whose graduate numbers fell.","key","A clear contrast with the other four, so a main feature."],["Engineering produced 95 thousand graduates in 2000.","detail","True, but a single figure."],["Education had 105 thousand graduates in 2000.","detail","True, but a single starting figure."],["Medicine and health overtook business in 2020.","false","Business (190) stays far above medicine and health (135)."],["Every subject increased its graduate numbers.","false","Arts and humanities and education both fell."]],"overview":[["Overall, graduate numbers rose in four of the six areas, most dramatically in computer science and medicine, while arts and education declined.",true,"Two directions of change, and the strongest changes, with no figures."],["Business was the biggest subject in both years, and the total number of graduates rose.",true,"A stable feature plus the overall trend: a sound second overview."],["Computer science graduates rose from 20 thousand to 140 thousand, and medicine from 60 thousand to 135 thousand.",false,"Figures belong in the body paragraphs."],["The chart shows the number of graduates in six subjects in two years.",false,"Repeats the question. It reports no feature."],["Universities should offer more arts courses because fewer people study them now.",false,"An opinion. Task 1 reports what the chart shows."],["Engineering rose by 15 thousand.",false,"A single detail about one subject."]],"group":{"names":["Increased","Decreased"],"instr":"Body 1 describes the subjects that increased, body 2 those that decreased. <b>Which group is each fact in?<\/b>","note":"Grouping by direction of change is the simplest, clearest structure for a before-and-after bar chart. Order within each group from largest to smallest change.","items":[["Business: 120 to 190 thousand",0],["Computer science: 20 to 140 thousand",0],["Medicine and health: 60 to 135 thousand",0],["Engineering: 95 to 110 thousand",0],["Arts and humanities: 110 to 85 thousand",1],["Education: 105 to 70 thousand",1]]},"cloze":{"para":1,"words":["most popular","rising","expansion","striking","mere","increase","second largest","more than","while","only modestly"],"extra":["fastest","less than","whereas"],"note":"<i>a sevenfold increase that made it…<\/i> is a noun phrase plus a relative clause. It packs a calculation and a result into one phrase.","segs":["Business was the "," subject in both years, "," from 120 thousand to 190 thousand graduates. The "," in computer science was far more ",": from a "," 20 thousand in 2000 to 140 thousand in 2020, a sevenfold "," that made it the "," field. Medicine and health also "," doubled, from 60 thousand to 135 thousand, "," engineering grew ",", from 95 thousand to 110 thousand."]},"model":["The bar chart compares how many people graduated from university in each of six subjects in 2000 and 2020, with figures given in thousands. Overall, graduate numbers rose in four of the six areas, with the most dramatic growth in computer science and medicine, whereas arts and education were the only subjects to decline.","Business was the most popular subject in both years, rising from 120 thousand to 190 thousand graduates. The expansion in computer science was far more striking: from a mere 20 thousand in 2000 to 140 thousand in 2020, a sevenfold increase that made it the second largest field. Medicine and health also more than doubled, from 60 thousand to 135 thousand, while engineering grew only modestly, from 95 thousand to 110 thousand.","By contrast, two traditional subjects lost ground. Arts and humanities fell from 110 thousand to 85 thousand, and education declined from 105 thousand to 70 thousand, the biggest drop of any subject. Taken together, these changes meant that total graduate numbers climbed from about 510 thousand in 2000 to around 730 thousand in 2020."],"band7":{"para":1,"text":"Business was the most popular subject in both of years, going up from 120 thousand to 190 thousand graduates. The increase in computer science was much more bigger: from only 20 thousand in 2000 until 140 thousand in 2020, it is seven times higher and become the second largest field. Medicine and health also more than doubled, from 60 thousand to 135 thousand, but engineering only grow a little, from 95 thousand to 110 thousand.","faults":[["in both of years","in both years","<i>both<\/i> is followed directly by the noun."],["going up from 120 thousand","rising from 120 thousand","A more formal, precise trend verb."],["much more bigger","far more striking","A double comparative; <i>striking<\/i> is also more precise than <i>big<\/i>."],["until 140 thousand in 2020","to 140 thousand in 2020","<i>from … to …<\/i>, not <i>until<\/i>."],["it is seven times higher and become the second largest field","a sevenfold increase that made it the second largest field","A comma splice with a verb error; a noun phrase and a relative clause fix both."],["engineering only grow a little","engineering grew only modestly","Agreement, tense, and a precise adverb."]]},"notes":{"TA":"The overview captures the two directions of change and the strongest movers. Every subject is reported, and the total is added at the end as a final comparison.","CC":"Body 1 = increases (largest change first), body 2 = decreases, then the total. <i>By contrast<\/i> and <i>Taken together<\/i> make the structure easy to follow.","LR":"<i>sevenfold, expansion, striking, lost ground, modestly, a mere<\/i>: varied vocabulary for size of change.","GRA":"Noun phrase with a relative clause (<i>a sevenfold increase that made it…<\/i>), concession (<i>whereas, while<\/i>) and correct superlatives."},"task":1},{"id":"t1-06","label":"Bar chart · comparing cities","short":"How commuters travel","title":"How people travel to work in six cities","minutes":20,"prompt":"The chart below shows the percentage of commuters in six cities who travel to work by three different methods. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"bar","title":"Main method of travel to work (% of commuters)","ytitle":"% of commuters","x":["Amsterdam","Tokyo","Los Angeles","Lagos","Sydney","Copenhagen"],"series":[{"name":"Car","values":[30,14,84,28,66,26]},{"name":"Public transport","values":[20,62,6,53,24,22]},{"name":"Walking or cycling","values":[50,24,10,19,10,52]}]},"vocab":[["dominate / the dominant mode","Clearly the most common: <i>cars dominate in Los Angeles<\/i>."],["accounts for","Describe a share: <i>public transport accounts for 62% of trips<\/i>."],["no more than / as few as","A maximum: <i>no more than 30% travel by car<\/i>."],["the reverse pattern","The opposite picture: <i>public transport shows the reverse pattern<\/i>."],["fall in between","Values between two extremes: <i>Lagos and Tokyo fall in between<\/i>."],["commuters / journeys to work","Alternatives to avoid repeating <i>people who travel<\/i>."],["far above / well below","Big gaps with comparative phrases."],["respectively","Two figures matched in order: <i>19% and 24% respectively<\/i>."]],"plan":["<b>Introduction:<\/b> paraphrase <i>percentage of commuters … three different methods<\/i>.","<b>Overview:<\/b> each city has a different main mode (cars, public transport, active travel), with no figures.","<b>Body 1:<\/b> car use and public transport: the highest and lowest cities.","<b>Body 2:<\/b> walking and cycling: the two European leaders, then the rest."],"read":[["Car use was by far the highest in Los Angeles, at 84%.","key","The most extreme figure on the chart."],["Public transport was the main method in Tokyo and Lagos.","key","A group of cities sharing a main method."],["Walking or cycling was the main method in Amsterdam and Copenhagen, at around half of commuters.","key","The third group. Together these three statements describe the whole chart."],["Amsterdam had 20% of commuters using public transport.","detail","True, but a minor single figure."],["Sydney had 24% of commuters using public transport.","detail","True, but a minor single figure."],["Cars were the most popular method in four of the six cities.","false","Cars lead in only two cities (Los Angeles, Sydney)."],["Tokyo had the highest proportion of walkers and cyclists.","false","Tokyo has 24%. Copenhagen (52%) and Amsterdam (50%) are highest."]],"overview":[["Overall, each city has a clearly different main mode: cars dominate in Los Angeles and Sydney, public transport in Tokyo and Lagos, and walking or cycling in Amsterdam and Copenhagen.",true,"Groups the six cities by their main mode. No figures."],["Los Angeles has 84% car commuters, Tokyo has 62% public transport commuters and Copenhagen has 52% cyclists.",false,"Three figures in an overview. Move them to the body."],["In general, the further a city is from Europe, the more people drive.",false,"Not supported: Tokyo and Lagos, far from Europe, have low car use."],["Cars are less used in Tokyo than anywhere else, and the two North European cities have the highest active travel.",true,"Two extreme comparisons, no figures."],["The chart shows commuting in six cities by car, public transport and walking or cycling.",false,"Repeats the introduction."],["Everyone should use public transport because it is cheaper.",false,"An opinion with no basis in the chart."]],"group":{"names":["Car and public transport","Walking and cycling"],"instr":"The model describes car and public transport together, then walking and cycling. <b>Which paragraph does each fact belong in?<\/b>","note":"Car and public transport are two sides of the same pattern (where one is high the other is low), so they belong together. Active travel is the third mode and gets its own paragraph.","items":[["84% drive in Los Angeles",0],["Only 14% drive in Tokyo",0],["62% use public transport in Tokyo",0],["50% walk or cycle in Amsterdam",1],["52% walk or cycle in Copenhagen",1],["Only 10% walk or cycle in Sydney",1]]},"cloze":{"para":1,"words":["highest","far above","by contrast","no more than","lowest","reverse","accounts for","but"],"extra":["most","however","below","only"],"note":"<i>by contrast<\/i> and <i>reverse pattern<\/i> turn two sets of numbers into one comparison.","segs":["Car use is "," in Los Angeles, where 84% of commuters drive, "," Sydney's 66%. In the other four cities, ",", "," 30% travel by car, and Tokyo has the "," figure at just 14%. Public transport shows the "," pattern: it "," 62% of trips in Tokyo and 53% in Lagos, "," only 6% in Los Angeles."]},"model":["The bar chart compares how commuters in six cities travel to work, dividing journeys into car, public transport, and walking or cycling. Overall, each city has a clearly different main mode: cars dominate in Los Angeles and Sydney, public transport in Tokyo and Lagos, and walking or cycling in Amsterdam and Copenhagen.","Car use is highest in Los Angeles, where 84% of commuters drive, far above Sydney's 66%. In the other four cities, by contrast, no more than 30% travel by car, and Tokyo has the lowest figure at just 14%. Public transport shows the reverse pattern: it accounts for 62% of trips in Tokyo and 53% in Lagos, but only 6% in Los Angeles.","Walking and cycling are the main choices in the two northern European cities, accounting for around half of all commuting in Copenhagen (52%) and Amsterdam (50%), compared with just 10% in both Los Angeles and Sydney. Lagos and Tokyo fall in between, at 19% and 24% respectively."],"band7":{"para":1,"text":"Car use is the most high in Los Angeles, where 84% of commuters drives, which is much more than Sydney 66%. In the other four cities, but, not more than 30% travel by car, and Tokyo has the lowest with just 14%. Public transport is opposite: it takes 62% of trips in Tokyo and 53% in Lagos, however only 6% in Los Angeles.","faults":[["the most high in","highest in","The superlative of a short adjective is <i>-est<\/i>."],["commuters drives","commuters drive","Agreement."],["which is much more than Sydney 66%","far above Sydney's 66%","A precise comparison and the possessive."],["In the other four cities, but, not more than","In the other four cities, by contrast, no more than","<i>but<\/i> cannot follow a comma like that; <i>by contrast<\/i> is the linker."],["the lowest with just 14%","the lowest figure at just 14%","A noun is needed after <i>lowest<\/i> and <i>at<\/i> introduces a figure."],["Public transport is opposite","Public transport shows the reverse pattern","A fixed phrase and a verb with a noun phrase object."],["however only 6%","but only 6%","<i>However<\/i> cannot join two clauses with a comma."]]},"notes":{"TA":"The overview groups all six cities by main mode in a single sentence. The body then uses the extreme values (highest, lowest) rather than listing all 18 figures.","CC":"Paragraph 2 treats car and public transport as a linked pair, paragraph 3 covers the third mode. <i>by contrast, reverse pattern, compared with, in between<\/i> manage the comparisons.","LR":"<i>dominate, accounts for, the reverse pattern, fall in between, respectively<\/i> and precise comparisons (<i>far above<\/i>).","GRA":"A non-defining relative clause (<i>where 84% of commuters drive<\/i>), a colon for explanation, participle (<i>accounting for<\/i>) and consistent present tense."},"task":1},{"id":"t1-07","label":"Pie charts · two years","short":"Household spending","title":"How households spent their money, 1970 and 2020","minutes":20,"prompt":"The pie charts below show how an average household in one country spent its money in 1970 and in 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"pie","title":"Household spending (%)","unit":"%","charts":[{"title":"1970","slices":[["Housing",22],["Food",34],["Transport",12],["Leisure",8],["Clothing",14],["Other",10]]},{"title":"2020","slices":[["Housing",36],["Food",14],["Transport",16],["Leisure",17],["Clothing",6],["Other",11]]}]},"vocab":[["accounted for the largest share","The biggest slice: <i>food accounted for the largest share<\/i>."],["percentage points","The difference between two percentages: <i>rose by 14 percentage points<\/i>."],["less than half its earlier level","A fall by more than 50%."],["by far the largest","Much bigger than the next: <i>by far the largest category<\/i>."],["more than doubled","From 8% to 17% is slightly more than double."],["overtaken by","A category passes another: <i>food was overtaken by housing<\/i>."],["remained almost unchanged","A stable slice: <i>stayed almost unchanged at 10% and 11%<\/i>."],["followed by","Ranking: <i>followed by housing and clothing<\/i>."]],"plan":["<b>Introduction:<\/b> paraphrase <i>how an average household spent its money<\/i>.","<b>Overview:<\/b> food falls from first to a smaller share, housing becomes the biggest, leisure grows.","<b>Body 1:<\/b> the categories that fell or were replaced at the top: food and clothing, and housing's rise.","<b>Body 2:<\/b> leisure and transport (up), other (steady)."],"read":[["Housing's share rose to become the largest category in 2020.","key","A change of leader: the most important change."],["The share of spending on food fell sharply, from the largest to a much smaller share.","key","The other end of the same change: the biggest fall."],["The share of spending on leisure more than doubled.","key","The strongest growth in relative terms."],["Clothing took 14% of spending in 1970.","detail","True, but a single figure."],["Transport rose from 12% to 16%.","detail","True, but a small change."],["The ‘other’ category was the smallest in 2020.","false","Clothing (6%) was the smallest in 2020."],["Households spent more on food in 2020 than in 1970.","false","Food fell from 34% to 14%."]],"overview":[["Overall, spending patterns changed dramatically: food, once the largest expense, was overtaken by housing, while leisure became far more important and clothing less so.",true,"Names the main shifts, with no figures."],["Food went from 34% to 14%, housing from 22% to 36%, and leisure from 8% to 17%.",false,"Figures in an overview."],["Housing became the single largest category, and food fell below it.",true,"Two key features in one sentence. A good second overview."],["The pie charts show how households spent their money.",false,"Repeats the introduction."],["People today are much happier because they spend more on leisure.",false,"An unsupported opinion."],["Clothing fell by 8 percentage points.",false,"A single detail about one category."]],"group":{"names":["Share rose or stayed level","Share fell"],"instr":"Sort each fact by what happened to that category's share between 1970 and 2020. <b>Did it rise (or stay level), or did it fall?<\/b>","note":"Reporting falls and rises as two groups makes both visible. In your report you would put the biggest changes (food and housing) first, then the smaller ones.","items":[["Housing: 22% to 36%",0],["Leisure: 8% to 17%",0],["Transport: 12% to 16%",0],["Other: 10% to 11%",0],["Food: 34% to 14%",1],["Clothing: 14% to 6%",1]]},"cloze":{"para":1,"words":["accounted for","followed by","however","fallen","less than","dropped","in contrast","rose","making","by far"],"extra":["accounting","fell","more than"],"note":"<i>making it by far the largest category<\/i> is a participle clause: a result added to the main clause.","segs":["In 1970, food "," the largest share of spending at 34%, "," housing (22%) and clothing (14%). By 2020, ",", the share spent on food had "," to just 14%, "," half its earlier level, and clothing had "," even further to 6%. Housing, ",", "," by 14 percentage points to 36%, "," it "," the largest category."]},"model":["The two pie charts compare how an average household in one country divided its spending between six categories in 1970 and 2020. Overall, the pattern of spending changed dramatically: food, which was once the biggest expense, was overtaken by housing, while leisure became far more important and clothing less so.","In 1970, food accounted for the largest share of spending at 34%, followed by housing (22%) and clothing (14%). By 2020, however, the share spent on food had fallen to just 14%, less than half its earlier level, and clothing had dropped even further to 6%. Housing, in contrast, rose by 14 percentage points to 36%, making it by far the largest category.","Leisure spending more than doubled, from 8% to 17%, and transport also increased, from 12% to 16%. The remaining category, labelled ‘other’, stayed almost unchanged, at 10% in 1970 and 11% in 2020. Taken together, housing, leisure and transport accounted for 69% of spending in 2020, compared with 42% in 1970."],"band7":{"para":1,"text":"In 1970, food was the biggest share of spending with 34%, following by housing (22%) and clothing (14%). In 2020 however the share for food has fell to just 14%, it is less than half of before, and clothing dropped even more to 6%. Housing, in contrast, rise by 14 percent to 36%, so it is the largest category by far.","faults":[["food was the biggest share of spending with 34%","food accounted for the largest share of spending at 34%","A more precise phrase and the correct preposition for a figure."],["following by housing","followed by housing","A participle that is passive: <i>followed by<\/i>."],["In 2020 however the share for food has fell","By 2020, however, the share spent on food had fallen","Punctuation of <i>however<\/i>, the correct tense (past perfect), and the past participle."],["it is less than half of before","less than half its earlier level","A comma splice and a vague phrase."],["rise by 14 percent to 36%","rose by 14 percentage points to 36%","Tense, and <i>percentage points<\/i> for the difference between two percentages."],["so it is the largest category by far","making it by far the largest category","A participle clause is more concise than <i>so it is<\/i>."]]},"notes":{"TA":"The overview captures the change at the top (food → housing) and the shift to leisure. The body reports every category with selected figures and a calculation (percentage points).","CC":"Paragraph 2 = the big shifts, paragraph 3 = the smaller ones. <i>however, in contrast, also<\/i> mark contrast and addition.","LR":"<i>accounted for, overtaken by, percentage points, remained almost unchanged, labelled<\/i>.","GRA":"Past perfect (<i>had fallen<\/i>), a participle clause (<i>making it by far…<\/i>), a non-defining relative clause (<i>which was once the biggest expense<\/i>) and passive (<i>was overtaken<\/i>)."},"task":1},{"id":"t1-08","label":"Pie charts · projection","short":"Age structure of a population","title":"Age structure of a population: 1990, 2020 and 2050","minutes":20,"prompt":"The pie charts below show the age structure of the population of one country in 1990 and 2020, with a projection for 2050. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"pie","title":"Population by age group (%)","unit":"%","charts":[{"title":"1990","slices":[["Aged 0–14",27],["Aged 15–64",65],["Aged 65 and over",8]]},{"title":"2020","slices":[["Aged 0–14",19],["Aged 15–64",66],["Aged 65 and over",15]]},{"title":"2050 (projected)","slices":[["Aged 0–14",14],["Aged 15–64",59],["Aged 65 and over",27]]}]},"vocab":[["the working-age group","The 15 to 64 group: <i>the working-age group stays the largest<\/i>."],["ageing population","A population with more old people: <i>the population is ageing<\/i>."],["is projected / predicted / expected to","Future tense for the 2050 chart: <i>is projected to fall to 59%<\/i>."],["almost doubled","From 8% to 15% is nearly double."],["the proportion of … is shrinking","A gradual fall in a group's share."],["steadily","A trend that moves one way across all three charts."],["whereas","Contrast two groups in the same year."],["its lowest level in the period","A final extreme: <i>fall to 59%, its lowest level in the period<\/i>."]],"plan":["<b>Introduction:<\/b> paraphrase <i>age structure of the population<\/i>, mentioning the projection.","<b>Overview:<\/b> the population is ageing: children down, over-65s up, working-age group largest throughout.","<b>Body 1:<\/b> the past: 1990 compared with 2020, for all three groups.","<b>Body 2:<\/b> the projection to 2050, using projection language."],"read":[["The share of people aged 65 and over rose in every chart, from 8% to a projected 27%.","key","The strongest trend across all three charts."],["The share of children fell in every chart.","key","The opposite trend, completing the picture of an ageing population."],["The working-age group was
