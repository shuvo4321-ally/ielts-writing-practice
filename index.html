the largest group in all three years.","key","A constant feature: important for the overview."],["In 2020, 15% of people were aged 65 and over.","detail","True, but a single figure."],["The working-age group was 66% in 2020.","detail","True, but a single figure."],["In 2050, older people will outnumber children by more than three to one.","false","27% to 14% is about two to one."],["The working-age group is projected to grow after 2020.","false","It is projected to fall from 66% to 59%."]],"overview":[["Overall, the population is ageing: the share of children is falling and the share of people aged 65 and over is rising, while the working-age group remains the largest.",true,"The main trend and a constant feature, no figures."],["The proportion of older people grows from 8% to 15% and then 27%.",false,"Figures belong in the body."],["In 2050, older people will outnumber children, and the trend is the same as in earlier years.",true,"A projection-based overview that links the future with the past."],["Governments must prepare for an older population by raising pensions.",false,"A recommendation, not a report."],["The pie charts show three groups in three years.",false,"Describes the layout."],["Children were 19% in 2020.",false,"A single detail."]],"group":{"names":["1990 and 2020 (the past)","2050 (the projection)"],"instr":"The model has one body paragraph for the past and one for the projection. <b>Which paragraph does each fact belong in?<\/b>","note":"Splitting at the point where data becomes a forecast changes the verb forms (past simple for 1990 and 2020, <i>is expected to<\/i> for 2050), so it is a natural place to start a new paragraph.","items":[["Children: 27% in 1990",0],["Over-65s almost doubled to 15% by 2020",0],["Working-age group: 65% in 1990, 66% in 2020",0],["Over-65s projected to reach 27%",1],["Working-age group projected to fall to 59%",1],["Children projected at 14%",1]]},"cloze":{"para":2,"words":["projections","continuing","expected","whereas","account for","almost double","nearly twice","predicted","lowest"],"extra":["reached","fall","more than"],"note":"Notice the future forms: <i>are expected to, will account for, is predicted to<\/i>. The data after 2020 is a forecast, not a fact.","segs":["The "," for 2050 show this trend ",". Children are "," to make up just 14% of the population, "," people aged 65 and over will "," 27%, "," today's proportion and "," the number of children. The working-age group is "," to fall to 59%, its "," level in the period."]},"model":["The three pie charts illustrate how a country's population was divided into age groups in 1990 and 2020, and how it is expected to be divided in 2050. Overall, the population is ageing: the proportion of children is shrinking while the share of people aged 65 and over is growing steadily, and the working-age group stays the largest throughout.","In 1990, more than a quarter of the population (27%) were children aged 0 to 14, and only 8% were aged 65 or over. By 2020, the proportion of children had dropped to 19%, while the elderly share had almost doubled to 15%. The working-age group, 65% in 1990, was almost unchanged at 66%.","The projections for 2050 show this trend continuing. Children are expected to make up just 14% of the population, whereas people aged 65 and over will account for 27%, almost double today's proportion and nearly twice the number of children. The working-age group is predicted to fall to 59%, its lowest level in the period."],"band7":{"para":2,"text":"The projection for 2050 show this trend is continue. Children are expect to be just 14% of the population, but old people over 65 will be 27%, that is nearly double of today and nearly twice of children. The working-age group is predict to fall to 59%, it is the lowest level in the period.","faults":[["The projection for 2050 show this trend is continue","The projections for 2050 show this trend continuing","Agreement and a participle."],["are expect to be just 14%","are expected to make up just 14%","The passive of <i>expect<\/i>, and <i>make up<\/i> for a share."],["but old people over 65","whereas people aged 65 and over","A more formal contrast, and neutral language for older people."],["that is nearly double of today and nearly twice of children","almost double today's proportion and nearly twice the number of children","<i>double<\/i> and <i>twice<\/i> take no <i>of<\/i>, and the second comparison needs <i>the number of<\/i>."],["is predict to fall","is predicted to fall","The passive needs the past participle."],["it is the lowest level in the period","its lowest level in the period","A comma splice: join with a noun phrase."]]},"notes":{"TA":"The overview identifies the ageing trend and the constant size of the working-age group. The projection is correctly described as a forecast, not as fact.","CC":"Past (1990, 2020) in one paragraph and future (2050) in another. The topic sentence of paragraph 3 (<i>The projections for 2050 show this trend continuing<\/i>) links back.","LR":"<i>shrinking, the elderly share, the working-age group, is predicted to, account for<\/i>.","GRA":"Verb forms for time (past simple, past perfect, <i>are expected to, will account for<\/i>), a participle (<i>continuing<\/i>) and contrast with <i>whereas<\/i>."},"task":1},{"id":"t1-09","label":"Pie charts · two places","short":"Tourist spending","title":"How visitors spend their money in two countries","minutes":20,"prompt":"The pie charts below show how international visitors to Iceland and to Spain divide their spending between six categories. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"pie","title":"Visitor spending by category (%)","unit":"%","charts":[{"title":"Iceland","slices":[["Accommodation",31],["Food and drink",22],["Transport",19],["Activities",20],["Shopping",5],["Other",3]]},{"title":"Spain","slices":[["Accommodation",28],["Food and drink",26],["Transport",10],["Activities",14],["Shopping",16],["Other",6]]}]},"vocab":[["takes / accounts for / makes up","Three verbs for a share: vary them."],["a close second","A second place that is nearly equal to first: <i>food and drink is a close second<\/i>."],["a minor item","A very small share: <i>shopping is a minor item in Iceland<\/i>."],["nearly double","Almost twice: <i>nearly double the Spanish figure<\/i>."],["a similar proportion","Nearly the same: <i>a similar 28%<\/i>."],["whereas / while","Contrast the two countries."],["devote … to / spend … on","Verb patterns for spending."],["is particularly significant","A strong adjective for an important category."]],"plan":["<b>Introduction:<\/b> paraphrase <i>how international visitors divide their spending<\/i>.","<b>Overview:<\/b> accommodation is the biggest cost in both; Iceland: transport and activities matter more; Spain: food and shopping.","<b>Body 1:<\/b> Iceland: accommodation, then food, activities and transport, compared with Spain.","<b>Body 2:<\/b> Spain: food, shopping, activities, then the minor categories in both."],"read":[["Accommodation was the largest category in both countries.","key","A shared feature, ideal for the overview."],["Transport and activities took a larger share of spending in Iceland than in Spain.","key","The first key difference."],["Food and drink and shopping took a larger share in Spain than in Iceland.","key","The second key difference."],["Spain's ‘other’ category was 6%.","detail","True, but a minor figure."],["Iceland's food and drink share was 22%.","detail","True, but one figure."],["Visitors to Spain spend more on transport.","false","Reversed: transport is 19% in Iceland and 10% in Spain."],["Shopping was the second biggest category in Iceland.","false","In Iceland shopping is only 5%."]],"overview":[["Overall, accommodation is the largest expense in both countries, but visitors to Iceland spend more on transport and activities, whereas visitors to Spain spend more on food and shopping.",true,"Shared feature plus the main difference, no figures."],["Spanish visitors spend 28% on accommodation and 26% on food and drink, while Icelandic visitors spend 31% and 22%.",false,"Figures in an overview."],["The two countries have different spending because Iceland is a colder country.",false,"An explanation that the charts do not support."],["The biggest differences between the two countries are in shopping and transport.",true,"A second valid overview: names the largest differences without figures."],["The pie charts show how tourists spend money in two countries.",false,"Repeats the question."],["Tourists spend little on ‘other’ things.",false,"A weak, vague detail."]],"group":{"names":["Iceland spends more","Spain spends more"],"instr":"For each category, decide which country's visitors spend the larger share. <b>Which group does each fact belong to?<\/b>","note":"Grouping by who spends more is the quickest way to find the pattern for the overview: Iceland leads in transport and activities (and slightly in accommodation); Spain in food, shopping and other.","items":[["Transport: 19% (Iceland) against 10% (Spain)",0],["Activities: 20% against 14%",0],["Accommodation: 31% against 28%",0],["Food and drink: 22% against 26%",1],["Shopping: 5% against 16%",1],["Other: 3% against 6%",1]]},"cloze":{"para":1,"words":["takes","similar","next largest","which","particularly","at","nearly double","of"],"extra":["almost","figure","more"],"note":"<i>nearly double the Spanish figure of 10%<\/i>: a multiple + <i>the<\/i> + noun + <i>of<\/i> + figure.","segs":["Accommodation "," 31% of visitor spending in Iceland and a "," 28% in Spain. In Iceland the "," items are food and drink (22%), activities (20%) and transport (19%), "," are almost equal. Transport costs are "," significant there, "," "," the Spanish figure "," 10%."]},"model":["The pie charts compare how international visitors to Iceland and Spain divide their spending across six categories. Overall, accommodation is the largest expense in both countries, but Iceland's visitors spend more on getting around and on activities, whereas Spanish visitors devote more to food and shopping.","Accommodation takes 31% of visitor spending in Iceland and a similar 28% in Spain. In Iceland the next largest items are food and drink (22%), activities (20%) and transport (19%), which are almost equal. Transport costs are particularly significant there, at nearly double the Spanish figure of 10%.","In Spain, food and drink is a close second at 26%, followed by shopping at 16% and activities at 14%. Shopping is a minor item in Iceland (5%), as is the ‘other’ category, which accounts for just 3% there and 6% in Spain. Taken together, food, shopping and ‘other’ make up 48% of Spanish visitors' spending, compared with only 30% in Iceland."],"band7":{"para":1,"text":"Accommodation take 31% of visitors spending in Iceland and 28% for Spain. In Iceland the next biggest are food and drink (22%), activities (20%) and transport (19%), they are almost the same. Transport cost is specially important there, nearly twice than the Spanish figure 10%.","faults":[["Accommodation take 31% of visitors spending","Accommodation takes 31% of visitor spending","Agreement, and <i>visitor<\/i> is an attributive noun, singular."],["and 28% for Spain","and a similar 28% in Spain","<i>in<\/i> for a country, and <i>a similar<\/i> signals the comparison."],["the next biggest are","the next largest items are","<i>largest items<\/i> is a more precise noun phrase."],["they are almost the same","which are almost equal","A comma splice: use a relative clause."],["Transport cost is specially important there","Transport costs are particularly significant there","Agreement, and the correct adverb <i>particularly<\/i>."],["nearly twice than the Spanish figure 10%","at nearly double the Spanish figure of 10%","<i>nearly double<\/i> takes no <i>than<\/i>, and a figure needs <i>of<\/i>."]]},"notes":{"TA":"A shared feature and the key differences are in the overview. Every category is covered at least once, and the figures chosen show the comparison.","CC":"Iceland first, with Spain's figures set beside it, then Spain's own pattern. <i>whereas, there, a close second<\/i> keep the comparison tight.","LR":"<i>devote … to, a close second, a minor item, particularly significant, nearly double<\/i>.","GRA":"Relative clauses (<i>which are almost equal, which accounts for<\/i>), <i>whereas<\/i>, and a mix of present-simple verbs."},"task":1},{"id":"t1-10","label":"Table · patterns by age","short":"Media use by age","title":"Time spent on four types of media, by age group","minutes":20,"prompt":"The table below shows the average number of hours per day that people in five age groups spent using four types of media. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"table","title":"Average hours per day spent on media, by age group","head":["Age group","Television","Internet","Radio","Print media"],"rows":[["16–24","1.2","4.6","0.8","0.2"],["25–34","1.8","3.9","1.1","0.3"],["35–49","2.4","2.8","1.4","0.5"],["50–64","3.3","1.7","1.2","0.9"],["65 and over","4.4","0.8","1.0","1.3"]]},"vocab":[["a generational divide","A clear difference between age groups: <i>a clear generational divide<\/i>."],["falls steadily with age","A trend across categories (not years): <i>internet use falls steadily with age<\/i>."],["the opposite trend","A reverse pattern: <i>television shows the opposite trend<\/i>."],["nearly four times as much … as","A multiple comparison: <i>nearly four times as much television as the under-25s<\/i>."],["is less age-related","A category with no clear pattern: <i>radio is less age-related<\/i>."],["peaking at … among","A highest point within the groups: <i>peaking at 1.4 hours among 35- to 49-year-olds<\/i>."],["range between … and …","A spread of values: <i>ranging between 0.8 and 1.2 hours<\/i>."],["in total","A calculation across categories: <i>in total, each group spends…<\/i>."]],"plan":["<b>Introduction:<\/b> paraphrase <i>average number of hours per day … five age groups … four types of media<\/i>.","<b>Overview:<\/b> younger people are online; older people watch television and read; total media time is similar.","<b>Body 1:<\/b> the two strongest trends: internet down with age, television up.","<b>Body 2:<\/b> print (same pattern as television), radio (less age-related), and the totals."],"read":[["Internet use fell steadily with age, from 4.6 hours among the youngest to 0.8 among the oldest.","key","The strongest trend in the table."],["Television viewing rose steadily with age, from 1.2 hours to 4.4 hours.","key","The mirror image of the internet trend."],["Total daily media time was similar for every age group, at roughly 7 hours.","key","A hidden feature you find only by adding across each row."],["People aged 35 to 49 listened to the radio for 1.4 hours.","detail","True, but a single figure (it is the radio peak)."],["Print media use was 0.9 hours among people aged 50 to 64.","detail","True, but a single figure."],["Radio use rose steadily as people got older.","false","It peaks among 35- to 49-year-olds and is lower for the oldest groups."],["The youngest group spent more time on print media than any other group.","false","They spend least (0.2 hours)."]],"overview":[["Overall, there is a clear generational divide: younger people spend most of their media time online, whereas older people favour television and print, and total media time is similar across all ages.",true,"The main contrast, plus the hidden similarity, with no figures."],["The 16–24 group spends 4.6 hours online and the 65 and over group spends 4.4 hours watching television.",false,"Two figures in an overview."],["Young people should watch less television, as it is a waste of time.",false,"An opinion and a wrong claim: young people watch the least."],["The internet is the most-used medium for the youngest groups while television is the most-used for the oldest.",true,"A second sound overview, describing the most-used medium by age."],["The table has five age groups and four types of media.",false,"Describes the layout, not the data."],["Radio is used by every age group.",false,"True, but trivial."]],"group":{"names":["Mostly younger people","Mostly older people"],"instr":"Which age end of the table does each fact describe? <b>Place each fact in the group it belongs to.<\/b>","note":"In a table with no time dimension, the most useful grouping is by pattern across the rows. Here the table splits into a younger pattern (online) and an older pattern (television and print).","items":[["4.6 hours online (16–24)",0],["3.9 hours online (25–34)",0],["Only 0.2 hours of print media (16–24)",0],["4.4 hours of television (65 and over)",1],["1.3 hours of print media (65 and over)",1],["3.3 hours of television (50–64)",1]]},"cloze":{"para":1,"words":["steadily","from","among","opposite","rising","for","oldest","so that","nearly","as"],"extra":["falling","than","about"],"note":"<i>among<\/i> is the right preposition for a group of people; <i>nearly four times as much … as<\/i> is the exact multiple pattern.","segs":["Internet use falls "," with age, "," 4.6 hours a day "," 16- to 24-year-olds to just 0.8 hours among those aged 65 and over. Television shows the "," trend, "," from 1.2 hours "," the youngest group to 4.4 hours for the ",", "," the over-65s watch "," four times "," much television as the under-25s."]},"model":["The table compares how long people in five age groups spend each day using four kinds of media. Overall, there is a clear generational divide: younger people spend most of their media time online, whereas television and print dominate the habits of older people, and total media time is surprisingly similar across all ages.","Internet use falls steadily with age, from 4.6 hours a day among 16- to 24-year-olds to just 0.8 hours among those aged 65 and over. Television shows the opposite trend, rising from 1.2 hours for the youngest group to 4.4 hours for the oldest, so that the over-65s watch nearly four times as much television as the under-25s.","Print media follow the same pattern as television but at a much lower level, increasing from only 0.2 hours to 1.3 hours. Radio is less age-related, peaking at 1.4 hours among 35- to 49-year-olds and ranging between 0.8 and 1.2 hours elsewhere. In total, each group spends between 6.8 and 7.5 hours a day with media."],"band7":{"para":1,"text":"The internet use is falling steadily with age, from 4.6 hours a day by 16- to 24-year-olds to just 0.8 hours by people over 65. Television shows opposite trend, it rises from 1.2 hours for youngest group to 4.4 hours for oldest, so the over-65s watch nearly four times more television than the under-25s.","faults":[["The internet use is falling steadily","Internet use falls steadily","No article with the general noun, and a general fact takes present simple."],["by 16- to 24-year-olds","among 16- to 24-year-olds","<i>among<\/i> for a group of people."],["by people over 65","among those aged 65 and over","A more formal and precise reference to the age group."],["shows opposite trend, it rises","shows the opposite trend, rising","A missing article, and a comma splice replaced with a participle."],["for youngest group to 4.4 hours for oldest","for the youngest group to 4.4 hours for the oldest","Superlatives need <i>the<\/i>."],["nearly four times more television than","nearly four times as much television as","A multiple takes <i>as much … as<\/i>."]]},"notes":{"TA":"The overview names the main divide and the less obvious fact that totals are similar, which comes only from adding the rows. All four media types are reported.","CC":"Body 1 = the two strongest trends, body 2 = the weaker patterns and totals. <i>whereas, the opposite trend, in total<\/i> make the structure clear.","LR":"<i>generational divide, falls steadily with age, age-related, ranging between<\/i>.","GRA":"Participle clauses (<i>rising from, peaking at, ranging<\/i>), a result clause with <i>so that<\/i>, and an accurate multiple (<i>nearly four times as much … as<\/i>)."},"task":1},{"id":"t1-11","label":"Table · numbers and shares","short":"International students","title":"International students in five countries","minutes":20,"prompt":"The table below shows the number of international students, in thousands, in five countries in 2000, 2010 and 2020, and each country's share of the total in 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"table","title":"International students (thousands)","head":["Country","2000","2010","2020","Share of total, 2020 (%)"],"rows":[["United States","500","700","1,000","40"],["United Kingdom","250","410","500","20"],["Canada","60","170","400","16"],["Australia","100","260","350","14"],["Germany","190","240","250","10"]],"note":"The share column adds up to 100%."},"vocab":[["by far the leading destination","A clear first place: <i>remained by far the leading destination<\/i>."],["doubled / more than doubled","A multiple without numbers."],["more than sixfold / more than tripled","Multiples with <i>-fold<\/i>: use for large increases."],["from last place to third","A change of rank: <i>taking it from last place to third<\/i>."],["barely grew / increased by just …","A tiny rise: <i>Germany barely grew<\/i>."],["the share of the total","A proportion: <i>with only 10% of the total<\/i>."],["intake","The number of students a country receives: <i>doubled its intake<\/i>."],["over the two decades","A period of twenty years: <i>increased over the two decades<\/i>."]],"plan":["<b>Introduction:<\/b> paraphrase <i>number of international students … five countries … 2000, 2010 and 2020 … share of the total<\/i>.","<b>Overview:<\/b> numbers rose everywhere; the USA is the leader; Canada grows fastest, Germany hardly at all.","<b>Body 1:<\/b> the two leaders: the USA and the UK both doubled.","<b>Body 2:<\/b> Canada and Australia (fastest growth), Germany (slowest), and the overall total."],"read":[["The number of international students rose in every country between 2000 and 2020.","key","A trend common to the whole table."],["The United States received the most international students in all three years, with 40% of the 2020 total.","key","The clear leader, backed by its share."],["Canada showed the most dramatic growth, from 60 thousand to 400 thousand.","key","The biggest relative change in the table."],["Australia received 260 thousand students in 2010.","detail","True, but a single middle-year figure."],["The United Kingdom's share was 20%.","detail","True, but one share."],["Germany's number of students fell between 2000 and 2020.","false","It rose slightly, from 190 to 250 thousand."],["Australia received more students than Canada in 2020.","false","Canada had 400 thousand, Australia 350 thousand."]],"overview":[["Overall, student numbers rose in every country, with the United States the leading destination throughout, Canada growing fastest and Germany hardly growing at all.",true,"Trend, leader and the extremes of growth, with no figures."],["The United States had 500 thousand students in 2000 and one million in 2020.",false,"Figures in an overview."],["More students want to study abroad now because education is more international.",false,"An explanation not supported by the table."],["The ranking changed: Canada and Australia moved ahead of Germany.",true,"A different valid feature: the change in ranking."],["The table shows five countries and three years.",false,"Describes the layout."],["The United Kingdom had 250 thousand students in 2000.",false,"A single detail."]],"group":{"names":["The two leaders","The other three"],"instr":"The model describes the two leading destinations first, then the other three. <b>Which paragraph does each fact belong in?<\/b>","note":"The USA and the UK share a pattern (both doubled), so they go together. Canada, Australia and Germany are grouped by what makes them different: Canada and Australia grew fast and Germany hardly at all.","items":[["The USA doubled to 1,000 thousand, with 40% of the total",0],["The UK doubled from 250 to 500 thousand",0],["The USA's share is twice the UK's",0],["Canada rose more than sixfold, from last place to third",1],["Australia more than tripled to 350 thousand",1],["Germany grew by just 60 thousand and fell to last",1]]},"cloze":{"para":2,"words":["fastest","more than","from","taking","third","by contrast","by just","fell","with","more than"],"extra":["less than","rose","slowest"],"note":"<i>taking it from last place to third<\/i> is a participle clause describing a change of rank. It adds a feature without a new sentence.","segs":["Canada and Australia grew ",". Canada's figure rose "," sixfold, "," only 60 thousand to 400 thousand, "," it from last place to ",", and Australia's more than tripled, from 100 thousand to 350 thousand. Germany, ",", increased "," 60 thousand over the two decades, from 190 thousand to 250 thousand, and "," from third to last, "," only 10% of the total. Overall, numbers across the five countries "," doubled, from about 1.1 million to 2.5 million."]},"model":["The table gives the number of overseas students, in thousands, who studied in each of five countries at three points, in 2000, 2010 and 2020, together with each country's percentage of the 2020 total. Overall, numbers rose everywhere, the United States remained by far the leading destination, and the biggest change was the rapid rise of Canada, while Germany barely grew.","The United States attracted 500 thousand international students in 2000 and doubled that figure to one million by 2020, giving it 40% of the total, twice the share of the United Kingdom (20%). The United Kingdom itself also doubled its intake, from 250 thousand to 500 thousand.","Canada and Australia grew fastest. Canada's figure rose more than sixfold, from only 60 thousand to 400 thousand, taking it from last place to third, and Australia's more than tripled, from 100 thousand to 350 thousand. Germany, by contrast, increased by just 60 thousand over the two decades, from 190 thousand to 250 thousand, and fell from third to last, with only 10% of the total. Overall, numbers across the five countries more than doubled, from about 1.1 million to 2.5 million."],"band7":{"para":2,"text":"Canada and Australia grew the most fast. Canada's number rose more than six times, from only 60 thousand to 400 thousand, it moved from the last place to third, and Australia's was more than three times higher, from 100 thousand to 350 thousand. Germany, but, increased only 60 thousand over the two decades, from 190 thousand to 250 thousand, and it falls from third to last, with only 10% of total. In overall, numbers across the five countries was more than double, from about 1.1 million until 2.5 million.","faults":[["grew the most fast","grew fastest","The superlative of a short adjective/adverb is <i>-est<\/i>."],["rose more than six times, from only","rose more than sixfold, from only","<i>sixfold<\/i> is the precise multiple."],["it moved from the last place to third","taking it from last place to third","A participle clause avoids a comma splice, and no article before <i>last place<\/i>."],["Germany, but, increased only 60 thousand","Germany, by contrast, increased by just 60 thousand","The correct linker, and <i>by<\/i> for the size of change."],["it falls from third to last","fell from third to last","Tense: past simple, not present."],["In overall, numbers","Overall, numbers","<i>Overall<\/i> stands alone."],["was more than double, from about 1.1 million until 2.5 million","more than doubled, from about 1.1 million to 2.5 million","A verb, not a noun phrase, and <i>from … to<\/i>."]]},"notes":{"TA":"The overview covers the shared trend, the leader and the extremes of growth. Figures are selected to show contrasts and changes in ranking, with a final total.","CC":"Two leaders first (paragraph 2), then the contrast between the fast and slow growers (paragraph 3). <i>by contrast<\/i> and <i>Overall<\/i> link the final points.","LR":"<i>intake, leading destination, sixfold, taking it from last place to third, barely grew<\/i>.","GRA":"Participle clauses, a reduced comparison (<i>Australia's more than tripled<\/i>), appositive phrases (<i>twice the share of…<\/i>) and accurate tenses."},"task":1},{"id":"t1-12","label":"Table · costs","short":"Holiday costs","title":"The cost of a one-week holiday in four destinations","minutes":20,"prompt":"The table below shows the average cost, in US dollars, of a one-week holiday in four destinations, divided into four categories of spending. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"table","title":"Average cost of a one-week holiday ($)","head":["Destination","Flights","Accommodation","Food","Activities","Total"],"rows":[["Bali","$900","$350","$180","$120","$1,550"],["Lisbon","$250","$520","$310","$140","$1,220"],["Dubai","$620","$780","$390","$260","$2,050"],["Reykjavik","$480","$910","$520","$330","$2,240"]]},"vocab":[["the most expensive / the cheapest","Superlatives for the extremes in the Total column."],["driven by","The cause of a high total: <i>driven by accommodation and food<\/i>."],["makes up / accounts for","Describe a share of a total."],["just under 60%","Approximate fractions: <i>just under 60% of its cost<\/i>."],["ground costs","A phrase for everything except flights."],["at the lower end","The cheaper destinations: <i>at the lower end, Lisbon costs…<\/i>."],["is unusual","A signal for the exception: <i>Bali is unusual<\/i>."],["component","A part of a total: <i>the biggest component<\/i>."]],"plan":["<b>Introduction:<\/b> paraphrase <i>average cost … one-week holiday … four destinations … four categories<\/i>.","<b>Overview:<\/b> Reykjavik dearest, Lisbon cheapest; flights are the main cost in Bali, accommodation elsewhere.","<b>Body 1:<\/b> the two most expensive: Reykjavik and Dubai.","<b>Body 2:<\/b> the two cheaper: Lisbon and Bali, and Bali's unusual pattern."],"read":[["Reykjavik was the most expensive destination ($2,240) and Lisbon the cheapest ($1,220).","key","The two extremes of the Total column."],["Accommodation was the largest cost in three of the four destinations.","key","A pattern across rows."],["Flights were the biggest cost in Bali, at nearly 60% of the total.","key","The exception, which makes Bali stand out."],["Food in Lisbon cost $310.","detail","True, but a single figure."],["Activities in Dubai cost $260.","detail","True, but a single figure."],["Dubai was the most expensive destination.","false","Reykjavik ($2,240) is higher than Dubai ($2,050)."],["Flights to Lisbon were the most expensive of all.","false","They were the cheapest ($250)."]],"overview":[["Overall, Reykjavik is the most expensive destination and Lisbon the cheapest, and while flights are the largest cost in Bali, accommodation is the largest item everywhere else.",true,"Extremes plus the main pattern and its exception, with no figures."],["Bali costs $1,550 and Lisbon $1,220.",false,"Figures in an overview."],["People who want a cheap holiday should go to Lisbon.",false,"A recommendation."],["Food and activities are the smallest costs in every destination.",true,"A second valid pattern across the table."],["The table shows the cost of four holidays.",false,"Repeats the question."],["Bali flights are expensive.",false,"A weak, vague single detail."]],"group":{"names":["The most expensive two","The cheaper two"],"instr":"The model describes the two most expensive destinations together, then the two cheaper ones. <b>Which paragraph does each fact belong in?<\/b>","note":"Grouping by overall cost lets you show the pattern in each pair: accommodation dominates the dear destinations, while Bali and Lisbon have a different mix of costs.","items":[["Reykjavik: $2,240 in total",0],["Dubai: $2,050, second dearest",0],["Reykjavik: accommodation $910",0],["Lisbon: $1,220 in total",1],["Bali: flights $900, nearly 60% of its cost",1],["Bali: the lowest ground costs of all four",1]]},"cloze":{"para":2,"words":["lower end","unusual","make up","just under","whereas","lowest","with","by contrast","cheapest","but"],"extra":["highest","while","and"],"note":"<i>flights make up $900, just under 60% of its cost<\/i>: the figure is followed by an appositive phrase giving its proportion.","segs":["At the ",", Lisbon costs $1,220 and Bali $1,550. Bali is ",": flights "," $900, "," 60% of its cost, "," its ground costs are the "," of all four destinations, "," accommodation at $350, food at $180 and activities at $120. Lisbon, ",", has the "," flights ($250), "," its accommodation costs $520."]},"model":["The table compares the average cost of a one-week holiday in four destinations, broken down into flights, accommodation, food and activities. Overall, Reykjavik is the most expensive destination and Lisbon the cheapest, and while flights are the main cost in Bali, accommodation is the largest item everywhere else.","Reykjavik's total of $2,240 is the highest, driven by accommodation at $910 and food at $520, both the highest in the table. Dubai comes second at $2,050, with accommodation ($780) again the biggest component, although flights ($620) cost far more than in Lisbon ($250).","At the lower end, Lisbon costs $1,220 and Bali $1,550. Bali is unusual: flights make up $900, just under 60% of its cost, whereas its ground costs are the lowest of all four destinations, with accommodation at $350, food at $180 and activities at $120. Lisbon, by contrast, has the cheapest flights ($250), but its accommodation costs $520."],"band7":{"para":1,"text":"Reykjavik total of $2,240 is the most high, driven by accommodation of $910 and food of $520, which are the highest in the table both. Dubai come second with $2,050 and accommodation ($780) is again biggest component, although flights ($620) cost far more than in Lisbon ($250).","faults":[["Reykjavik total of $2,240 is the most high","Reykjavik's total of $2,240 is the highest","The possessive, and the correct superlative."],["accommodation of $910 and food of $520","accommodation at $910 and food at $520","A figure for an item takes <i>at<\/i>."],["which are the highest in the table both","both the highest in the table","<i>both<\/i> goes before the noun phrase it modifies."],["Dubai come second with $2,050","Dubai comes second at $2,050","Agreement and the correct preposition."],["is again biggest component","again the biggest component","An article, and an absolute construction."]]},"notes":{"TA":"The overview gives both extremes and the main pattern with its exception. Figures are chosen for contrast (highest, lowest, the unusual case) rather than listed.","CC":"The most expensive pair in paragraph 2, the cheaper pair in paragraph 3, each with a clear pattern. <i>although, whereas, by contrast<\/i> manage the comparisons.","LR":"<i>driven by, component, ground costs, at the lower end, is unusual, makes up<\/i>.","GRA":"Appositive phrases (<i>just under 60% of its cost<\/i>), participle (<i>driven by<\/i>), concession (<i>although<\/i>) and a range of comparative forms."},"task":1},{"id":"t1-13","label":"Mixed · line graph + table","short":"Gym membership","title":"Gym membership and reasons for joining","minutes":20,"prompt":"The graph below shows the number of members of a gym chain between 2014 and 2020, and the table shows the reasons members gave for joining. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visuals":[{"type":"line","title":"Members of the gym chain (thousands)","ytitle":"Members (thousands)","xtitle":"Year","ymin":0,"x":["2014","2015","2016","2017","2018","2019","2020"],"series":[{"name":"Members","values":[310,345,390,450,520,560,480]}]},{"type":"table","title":"Reasons for joining, by age group (% of members; more than one answer allowed)","head":["Reason","Under 30","30–49","50 and over"],"rows":[["Improve fitness","62","58","49"],["Lose weight","34","51","38"],["Reduce stress","27","44","36"],["Meet people","41","18","33"],["Train for a sport","45","15","6"]]}],"vocab":[["a peak of … in …","The highest point of a line: <i>a peak of 560 thousand in 2019<\/i>."],["the only decline","A single fall in an otherwise rising line."],["cited by","A way to report survey answers: <i>cited by 62% of under-30s<\/i>."],["the most likely to","A comparison of groups: <i>the most likely to join to lose weight<\/i>."],["turning to","A linker to the second visual: <i>Turning to motives…<\/i>."],["motives / reasons for joining","Variation for <i>reasons<\/i>."],["far more interested in","A strong comparison between groups."],["while … ; whereas …","Two groups in one sentence."]],"plan":["<b>Introduction:<\/b> paraphrase both visuals in one sentence: membership over time, reasons for joining.","<b>Overview:<\/b> membership rose strongly until 2019 and then fell; fitness is the main reason, but other reasons differ by age.","<b>Body 1:<\/b> the line graph: the rise, the peak, the fall.","<b>Body 2:<\/b> the table: fitness for all, then the age differences."],"read":[["Membership rose steadily to a peak of 560 thousand in 2019.","key","The main trend of the line."],["Membership fell in 2020, to 480 thousand.","key","The only exception to the rising trend."],["Improving fitness was the most common reason in all three age groups.","key","A consistent feature of the table."],["There were 345 thousand members in 2015.","detail","True, but one point on the line."],["18% of 30- to 49-year-olds joined to meet people.","detail","True, but a single cell."],["Members aged 50 and over were the most likely to train for a sport.","false","They are the least likely (6%)."],["Membership grew every year between 2014 and 2020.","false","It fell in 2020."]],"overview":[["Overall, membership grew strongly until 2019 before falling, and improving fitness was the most popular reason for joining in every age group, although other motives varied with age.",true,"Covers both visuals, with no figures."],["Membership was 310 thousand in 2014 and 560 thousand in 2019, and 62% of under-30s joined to improve fitness.",false,"Figures in an overview."],["The reasons are interesting, so gyms should offer more classes for the over-50s.",false,"A recommendation, not a report."],["Weight loss and stress were most important to middle-aged members, while younger members valued sport and social contact.",true,"A valid overview of the age differences in the table."],["The graph and table show information about gym members.",false,"Repeats the question."],["Few older members train for a sport.",false,"A single detail."]],"group":{"names":["Line graph (membership)","Table (reasons for joining)"],"instr":"Each fact comes from one of the two visuals. <b>Which one does each fact belong to?<\/b> (In your report, each visual gets its own paragraph.)","note":"In a mixed task, use one body paragraph per visual. Then link the two in the overview so the reader sees one story.","items":[["A peak of 560 thousand in 2019",0],["A fall of 80 thousand in 2020",0],["A rise of over 80% since 2014",0],["62% of under-30s joined to improve fitness",1],["51% of 30- to 49-year-olds joined to lose weight",1],["Only 6% of members aged 50 and over joined to train for a sport",1]]},"cloze":{"para":2,"words":["Turning","leading","cited","most likely","whereas","far more","against only","meeting"],"extra":["peak","less","most"],"note":"<i>cited by … of<\/i> reports survey results. <i>Turning to<\/i> moves smoothly from one visual to the next.","segs":[""," to motives, improving fitness was the "," reason for all three age groups, "," by 62% of under-30s, 58% of those aged 30 to 49 and 49% of those aged 50 and over. Middle-aged members were the "," to join to lose weight (51%) or reduce stress (44%), "," younger members were "," interested in training for a sport (45%, "," 6% of the oldest group) and "," people (41%)."]},"model":["The line graph shows how membership of a gym chain changed between 2014 and 2020, while the table gives the reasons why members of three age groups joined. Overall, membership grew strongly until 2019 before dropping, and improving fitness was the most popular reason in every age group, though other motives varied with age.","Membership rose steadily from 310 thousand in 2014 to a peak of 560 thousand in 2019, an increase of over 80%. The only decline came in 2020, when numbers fell by 80 thousand to 480 thousand.","Turning to motives, improving fitness was the leading reason for all three age groups, cited by 62% of under-30s, 58% of those aged 30 to 49 and 49% of those aged 50 and over. Middle-aged members were the most likely to join to lose weight (51%) or reduce stress (44%), whereas younger members were far more interested in training for a sport (45%, against only 6% of the oldest group) and meeting people (41%)."],"band7":{"para":2,"text":"Turning to motives, improve fitness was the leading reason for all three age groups, cited by 62% of under-30s, 58% from those aged 30 to 49 and 49% of those aged 50 and over. Middle-aged members was the most likely to join for lose weight (51%) or reduce stress (44%), but young members were far more interested in train for a sport (45%, against only 6% for the oldest group) and meeting people (41%).","faults":[["improve fitness was the leading reason","improving fitness was the leading reason","A gerund as the subject."],["58% from those aged","58% of those aged","<i>of<\/i> for proportions."],["members was the most likely","members were the most likely","Agreement."],["to join for lose weight","to join to lose weight","Purpose: <i>to<\/i> + verb."],["but young members were","whereas younger members were","A more precise linker and a neutral comparative."],["interested in train for a sport","interested in training for a sport","<i>in<\/i> + <i>-ing<\/i>."],["only 6% for the oldest group","only 6% of the oldest group","<i>of<\/i> for proportions."]]},"notes":{"TA":"Both visuals are described and linked in a single overview. Figures are chosen to show the peak, the one decline and the age differences, not every cell.","CC":"One paragraph per visual, joined by <i>Turning to…<\/i>. The overview anticipates the logic of both body paragraphs.","LR":"<i>peak, decline, motives, cited by, far more interested in<\/i>.","GRA":"<i>whereas<\/i>, a participle (<i>cited by<\/i>), a superlative with an infinitive (<i>the most likely to join to…<\/i>) and parallel structure in the lists."},"task":1},{"id":"t1-14","label":"Mixed · pie chart + bar chart","short":"Household waste","title":"Household waste and how much is recycled","minutes":20,"prompt":"The pie chart shows the composition of household waste in one city, and the bar chart shows the percentage of each type of waste that is recycled. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visuals":[{"type":"pie","title":"What household waste is made of (%)","unit":"%","charts":[{"title":"Household waste by material","slices":[["Food",38],["Paper",22],["Plastic",15],["Glass",8],["Metal",5],["Other",12]]}]},{"type":"bar","title":"Percentage of each type of waste that is recycled","ytitle":"% recycled","x":["Paper","Glass","Metal","Plastic","Food waste"],"series":[{"name":"Recycled (%)","values":[74,62,55,28,12]}]}],"vocab":[["consists of / is made up of","Describe a composition: <i>household waste consists of…<\/i>."],["far more than any other material","A share much larger than the rest."],["yet only","A surprising contrast: <i>38% of the total, yet only 12% is recycled<\/i>."],["composted","Food waste turned into compost, not recycled."],["respectable","Fairly good: <i>respectable recycling rates<\/i>."],["the majority of","More than half: <i>the majority of plastic is not recycled<\/i>."],["respectively","Match two figures to two items in order."],["is classed as","Put into a category: <i>is classed as ‘other’<\/i>."]],"plan":["<b>Introduction:<\/b> paraphrase both visuals in one sentence.","<b>Overview:<\/b> the materials recycled best are not the most plentiful; food is largest but least recycled; paper is second largest and best recycled.","<b>Body 1:<\/b> food, paper and plastic: the share of waste, then the recycling rate.","<b>Body 2:<\/b> glass and metal, then ‘other’."],"read":[["Food was by far the largest component of waste (38%), but only 12% of it was recycled.","key","Links both visuals and gives the central contrast."],["Paper was the second largest component (22%) and had the highest recycling rate (74%).","key","The opposite pattern: large share and high recycling."],["Only plastic and food waste had recycling rates below 30%.","key","Identifies the two worst performers."],["Metal made up 5% of waste.","detail","True, but a single figure."],["The ‘other’ category was 12%.","detail","True, but a single figure."],["Glass had a higher recycling rate than paper.","false","Paper (74%) is above glass (62%)."],["Plastic was the largest category.","false","Food (38%) is largest."]],"overview":[["Overall, the materials that are recycled best are not those that are most plentiful: food makes up the largest share of waste but is recycled least, whereas paper is the second most common material and has the highest recycling rate.",true,"Links the pie and the bar chart, with no figures."],["Food is 38% of waste and 12% of it is recycled; paper is 22% and 74% of it is recycled.",false,"Figures in an overview."],["People throw away too much food, so the city should build more recycling plants.",false,"A recommendation."],["Plastic is a large part of the waste stream, but most plastic is not recycled.",true,"A valid second overview about a material that stands out."],["The pie chart and bar chart show waste and recycling.",false,"Repeats the question."],["Metal is a small category.",false,"A single detail."]],"group":{"names":["Food and plastic: large share, low recycling","Paper, glass and metal: higher recycling rates"],"instr":"Which group does each fact belong to? <b>Sort each fact into the group it supports.<\/b>","note":"Food and plastic form the headline contrast (plenty of waste, little recycling). Paper, glass and metal are recycled well, so they go in the second group.","items":[["Food: 38% of waste",0],["Only 12% of food waste recycled",0],["Plastic: only 28% recycled",0],["74% of paper recycled",1],["62% of glass recycled",1],["55% of metal recycled",1]]},"cloze":{"para":1,"words":["accounts for","far more","yet","composted","next","makes up","just","majority"],"extra":["less","although","half"],"note":"<i>yet<\/i> signals a contrast between the two visuals: a big share of waste, a small share recycled.","segs":["Food waste "," 38% of the total, "," than any other material, "," only 12% of it is recycled or ",". Paper is "," at 22%, and 74% of it is recycled. Plastic "," 15% of the total, but "," 28% of it is recycled, so the "," of plastic is never recycled."]},"model":["The pie chart shows what a city's household waste consists of, and the bar chart shows what percentage of each material is recycled. Overall, the materials that are recycled best are not those that are most plentiful: food makes up the largest share of waste but is recycled least, whereas paper is the second most common material and has the highest recycling rate.","Food waste accounts for 38% of the total, far more than any other material, yet only 12% of it is recycled or composted. Paper is next at 22%, and 74% of it is recycled. Plastic makes up 15% of the total, but just 28% of it is recycled, so the majority of plastic is never recycled.","Glass and metal are much smaller categories, at 8% and 5% of waste respectively, but their recycling rates are respectable, at 62% and 55%. The remaining 12% of waste is classed as ‘other’."],"band7":{"para":1,"text":"Food waste is 38% of total, much more than the other materials, but only 12% of it is recycled or compost. Paper is next with 22% and the 74% of it is recycled. Plastic is 15% of the total, but just 28% of it are recycled, so most plastic is never recycled.","faults":[["Food waste is 38% of total","Food waste accounts for 38% of the total","A precise verb, and the article before <i>total<\/i>."],["much more than the other materials","far more than any other material","A fixed comparison pattern."],["recycled or compost","recycled or composted","A parallel past participle."],["with 22% and the 74% of it","at 22%, and 74% of it","The correct preposition, and no article with a percentage."],["Plastic is 15% of the total","Plastic makes up 15% of the total","<i>makes up<\/i> for a share."],["just 28% of it are recycled","just 28% of it is recycled","Agreement: <i>of it<\/i> is singular."]]},"notes":{"TA":"The overview links the two visuals in one clear statement. The body uses the contrast between a material's share of the waste and its recycling rate, which is the real insight in the data.","CC":"Paragraph 2 covers the three biggest materials, in order of share; paragraph 3 the smaller ones. <i>yet, but, next, respectively<\/i> keep the thread.","LR":"<i>consists of, accounts for, composted, respectable, the majority, is classed as<\/i>.","GRA":"Passive (<i>is recycled, is classed as<\/i>), contrast with <i>yet<\/i> and <i>whereas<\/i>, and a result clause (<i>so the majority…<\/i>)."},"task":1},{"id":"t1-15","label":"Map · village growth","short":"A village in 1995 and 2020","title":"The village of Hallbrook, 1995 and 2020","minutes":20,"prompt":"The maps below show the village of Hallbrook in 1995 and in 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"map","before":{"title":"Hallbrook, 1995","items":[["field",4,4,46,30,"Farmland"],["field",52,4,28,30,"Farmland"],["water",82,0,10,52,"River"],["house",20,38,12,9,"Houses"],["house",34,38,12,9,"Houses"],["bld",8,38,10,9,"School"],["bld",48,38,8,9,"Church"],["shop",58,38,10,9,"Shop"],["road",0,52,100,6,"Main Road"]]},"after":{"title":"Hallbrook, 2020","items":[["house",5,11,42,20,"New housing estate"],["field",52,11,28,20,"Farmland"],["water",82,0,10,52,"River"],["road",0,4,100,4,"Bypass"],["house",20,38,12,9,"Houses"],["house",34,38,12,9,"Houses"],["bld",2,38,16,9,"School|(extended)"],["bld",48,38,8,9,"Church"],["shop",58,38,18,9,"Supermarket"],["sand",58,47,18,4,"Car park"],["road",0,52,100,6,"Main Road"]]}},"vocab":[["was replaced by","Something removed and something new put in its place: <i>farmland was replaced by a housing estate<\/i>."],["had been converted into","A change of use: <i>the shop had been converted into a supermarket<\/i>."],["remained unchanged / was left intact","Not altered: <i>the houses and the church were left unchanged<\/i>."],["along the northern edge","A position along a boundary."],["was extended to the west","Made bigger, with a direction: <i>the school had been extended to the west<\/i>."],["a bypass","A road built around a village to take traffic away from the centre."],["a housing estate","A large group of houses built together."],["By 2020 … had been + past participle","Past perfect passive for changes completed before a later date."]],"plan":["<b>Introduction:<\/b> paraphrase <i>the maps show the village … in 1995 and in 2020<\/i>.","<b>Overview:<\/b> the village expanded; farmland and the shop were replaced; the river, church and old houses unchanged.","<b>Body 1:<\/b> 1995 layout: the road, the central buildings, farmland in the north.","<b>Body 2:<\/b> 2020: the bypass and housing estate in the north, then the changes in the centre."],"read":[["A new housing estate replaced the western half of the farmland." o the west",1],["The shop became a larger supermarket with a car park",1],["The houses and the church were left unchanged",1]]},"cloze":{"para":2,"words":["By 2020","had been built","crossing","replaced","while","remained","had been extended","converted","added","left"],"extra":["demolished","opened","moved"],"note":"Maps use the <b>past perfect passive<\/b> (<i>had been built<\/i>) for changes completed before a later year, and <i>remained / were left<\/i> for what did not change.","segs":["",", a bypass "," along the northern edge, "," the river by a new bridge. The western half of the farmland had been "," by a new housing estate, "," the eastern half "," as farmland. In the village centre the school "," to the west, the shop had been "," into a larger supermarket and a car park had been "," in front of it. The houses and the church were "," unchanged."]},"model":["The maps show how the village of Hallbrook changed between 1995 and 2020. Overall, the village expanded considerably: farmland in the north-west was replaced by a large housing estate, and a new road and larger shopping facilities were added, although the centre and the river remained unchanged.","In 1995 the village consisted of a main road running east to west along the southern edge, with a school, two blocks of houses, a church and a small shop beside it. Farmland covered the whole of the northern part of the map, stretching from the western edge to the river in the east.","By 2020, a bypass had been built along the northern edge, crossing the river by a new bridge. The western half of the farmland had been replaced by a new housing estate, while the eastern half remained as farmland. In the village centre the school had been extended to the west, the shop had been converted into a larger supermarket and a car park had been added in front of it. The houses and the church were left unchanged."],"band7":{"para":2,"text":"In 2020, a bypass is built along the northern edge, and cross the river with a new bridge. The west half of farmland was replace by a new housing estate, but the east half was still farmland. In the village centre, they extended the school to west, the shop was changed to a bigger supermarket, and they add a car park in front of it. The houses and the church was not changed.","faults":[["In 2020, a bypass is built","By 2020, a bypass had been built","Changes completed before a date: past perfect passive."],["and cross the river with a new bridge","crossing the river by a new bridge","A participle clause, and <i>by<\/i> a bridge."],["The west half of farmland was replace by","The western half of the farmland had been replaced by","Adjective form, article, tense and past participle."],["but the east half was still farmland","while the eastern half remained as farmland","A more precise linker and verb."],["they extended the school to west","the school had been extended to the west","Maps use the passive, not <i>they<\/i>; and <i>the<\/i> before <i>west<\/i>."],["the shop was changed to a bigger supermarket","the shop had been converted into a larger supermarket","<i>converted into<\/i> is the standard collocation."],["they add a car park","a car park had been added","Passive and tense."],["The houses and the church was not changed","The houses and the church were left unchanged","Agreement and a precise phrase."]]},"notes":{"TA":"The overview gives the main change (expansion) and what did not change. The body paragraphs describe every change and every unchanged feature that matters, in a consistent order (north first, then centre).","CC":"Paragraph 2 describes 1995, paragraph 3 describes the changes by 2020, always in the same geographic order, so the reader can compare.","LR":"<i>was replaced by, had been converted into, stretching from … to, left unchanged, a bypass, housing estate<\/i>.","GRA":"Past perfect passive throughout the change paragraph, participle clauses (<i>crossing, stretching<\/i>) and a <i>while<\/i> contrast."},"task":1},{"id": ted into a shopping mall",1],["A multi-storey car park was built to the south",1],["The market hall site became an open square",1]]},"cloze":{"para":2,"words":["Today","has been pedestrianised","converted into","replaced by","built","replace","demolished","turned into","while","remain"],"extra":["moved","opened","expanded"],"note":"Because the second map is “today”, the changes use the <b>present perfect passive<\/b> (<i>has been pedestrianised<\/i>), not the past perfect.","segs":[""," the High Street ",", and the cinema has been "," a shopping mall. The old car park has been "," a town park, and a multi-storey car park has been "," to the south of the shops to "," it. The market hall has been "," and its site "," an open market square, "," the library, the shops and the bus station "," as before."]},"model":["The two maps illustrate how central Ashford has changed between 2000 and the present day. Overall, the area has become more pedestrian-friendly and greener: traffic has been removed from the High Street, the car park has become a park, and the cinema has been replaced by a shopping mall, although the library, shops and bus station are unchanged.","In 2000, the High Street ran east to west through the middle of the map, with a cinema on its northern side beside a large car park and the library. To the south stood a row of shops, a market hall and the bus station.","Today the High Street has been pedestrianised, and the cinema has been converted into a shopping mall. The old car park has been replaced by a town park, and a multi-storey car park has been built to the south of the shops to replace it. The market hall has been demolished and its site turned into an open market square, while the library, the shops and the bus station remain as before."],"band7":{"para":2,"text":"Today, High Street is pedestrianised, and the cinema was converted to a shopping mall. The old car park was replace with a town park, and a multi-storey car park was built in the south of the shops for replace it. The market hall demolished and its site become an open market square, but the library, shops and bus station are same like before.","faults":[["Today, High Street is pedestrianised","Today the High Street has been pedestrianised","An article, and the present perfect passive for a change that applies now."],["the cinema was converted to a shopping mall","the cinema has been converted into a shopping mall","Tense and the standard collocation <i>converted into<\/i>."],["was replace with a town park","has been replaced by a town park","Past participle and <i>replaced by<\/i>."],["in the south of the shops for replace it","to the south of the shops to replace it","<i>to the south of<\/i> for position outside an area, and <i>to<\/i> + verb for purpose."],["The market hall demolished and its site become","The market hall has been demolished and its site turned into","Missing auxiliary verbs, and <i>turned into<\/i>."],["are same like before","remain as before","A fixed phrase."]]},"notes":{"TA":"The overview states the general effect (pedestrian-friendly, greener) and what did not change. All changes are reported, each with its location.","CC":"One paragraph for each date, with the same order (north, centre, south). <i>Today, while, to the south of<\/i> keep the reader oriented.","LR":"<i>pedestrianised, converted into, replaced by, demolished, its site turned into, remain as before<\/i>.","GRA":"Present perfect passive for changes at the present, a participle (<i>turned into<\/i>) and a purpose clause (<i>to replace it<\/i>)."},"task":1},{"id":"t1-17","label":"Map · island development","short":"An island becomes a resort","title":"Development of a small island","minutes":20,"prompt":"The maps below show a small island before and after it was developed as a tourist resort. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"map","before":{"title":"The island before development","items":[["water",0,0,100,64,""],["field",16,8,66,48,""],["sand",16,8,66,5,"Beach"],["sand",16,51,66,5,"Beach"],["park",22,16,36,30,"Forest"],["house",60,26,16,10,"Fishing|village"],["road",76,29,20,4,"Jetty"]]},"after":{"title":"The island after development","items":[["water",0,0,100,64,""],["field",16,8,66,48,""],["sand",16,8,66,5,"Beach"],["sand",16,51,66,5,"Beach"],["park",58,14,22,9,"Forest"],["bld",22,16,24,14,"Hotel"],["water",24,32,14,8,"Pool"],["house",22,42,34,7,"Chalets"],["shop",60,38,16,9,"Restaurant|and shops"],["house",60,26,16,10,"Fishing|village"],["road",76,29,22,4,"Longer jetty"],["bld",82,34,14,7,"Boat|hire"]]}},"vocab":[["was cleared to make way for","Removed so that something else can be built: <i>the forest was cleared to make way for a hotel<\/i>."],["has been developed into","A change of the whole area: <i>developed into a tourist resort<\/i>."],["facilities","Services for visitors: <i>a hotel, a pool, restaurants<\/i>."],["was extended","Made longer or larger: <i>the jetty has been extended<\/i>."],["next to / alongside / beside","Position of one feature relative to another."],["is largely unchanged","Mostly not changed."],["in the north-east","A compass position for the remaining forest."],["a row of chalets","A line of small holiday houses."]],"plan":["<b>Introduction:<\/b> paraphrase <i>a small island before and after it was developed as a tourist resort<\/i>.","<b>Overview:<\/b> from a quiet island with a fishing village to a resort; forest cleared; beaches and village kept.","<b>Body 1:<\/b> before: forest, beaches, the village and jetty.","<b>Body 2:<\/b> after: the hotel, pool and chalets in the cleared forest; the new shops and the longer jetty."],"read":[["Most of the forest was cleared and replaced by a hotel, a swimming pool and chalets.","key","The biggest change in the island's land use."],["A restaurant and shops were built next to the fishing village.","key","New facilities that serve visitors."],["The jetty was made longer and a boat hire building was added.","key","The change to access by sea."],["The beaches stayed on the north and south coasts.","detail","A feature that did not change."],["The fishing village is in the same place.","detail","Also unchanged."],["The beaches were replaced by the hotel.","false","The hotel was built in the cleared forest, not on the beaches."],["All of the forest was cleared.","false","A small area remains in the north-east."]],"overview":[["Overall, the island has changed from a quiet place with a small fishing village to a tourist resort, with most of the forest cleared for new buildings while the beaches and the village were kept.",true,"Before, after, and what remains."],["The island was developed in the centre and the east, while the beaches were unaffected.",true,"A valid overview by area."],["A hotel, a pool, chalets, shops, a restaurant and a boat hire were built.",false,"A list of all the changes: not an overview."],["The island is more attractive now, which will bring money.",false,"An opinion and prediction."],["The maps show an island in two states.",false,"Repeats the question."],["The jetty was extended.",false,"A single detail."]],"group":{"names":["Before development","After development"],"instr":"The model has one paragraph for each map. <b>Which paragraph does each fact belong in?<\/b>","note":"The island is described before development first, and the changes are listed in the same order (forest, village, jetty) afterwards.","items":[["Forest covered the centre and west",0],["A short jetty served the fishing village",0],["A beach ran along the north and south coasts",0],["A hotel and pool replaced the forest",1],["Restaurants and shops stood next to the village",1],["The jetty was extended and a boat hire added",1]]},"cloze":{"para":2,"words":["After development","has been cleared","replaced by","to the south of","along","built","extended","create","remains","unchanged"],"extra":["removed","opened","north"],"note":"The model uses a mix of present perfect passive (<i>has been cleared, has been built<\/i>) and simple present (<i>remains, are unchanged<\/i>) because the second map shows the island as it is now.","segs":["",", the forest in the west "," and "," a large hotel, with a swimming pool "," it and a row of chalets "," the southern side. A restaurant and shops have been "," next to the village, and the jetty has been "," to "," a harbour for visitors' boats. A small area of forest "," in the north-east, and the beaches are ","."]},"model":["The two maps illustrate a small island before and after its transformation into a tourist resort. Overall, the island changed from a quiet place with only a fishing village into a resort, with most of the forest cleared to make way for a hotel and other tourist facilities, while the beaches and the village were kept.","Before development, the island was largely covered by forest in the centre and west, with beaches along the north and south coasts. A small fishing village stood in the east, next to a short jetty.","After development, the forest in the west has been cleared and replaced by a large hotel, with a swimming pool to the south of it and a row of chalets along the southern side. A restaurant and shops have been built next to the village, and the jetty has been extended to create a harbour for visitors' boats. A small area of forest remains in the north-east, and the beaches are unchanged."],"band7":{"para":2,"text":"After the development, forest in west is cleared and replaced with a large hotel, with a swimming pool at the south from it and a row of chalets along the south side. A restaurant and shops was built next the village, and they made the jetty more long for create a harbour for boats of visitors. A small area of forest is remained in the north-east, and the beaches are not changed.","faults":[["After the development, forest in west is cleared","After development, the forest in the west has been cleared","Articles and the present perfect passive."],["replaced with a large hotel","replaced by a large hotel","<i>replaced by<\/i> for the new thing."],["at the south from it","to the south of it","A standard position phrase."],["A restaurant and shops was built next the village","A restaurant and shops have been built next to the village","Agreement, the passive form and the preposition."],["they made the jetty more long for create a harbour for boats of visitors","the jetty has been extended to create a harbour for visitors' boats","A passive, <i>extended<\/i>, <i>to<\/i> + verb for purpose, and a possessive."],["is remained in the north-east","remains in the north-east","<i>Remain<\/i> is never passive."]]},"notes":{"TA":"The overview states the transformation and what was kept. Every new feature is described with its location relative to existing features.","CC":"One paragraph for the island before, one for after, in the same geographic order. <i>to the south of, next to, along<\/i> keep the reader oriented.","LR":"<i>cleared to make way for, facilities, row of chalets, extended, remains<\/i>.","GRA":"Present perfect passive for changes seen today, a participle phrase (<i>with a swimming pool…<\/i>), purpose (<i>to create<\/i>) and active <i>remains<\/i>."},"task":1},{"id":"t1-18","label":"Process · manufacturing flow","short":"How waste paper is recycled","title":"How waste paper is recycled","minutes":20,"prompt":"The diagram below shows the process by which waste paper is recycled into new paper. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"process","kind":"flow","title":"Recycling waste paper","steps":["Waste paper is collected from homes and offices","Paper is sorted by type and quality","Paper is shredded and mixed with water to make pulp","Screens remove staples and plastic from the pulp","Ink is washed out of the pulp","The pulp is bleached to make it whiter","The pulp is pressed and rolled into wet sheets","Sheets are dried, cut and packed for sale"]},"vocab":[["consists of eight stages","How to count the stages in the overview: <i>the process consists of eight stages<\/i>."],["First(ly), … Next, … After that, … Finally, …","The four main sequencers: do not use <i>first<\/i> twice."],["is then shredded","<i>then<\/i> sits between the auxiliary and the participle: <i>is then shredded<\/i>."],["to form / to make a pulp","Purpose or result: <i>mixed with water to form a pulp<\/i>."],["remove contaminants such as …","<i>contaminants<\/i> is a precise word for staples and plastic."],["Once the pulp has been screened, …","<i>Once<\/i> + present perfect passive to link two stages."],["in order to / so that","Purpose: <i>bleached to make it whiter<\/i>."],["for sale","The end purpose of the last stage."]],"plan":["<b>Introduction:<\/b> paraphrase <i>the process by which waste paper is recycled into new paper<\/i>.","<b>Overview:<\/b> eight stages, from collection to packing; cleaning happens in the middle; the product is sold.","<b>Body 1:<\/b> collecting, sorting, shredding and screening: the preparation stages.","<b>Body 2:<\/b> deinking, bleaching, pressing, drying and packing: the finishing stages."],"read":[["The process has eight stages, from collection to packing.","key","A count of the stages, with the start and the end: central to a process overview."],["The first four stages prepare the paper: collection, sorting, shredding and screening.","key","A natural way to group stages, which gives the first body paragraph."],["Ink removal and bleaching make the pulp cleaner and whiter before it is made into sheets.","key","The purpose of the middle of the process."],["Staples and plastic are removed by screens.","detail","True, but one step. Use it in the body."],["The pulp is rolled into wet sheets.","detail","True, but one step."],["The paper is dried before it is sorted.","false","Sorting is the second stage; drying is the last."],["The paper is bleached before the ink is removed.","false","Ink is washed out first."]],"overview":[["Overall, the process consists of eight stages, starting with the collection of waste paper and ending with the packing of the finished sheets, with cleaning and purifying in the middle.",true,"The number of stages, start, end and the main idea."],["First paper is collected, then sorted, then shredded, then screened, then deinked, then bleached.",false,"A step-by-step list is not an overview."],["Recycling paper is good for the environment and everyone should do it.",false,"An opinion."],["The paper is cleaned and purified before being pressed and dried into new sheets.",true,"A valid overview focusing on the logic of the process."],["The diagram shows how paper is recycled.",false,"Repeats the question."],["Staples are removed.",false,"A single step."]],"group":{"names":["Preparation (stages 1 to 4)","Cleaning and finishing (stages 5 to 8)"],"instr":"The model has one paragraph for the preparation stages and one for cleaning and finishing. <b>Which paragraph does each stage belong in?<\/b>","note":"For a long process, split the stages into two or three natural groups. Linking words (<i>First, Next, Once, After that, Finally<\/i>) then move the reader through each group.","items":[["Waste paper is collected",0],["Paper is sorted by type and quality",0],["Screens remove staples and plastic",0],["Ink is washed out",1],["Pulp is bleached",1],["Sheets are dried, cut and packed",1]]},"cloze":{"para":2,"words":["Once","has been screened","removed","bleached","whiter","After that","pressed","Finally","dried","packed"],"extra":["Before","heated","sold"],"note":"<i>Once … has been …<\/i> links two stages. Notice the passive throughout, because the focus is the paper, not the people or machines doing the work.","segs":[""," the pulp ",", the ink is "," by washing, and the pulp is "," to make it ",". ",", it is "," and rolled into wet sheets. ",", the sheets are ",", cut to size and "," for sale. In this way, the whole process turns used paper into a product that is ready to be sold again."]},"model":["The diagram illustrates how waste paper is turned into new paper. Overall, the process consists of eight stages, starting with the collection of used paper and ending with the packing of the finished sheets, and the paper is cleaned and purified in the middle of the process before being pressed and dried. Each stage follows directly from the one before, with no stage repeated.","First, waste paper is collected from homes and offices and sorted by type and quality. It is then shredded and mixed with water to form a pulp. Next, the pulp passes through screens, which remove contaminants such as staples and plastic. Together, these first four stages prepare the pulp for cleaning.","Once the pulp has been screened, the ink is removed by washing, and the pulp is bleached to make it whiter. After that, it is pressed and rolled into wet sheets. Finally, the sheets are dried, cut to size and packed for sale. In this way, the whole process turns used paper into a product that is ready to be sold again."],"band7":{"para":2,"text":"When the pulp is screened, they remove the ink by washing, and the pulp is bleach for make it more white. After that, they press it and roll in wet sheets. At the end, the sheets are dry, cut to size and packed for the sale.","faults":[["When the pulp is screened, they remove the ink by washing","Once the pulp has been screened, the ink is removed by washing","<i>Once … has been<\/i> links stages precisely; and a process is passive, not <i>they<\/i>."],["the pulp is bleach for make it more white","the pulp is bleached to make it whiter","Past participle, <i>to<\/i> + verb for purpose, and a short comparative."],["they press it and roll in wet sheets","it is pressed and rolled into wet sheets","Passive, and <i>rolled into<\/i>."],["At the end, the sheets are dry","Finally, the sheets are dried","A sequencer, and the verb form (the sheets are dried, not <i>dry<\/i>)."],["packed for the sale","packed for sale","No article in this fixed phrase."]]},"notes":{"TA":"The overview states the count of stages, the start, the end and the purpose of the middle. Every stage is included and in the right order.","CC":"A clear sequence with a variety of sequencers (<i>First, then, Next, Once, After that, Finally<\/i>), and stages grouped into two paragraphs.","LR":"<i>contaminants, pulp, deinking by washing, bleached, packed for sale<\/i>.","GRA":"Passive throughout, <i>Once + present perfect passive<\/i>, relative clause (<i>which remove…<\/i>) and a purpose infinitive (<i>to make it whiter<\/i>)."},"task":1},{"id":"t1-19","label":"Process · life cycle","short":"The life cycle of the salmon","title":"The life cycle of the salmon","minutes":20,"prompt":"The diagram below shows the life cycle of the salmon. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"process","kind":"cycle","title":"The life cycle of the salmon","steps":["Eggs are laid in river gravel","Eggs hatch into alevins (feed from a yolk sac)","Alevins grow into fry (feed in the river)","Young fish (smolts) swim downstream to the sea","Adult salmon grow in the ocean","Adults swim back upstream to spawn"]},"vocab":[["a life cycle / a cycle","A process that repeats: <i>the cycle is circular<\/i>."],["begins when / completes the cycle","Frame the start and the return."],["hatch into / develop into / grow into","Verbs for change of stage in nature."],["which feed from / which feed in","Relative clauses give extra information about a stage."],["fresh water / the open ocean","Where the stages happen."],["swim downstream / swim back upstream","Direction in a river."],["the next generation","What the adults produce: the same cycle again."],["in both fresh water and the sea","A summary of where the whole cycle takes place."]],"plan":["<b>Introduction:<\/b> paraphrase <i>the life cycle of the salmon<\/i>.","<b>Overview:<\/b> six stages, in a circle, in both fresh water and sea; adults return to where they began.","<b>Body 1:<\/b> the first three stages: egg, alevin, fry (all in the river).","<b>Body 2:<\/b> the last three: smolts to the sea, adult growth, return upstream to spawn."],"read":[["The life cycle has six stages and is circular: adults return upstream and the cycle begins again.","key","The number of stages and the key feature of a cycle."],["The first three stages take place in the river.","key","A natural first group."],["The salmon moves from fresh water to the ocean and back again.","key","The movement that organises the whole cycle."],["The alevins feed from a yolk sac.","detail","True, but a detail of one stage."],["The fry feed in the river.","detail","True, but a detail of one stage."],["The adult salmon spend their lives in the river.","false","They grow in the ocean."],["The eggs are laid in the sea.","false","They are laid in river gravel."]],"overview":[["Overall, the life cycle of the salmon has six stages and is circular, taking place in both fresh water and the sea, as adults return to the river where the next generation begins.",true,"Stages, setting and the circular logic."],["The salmon lays eggs, the eggs hatch, the alevins grow, the smolts swim, the adults grow and then they return.",false,"A step-by-step list, not an overview."],["Salmon are an interesting fish and people should protect them.",false,"An opinion."],["Only one stage, the growth of adult fish, takes place in the open ocean.",true,"A valid specific feature of the diagram."],["The diagram shows a life cycle.",false,"Repeats the question."],["Smolts swim to the sea.",false,"A single stage."]],"group":{"names":["Stages in the river (1 to 3)","Migration and return (4 to 6)"],"instr":"The model has one paragraph for the river stages and one for the journey to the sea and back. <b>Which paragraph does each stage belong in?<\/b>","note":"A cycle is easiest to describe as two phases: where it begins, and where it travels and returns. The final sentence of the report should link back to the start.","items":[["Eggs are laid in river gravel",0],["Alevins feed from a yolk sac",0],["Fry feed in the river",0],["Smolts swim downstream to the sea",1],["Adult salmon grow in the ocean",1],["Adults swim upstream to spawn",1]]},"cloze":{"para":2,"words":["Next","now called","swim","to the sea","where","growing","Finally","travel","which completes"],"extra":["Before","live","starts"],"note":"<i>where they spend their adult lives growing<\/i> and <i>which completes the cycle<\/i> are relative clauses that add detail without breaking the sequence.","segs":["",", the young fish, "," smolts, "," downstream ",", "," they spend their adult lives "," in the ocean. ",", the adults "," back upstream to spawn in the river, "," the cycle and starts it again for the next generation."]},"model":["The diagram shows the life cycle of the salmon, which has six stages and takes place in both fresh water and the sea. Overall, the cycle is circular, as adult fish return to the river where the next generation begins, and only one stage, the growth of the adults, is spent entirely in the open ocean.","The cycle begins when eggs are laid in river gravel. The eggs hatch into alevins, which feed from a yolk sac, and these then grow into fry, which feed in the river. The first three stages therefore take place entirely in fresh water, and the young fish remain in the river throughout this part of the cycle.","Next, the young fish, now called smolts, swim downstream to the sea, where they spend their adult lives growing in the ocean. Finally, the adults travel back upstream to spawn in the river, which completes the cycle and starts it again for the next generation."],"band7":{"para":1,"text":"The cycle start when eggs are laid in river gravel. The eggs hatching into alevins, they feed from a yolk sac, and after the alevins growing into fry what feed in the river. So the first three s
