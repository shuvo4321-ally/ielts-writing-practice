tages are happen in fresh water only.","faults":[["The cycle start when","The cycle begins when","Agreement, and a more formal verb."],["The eggs hatching into alevins, they feed from a yolk sac","The eggs hatch into alevins, which feed from a yolk sac","A finite verb, and a relative clause instead of a comma splice."],["after the alevins growing into fry what feed in the river","these then grow into fry, which feed in the river","<i>what<\/i> cannot introduce a relative clause; and a finite verb is needed."],["So the first three stages are happen in fresh water only","The first three stages therefore take place entirely in fresh water","<i>take place<\/i> is not passive, and <i>therefore<\/i> is more formal than <i>So<\/i>."]]},"notes":{"TA":"The overview names the number of stages, the circular nature and the setting. Each stage is covered and the report returns to the start at the end.","CC":"Two paragraphs for two phases of the cycle. The last sentence (<i>completes the cycle and starts it again<\/i>) closes the circle.","LR":"<i>spawn, alevins, smolts, downstream and upstream, completes the cycle<\/i>.","GRA":"Non-defining relative clauses (<i>which feed from a yolk sac<\/i>), a participle phrase (<i>now called smolts<\/i>), and active present tense for a natural process."},"task":1},{"id":"t1-20","label":"Process · how a plant works","short":"A hydroelectric power station","title":"How a hydroelectric power station works","minutes":20,"prompt":"The diagram below shows how electricity is produced in a hydroelectric power station. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","visual":{"type":"process","kind":"flow","title":"Producing electricity from water","steps":["Water is collected in a reservoir behind a dam","Water is released through an intake gate","Water rushes down a large pipe (the penstock)","The force of the water spins a turbine","The turbine drives a generator, which produces electricity","A transformer raises the voltage of the electricity","Power lines carry the electricity to homes and factories","Used water flows back into the river"]},"vocab":[["hydroelectric / hydropower","Electricity from the movement of water."],["is converted into","A change of energy form: <i>converted first into movement, then into electricity<\/i>."],["a reservoir / a dam / a penstock / a turbine / a generator / a transformer","The technical nouns of the diagram: use them exactly."],["which in turn","A chain of cause: <i>spins a turbine, which in turn drives a generator<\/i>."],["so that / in order to","Purpose: <i>a transformer raises the voltage so that it can be sent over long distances<\/i>."],["meanwhile / at the same time","Two things at once: <i>Meanwhile, the water flows back into the river<\/i>."],["rushes down / flows through","Verbs for water movement."],["the force of the water","The cause of the turbine's movement."]],"plan":["<b>Introduction:<\/b> paraphrase <i>how electricity is produced in a hydroelectric power station<\/i>.","<b>Overview:<\/b> eight stages; the energy of flowing water becomes movement, then electricity; the water returns to the river.","<b>Body 1:<\/b> from the reservoir to the generator: the water stages.","<b>Body 2:<\/b> the electricity stages (transformer, power lines), and the water returning."],"read":[["The process has eight stages, from collecting water in a reservoir to carrying electricity in power lines (and returning the water).","key","The number and the start and end of the process."],["The first four stages involve only water; electricity is produced only when the turbine drives the generator.","key","A useful division of the process into two parts."],["A transformer raises the voltage so electricity can be carried by power lines.","key","The key function of the last electrical stage."],["The water goes down a pipe called a penstock.","detail","True, but one stage."],["Water is released through an intake gate.","detail","True, but one stage."],["The turbine is turned by the generator.","false","Reversed: the turbine drives the generator."],["Electricity is produced before the water spins the turbine.","false","Electricity is produced after the turbine drives the generator."]],"overview":[["Overall, the process has eight stages in which the energy of flowing water is converted into mechanical movement and then into electricity, before the water is returned to the river.",true,"The count of stages and the logic of the conversion."],["Water is collected, released, rushes down a pipe, spins a turbine, drives a generator, goes through a transformer and along power lines.",false,"A list of the stages."],["Hydroelectric power is a clean source of energy, so it is better than coal.",false,"An opinion and a comparison the diagram does not show."],["The first four stages involve only water, and electricity is produced in the later stages.",true,"A valid division of the process."],["The diagram shows a power station.",false,"Repeats the question."],["A transformer is used.",false,"A single stage."]],"group":{"names":["Water stages (1 to 4)","Electricity and return (5 to 8)"],"instr":"The model has one paragraph for the water stages and one for the electricity stages. <b>Which paragraph does each stage belong in?<\/b>","note":"Splitting a process where its nature changes (here, from moving water to electricity) gives natural paragraphs and a logical place for <i>Once…<\/i> or <i>Then…<\/i>.","items":[["Water is collected in a reservoir",0],["Water rushes down the penstock",0],["The force of the water spins a turbine",0],["The generator produces electricity",1],["A transformer raises the voltage",1],["Power lines carry the electricity to homes and factories",1]]},"cloze":{"para":1,"words":["First","collected","then","released","rushes","called","which in turn","drives","involve","because"],"extra":["Finally","spins","stored","after"],"note":"<i>which in turn drives a generator<\/i> shows a chain of cause and effect in one clause.","segs":["",", water is "," in a reservoir behind the dam. It is "," "," through an intake gate and "," down a large pipe "," a penstock. The force of the water spins a turbine, "," "," a generator. These first four stages "," only water, "," no electricity is produced until the turbine drives the generator."]},"model":["The diagram shows how a hydroelectric power station generates electricity from water stored behind a dam. Overall, the process has eight stages, in which the energy of flowing water is converted first into mechanical movement and then into electrical power, before the water is returned to the river.","First, water is collected in a reservoir behind the dam. It is then released through an intake gate and rushes down a large pipe called a penstock. The force of the water spins a turbine, which in turn drives a generator. These first four stages involve only water, because no electricity is produced until the turbine drives the generator.","The generator produces the electricity, and a transformer raises its voltage so that it can be sent over long distances. Finally, power lines carry the electricity to homes and factories. Meanwhile, the water that has passed through the system flows back into the river."],"band7":{"para":1,"text":"At first, water is collect in a reservoir behind the dam. After it is released by an intake gate, and it rush down a big pipe what is called a penstock. The force of the water is spinning a turbine, then the turbine drive a generator. These four first stages is only water, because there is no electricity before the turbine drives the generator.","faults":[["At first, water is collect","First, water is collected","The passive needs the past participle; <i>First<\/i> is the usual opener."],["After it is released by an intake gate, and it rush down a big pipe what is called a penstock","It is then released through an intake gate and rushes down a large pipe called a penstock","<i>through<\/i> a gate; agreement; a reduced relative (<i>called<\/i>) instead of <i>what is called<\/i>."],["is spinning a turbine, then the turbine drive a generator","spins a turbine, which in turn drives a generator","Present simple for a process, a relative clause instead of a comma splice, and agreement."],["These four first stages is only water","These first four stages involve only water","Word order of the adjectives, and a precise verb <i>involve<\/i>."]]},"notes":{"TA":"The overview states the number of stages and the energy conversion. Every stage appears, with the water and electricity stages clearly distinguished.","CC":"Two paragraphs split where the process changes character. <i>First, then, Finally, Meanwhile<\/i> give a clear sequence, and <i>These first four stages…<\/i> summarises before moving on.","LR":"<i>reservoir, intake gate, penstock, turbine, generator, transformer, converted into, voltage<\/i>: the exact technical terms.","GRA":"Passive voice, a relative clause with <i>in turn<\/i>, <i>so that<\/i> for purpose, and a reason clause (<i>because no electricity is produced until…<\/i>)."},"task":1}],"T2":[{"id":"t2-01","etype":"opinion","label":"Opinion · education","short":"University subjects","title":"Should universities focus on jobs?","minutes":40,"prompt":"Some people believe that universities should focus on subjects that lead directly to employment, such as engineering and medicine, and spend less money on arts subjects such as history and philosophy.<br><br>To what extent do you agree or disagree?","decode":{"q":"Some people believe that [[universities should focus on subjects that lead directly to employment]], such as engineering and medicine, and spend [[less money on arts subjects]] such as history and philosophy. [[To what extent do you agree or disagree?]]","why":"<b>Topic:<\/b> what universities should teach and fund. <b>Two sides:<\/b> job-focused subjects against arts subjects. <b>Task words:<\/b> “To what extent” means you give a <b>degree<\/b> of agreement (fully, largely, partly). You must hold one clear position, not describe both sides neutrally.","toks":[["Some",-1],["people",-1],["believe",-1],["that",-1],["universities",0],["should",0],["focus",0],["on",0],["subjects",0],["that",0],["lead",0],["directly",0],["to",0],["employment",0],[",",-1],["such",-1],["as",-1],["engineering",-1],["and",-1],["medicine,",-1],["and",-1],["spend",-1],["less",1],["money",1],["on",1],["arts",1],["subjects",1],["such",-1],["as",-1],["history",-1],["and",-1],["philosophy.",-1],["To",2],["what",2],["extent",2],["do",2],["you",2],["agree",2],["or",2],["disagree?",2]],"n":3},"plan":{"thesis":["Universities should teach only subjects that lead to jobs, because arts graduates cannot find work.","Although vocational degrees are vital, I largely disagree that arts subjects should lose funding, because they build transferable skills and protect a society's values.","Universities are places where students study subjects such as engineering and history."],"ans":1,"why":"Option B answers “to what extent” (<i>largely disagree<\/i>) and previews both body paragraphs. A is extreme and unsupported; C states a fact, not a position.","pairs":[["Arts degrees develop skills that employers value in many careers.","A history graduate who becomes a policy adviser uses research and argument every day."],["Societies need enough specialists such as doctors and engineers.","Rural areas short of doctors suffer directly when too few students qualify."],["Humanities subjects preserve a nation's memory and values.","Historians help museums and citizens interpret the past."]],"note":"Each example is chosen to prove one idea only. A general example such as “many people study arts” would prove nothing."},"upgrade":[["Arts subjects are not useful for jobs but they are good for people.",["Arts subjects are bad for jobs but good for people, and this is very important.","Although arts degrees may not lead to a specific career, they enrich individuals and develop analytical skills that suit a wide range of roles.","Arts subjects are not useful for jobs, but there are many reasons why they are good for people and society."],1,"Option B concedes, then contrasts (<i>although … they<\/i>), and names the benefit precisely. A and C stay vague and informal (<i>very important, many reasons<\/i>)."],["Governments should give more money to science because it is more important.",["Governments are right to prioritise science and engineering, since these fields underpin healthcare, infrastructure and economic growth.","Governments should give more money to science because science is very important for everybody in the world.","Science should get more money, and this is better for the future of the country."],0,"Option A gives the reason with specific nouns after <i>since<\/i>. B repeats <i>science / important<\/i> and C is vague (<i>better for the future<\/i>)."],["In conclusion, I think universities should do both things.",["In conclusion, universities should do both things and I think this is the best idea.","In conclusion, both subjects are good so universities should teach them both.","In conclusion, while vocational degrees deserve support, cutting arts funding would impoverish graduates and society, so a balanced curriculum is preferable."],2,"Option C restates the position with the concession and the reason, in different words from the introduction."]],"order":{"para":1,"note":"Topic sentence (the reason) → explanation (what the skills are) → why they transfer between careers → example → link back to the claim. The word <i>Consequently<\/i> at the end shows the final sentence draws a conclusion from the example.","sents":["The strongest reason for supporting both is that arts degrees build skills which employers value across many careers.","Students of history or philosophy spend years analysing evidence, constructing arguments and writing clearly, abilities that are useful in law, journalism, administration and business.","These are not narrow academic talents; they are habits of mind that allow people to move between careers as industries change.","A history graduate who becomes a policy adviser, for example, uses precisely these skills every day, even though no job advertisement asked for a history degree.","Consequently, arts subjects are far less impractical than critics assume."]},"model":["Some people argue that universities should concentrate their resources on career-focused subjects such as engineering and medicine rather than on arts disciplines. While I accept that vocational degrees are vital to any economy, I largely disagree that the arts should be starved of funding.","The strongest reason for supporting both is that arts degrees build skills which employers value across many careers. Students of history or philosophy spend years analysing evidence, constructing arguments and writing clearly, abilities that are useful in law, journalism, administration and business. These are not narrow academic talents; they are habits of mind that allow people to move between careers as industries change. A history graduate who becomes a policy adviser, for example, uses precisely these skills every day, even though no job advertisement asked for a history degree. Consequently, arts subjects are far less impractical than critics assume.","It is true, however, that societies depend on professionals such as doctors and engineers, and governments have a duty to train enough of them. Rural areas that lack doctors, for instance, suffer directly when too few students qualify. Yet this argues for adequate funding of medicine, not for removing support from the humanities, since the two kinds of study serve different needs and a budget can reflect both. Moreover, subjects such as literature and history preserve a nation's memory and values, which no technical degree can replace.","In conclusion, universities should prioritise courses that meet urgent national needs, but they should not abandon the arts. A balanced range of subjects serves graduates, employers and society far better than a narrow, job-focused curriculum, and public funding should reflect that."],"band7":{"para":1,"text":"The most strong reason is that arts degrees gives skills which are useful in many jobs. Students of history or philosophy spend many years analysing evidence, making arguments and to write clearly, and these abilities are useful for law, journalism, administration and business. For example, a history graduate who become a policy adviser use these skills every day even though no job advert ask for a history degree. So arts subjects are not so useless like critics think.","faults":[["The most strong reason","The strongest reason","The superlative of a short adjective is <i>-est<\/i>."],["arts degrees gives skills","arts degrees build skills","Subject–verb agreement, and <i>build<\/i> is more precise than <i>gives<\/i>."],["making arguments and to write clearly","constructing arguments and writing clearly","Parallel structure: <i>analysing, constructing, writing<\/i>."],["who become a policy adviser use these skills","who becomes a policy adviser uses these skills","Two agreement errors in one clause."],["no job advert ask for a history degree","no job advertisement asked for a history degree","Tense and agreement, and <i>advertisement<\/i> is more formal than <i>advert<\/i>."],["not so useless like critics think","far less impractical than critics assume","<i>so … like<\/i> is incorrect; a comparative with <i>than<\/i> is needed."]]},"ideas":[["Job-focused degrees","Graduates need employable skills to repay the cost of study.","Students with large loans often judge a degree by the salary it leads to."],["Job-focused degrees","Economies need enough engineers and doctors.","Rural clinics short of doctors; projects waiting for qualified engineers."],["Job-focused degrees","Limited public money should go where need is most urgent.","Training more nurses during a healthcare shortage."],["The arts","Arts degrees build transferable skills (analysis, writing, argument).","A history graduate working as a policy adviser."],["The arts","Creative industries employ large numbers of people.","Film, publishing, design and museums all rely on arts graduates."],["The arts","Humanities help citizens think critically about public claims.","Historians who explain how past events were misreported."],["Balance","A narrow curriculum leaves graduates less adaptable when jobs change.","Careers that did not exist twenty years ago, such as social media management."]],"vocab":[["vocational degree / course","A degree that trains for a specific job: <i>vocational degrees are vital to any economy<\/i>."],["the humanities / arts disciplines","History, philosophy, literature."],["transferable skills","Skills useful in many jobs: <i>analysis, communication, research<\/i>."],["employable / employability","Likely to get a job: <i>improve graduates' employability<\/i>."],["starved of funding","Given too little money: <i>should not be starved of funding<\/i>."],["underpin","Support from below: <i>science underpins healthcare<\/i>."],["a narrow, job-focused curriculum","A phrase to describe the other side's proposal."],["prioritise","Put first: <i>prioritise courses that meet urgent national needs<\/i>."],["impractical","Not useful in practice: <i>far less impractical than critics assume<\/i>."],["a duty to + verb","A formal way to say “should”: <i>governments have a duty to train enough doctors<\/i>."]],"notes":{"TR":"A clear, partial position (<i>largely disagree<\/i>) is given in the introduction and held throughout. Both sides are acknowledged, and each body paragraph has an idea, a specific example and a link back.","CC":"Introduction → strongest reason (body 1) → concession and rebuttal (body 2) → conclusion. <i>however, yet, moreover, consequently<\/i> signal each move without being mechanical.","LR":"<i>vocational, starved of funding, transferable skills, impractical, prioritise<\/i> are topic-specific collocations rather than general words.","GRA":"Concession structures (<i>While I accept…, It is true, however, that…<\/i>), relative clauses (<i>abilities that…, which no technical degree can replace<\/i>), and a participle list."},"task":2},{"id":"t2-02","etype":"opinion","label":"Opinion · work","short":"Working from home","title":"Will working from home replace offices?","minutes":40,"prompt":"Working from home has become much more common. Some people believe that, in the future, most people will work from home and traditional offices will disappear.<br><br>To what extent do you agree or disagree?","decode":{"q":"Working from home has become much more common. Some people believe that, in the future, [[most people will work from home]] and [[traditional offices will disappear]]. [[To what extent do you agree or disagree?]]","why":"<b>Topic:<\/b> the future of work and offices. <b>Prediction:<\/b> the question is about the <i>future<\/i>, so your argument must use prediction language (<i>is likely to, will probably<\/i>), not just describe today. <b>Task words:<\/b> “To what extent” asks for a degree of agreement.","toks":[["Working",-1],["from",-1],["home",-1],["has",-1],["become",-1],["much",-1],["more",-1],["common.",-1],["Some",-1],["people",-1],["believe",-1],["that,",-1],["in",-1],["the",-1],["future,",-1],["most",0],["people",0],["will",0],["work",0],["from",0],["home",0],["and",-1],["traditional",1],["offices",1],["will",1],["disappear",1],[".",-1],["To",2],["what",2],["extent",2],["do",2],["you",2],["agree",2],["or",2],["disagree?",2]],"n":3},"plan":{"thesis":["Working from home is better than working in an office in every way, so offices will disappear.","I largely disagree: although home working will stay common, offices will survive because they support collaboration, training and company culture.","Many people work from home today and many work in offices."],"ans":1,"why":"B holds a position on the prediction (<i>largely disagree<\/i>), concedes the truth in the other view, and previews two body paragraphs. A is extreme; C describes the present and takes no position.","pairs":[["Face-to-face contact helps teams solve problems quickly.","Design teams who sketch ideas together on a whiteboard reach decisions faster than by messaging."],["New employees learn best by watching experienced colleagues.","A graduate trainee overhears how a senior manager handles a difficult client call."],["Many people want flexibility, so hybrid patterns will grow.","Companies that ask staff to attend two or three days a week keep desks for only part of the team."]],"note":"Idea 1 and 2 support “offices survive”; idea 3 is the concession that stops the essay looking one-sided. Each example is a concrete situation, not a general statement."},"upgrade":[["Offices are good because people can talk to each other.",["Offices are useful because people can talk and this makes work better in many ways.","Offices remain valuable because spontaneous conversations spark ideas that scheduled video calls rarely produce.","Offices are good for work because there is a lot of talking and teamwork there."],1,"B names the benefit precisely (<i>spontaneous conversations spark ideas<\/i>) and contrasts it with video calls. A and C use vague words (<i>good, many ways, a lot of<\/i>)."],["Working from home saves money for companies.",["Working from home can save companies money in many different ways.","Remote work can cut costs for employers, who need less office space, though savings may be offset by new technology and management expenses.","Companies save money when people work from home, so it is a good idea."],1,"Option B hedges (<i>can<\/i>), names a specific saving, and acknowledges a limit (<i>though…<\/i>). The others are absolute or vague."],["In the future there will be hybrid work.",["In the future, hybrid work will probably become the norm, with staff dividing their week between home and the office.","In the future, there will be hybrid work and this will be the best thing.","Hybrid work will be in the future because it is better than the other ways."],0,"A predicts with <i>will probably become the norm<\/i> and explains what hybrid means in one clause."]],"order":{"para":1,"note":"Claim → explanation of why contact matters → concrete example → link. <i>For instance<\/i> and <i>As a result<\/i> are the signposts that show the example and the consequence.","sents":["The main reason is that face-to-face contact makes collaboration faster and more creative.","When colleagues share a room, a problem can be sketched on a whiteboard, questioned and solved in minutes, whereas the same discussion by messages or video calls may take days.","Design teams, for instance, often report that their best ideas emerge from informal conversations rather than from scheduled meetings.","As a result, companies that depend on teamwork have strong reasons to keep a shared workplace."]},"model":["It is often claimed that most employees will eventually work from home and that conventional offices will disappear. Although I accept that remote working is here to stay, I largely disagree that offices will vanish, because they offer benefits that screens cannot replace.","The main reason is that face-to-face contact makes collaboration faster and more creative. When colleagues share a room, a problem can be sketched on a whiteboard, questioned and solved in minutes, whereas the same discussion by messages or video calls may take days. Design teams, for instance, often report that their best ideas emerge from informal conversations rather than from scheduled meetings. As a result, companies that depend on teamwork have strong reasons to keep a shared workplace.","Offices also play a vital role in training and building company culture. A new graduate learns by watching how an experienced manager handles a difficult client call, something that is hard to observe through a laptop. Admittedly, many people want flexibility, and employers are listening; however, this is likely to produce hybrid patterns, with staff attending the office two or three days a week, rather than the end of the office altogether. Some roles, from laboratory work to health care, cannot be done remotely at all, and employers also know that trust is built more easily when colleagues have actually met.","In conclusion, remote working will certainly grow, but it will complement rather than replace the office. Most organisations will keep a smaller, redesigned workplace where teams meet, train newcomers and share a common identity, which is difficult to create through a screen."],"band7":{"para":1,"text":"The main reason is that face-to-face contact make collaboration more faster and creative. When colleagues are in the same room, a problem can be draw on a whiteboard, discussed and solved in minutes, but the same discussion by messages or video calls can takes days. For instance design teams often says their best ideas come from informal conversations. So companies who depend on teamwork have strong reasons to keep a workplace.","faults":[["contact make collaboration more faster and creative","contact makes collaboration faster and more creative","Agreement, and a double comparative (<i>more faster<\/i>)."],["can be draw on a whiteboard","can be sketched on a whiteboard","A passive needs the past participle, and <i>sketched<\/i> is more precise."],["but the same discussion by messages or video calls can takes days","whereas the same discussion by messages or video calls may take days","A modal is followed by the base verb, and <i>whereas<\/i> expresses contrast more precisely."],["For instance design teams often says","Design teams, for instance, often report","Agreement, and the signal phrase can sit inside the sentence."],["So companies who depend on teamwork","As a result, companies that depend on teamwork","<i>So<\/i> is too informal at the start of a sentence; <i>that<\/i> for things (here an organisation)."]]},"ideas":[["Offices will survive","Face-to-face contact speeds up problem solving.","Design teams sketching ideas on a whiteboard."],["Offices will survive","Juniors learn by observing experienced colleagues.","A trainee overhearing a senior manager handle a client."],["Offices will survive","A shared workplace builds company culture and loyalty.","Staff who rarely meet may feel little connection to the firm."],["Offices will survive","Some jobs cannot be done at home.","Laboratory work, manufacturing, health care."],["Home working will grow","Employers save on office space and commuting time.","Firms that cut rented floor space after allowing remote work."],["Home working will grow","Employees value flexibility and may leave inflexible employers.","Job advertisements that now list “hybrid” as a benefit."],["Balance","Hybrid patterns combine both.","Two or three office days a week, with the rest at home."]],"vocab":[["remote working / telecommuting","Working away from the office, usually from home."],["hybrid working","Part of the week at home, part in the office."],["collaboration","Working together: <i>collaboration is faster and more creative<\/i>."],["spontaneous","Unplanned: <i>spontaneous conversations spark ideas<\/i>."],["complement (not compliment)","To add to, not replace: <i>will complement rather than replace the office<\/i>."],["company culture","Shared values and habits in an organisation."],["conventional / traditional offices","Alternatives to the phrase in the question, to avoid copying."],["here to stay","An idiom for something that will not go away."],["offset","To balance a cost: <i>savings may be offset by new expenses<\/i>."],["a shared workplace / physical presence","Ways to refer to “the office” without repeating the word."]],"notes":{"TR":"Answers the prediction directly with a degree of disagreement. Body 1 and 2 give two strong reasons; the concession on flexibility (hybrid) makes the position more credible.","CC":"Each paragraph opens with a clear topic sentence (<i>The main reason is…, Offices also play…<\/i>). The final paragraph sums up in different words.","LR":"<i>conventional offices, collaboration, spontaneous, complement, hybrid patterns, shared identity<\/i>: paraphrases that avoid repeating the question.","GRA":"<i>whereas<\/i>, <i>When colleagues share a room…<\/i>, a relative clause (<i>something that is hard to observe<\/i>), and hedged prediction (<i>is likely to produce<\/i>)."},"task":2},{"id":"t2-03","etype":"opinion","label":"Opinion · environment","short":"Who protects the environment","title":"Can individuals protect the environment?","minutes":40,"prompt":"Some people say that individuals can do little to protect the environment, and that only governments and large companies can make a real difference.<br><br>Do you agree or disagree?","decode":{"q":"Some people say that [[individuals can do little to protect the environment]], and that [[only governments and large companies can make a real difference]]. [[Do you agree or disagree?]]","why":"<b>Topic:<\/b> who is able to protect the environment. <b>Two claims:<\/b> individuals are powerless, and only governments and companies matter. The word <i>only<\/i> is a clue: the statement is extreme, so you can reasonably disagree. <b>Task words:<\/b> “Do you agree or disagree?” means choose a side and defend it.","toks":[["Some",-1],["people",-1],["say",-1],["that",-1],["individuals",0],["can",0],["do",0],["little",0],["to",0],["protect",0],["the",0],["environment",0],[",",-1],["and",-1],["that",-1],["only",1],["governments",1],["and",1],["large",1],["companies",1],["can",1],["make",1],["a",1],["real",1],["difference",1],[".",-1],["Do",2],["you",2],["agree",2],["or",2],["disagree?",2]],"n":3},"plan":{"thesis":["I strongly disagree: individual choices are important, and when millions of people change their behaviour, governments and companies are forced to follow.","I agree that only governments and large companies matter, because individuals have no power.","Governments and companies are important, and so are individuals, but it depends."],"ans":0,"why":"A takes a firm position and gives the logic (millions of choices → pressure on others), which becomes the argument for both body paragraphs. B takes the opposite stance without argument. C is evasive.","pairs":[["Millions of small choices add up to a large effect.","After shops charged for plastic bags, bag use fell sharply because each shopper chose to bring their own."],["Consumers can pressure companies to change.","When buyers abandon a brand over deforestation, it often reforms its supply chain."],["Voters can push governments to act.","Mass climate marches have been followed by new targets on emissions."]],"note":"Idea 1 is about direct impact, ideas 2 and 3 show how individuals influence the other two groups the statement mentions, which is exactly why the statement is too extreme."},"upgrade":[["People can help the environment by doing small things.",["People can help the environment by doing a lot of small things every day.","Everyday choices such as recycling, cutting energy use and avoiding single-use plastic collectively reduce pollution.","Small things are important because they are good for the environment."],1,"B lists three specific actions and a clear result (<i>collectively reduce pollution<\/i>). A and C stay vague (<i>small things<\/i>)."],["Companies are bad because they make a lot of pollution.",["Large companies are responsible for a significant share of industrial pollution, but they respond to what customers buy.","Companies are bad because they pollute and make big problems for the world.","A lot of pollution comes from companies, so they must stop doing it."],0,"A is precise (<i>a significant share of industrial pollution<\/i>) and leads to the argument (<i>they respond to what customers buy<\/i>)."],["I think governments are not enough.",["I think governments are not enough because they cannot do everything.","Governments alone cannot solve the problem, since laws are only effective when citizens support and obey them.","Governments are not enough for this problem, and individuals are needed too."],1,"B gives the reason (<i>since laws are only effective when…<\/i>) in a single, balanced sentence."]],"order":{"para":1,"note":"Claim (small actions add up) → example (plastic bag charge) → the point that no law forced anyone → how habits spread → link to the question. The example is placed before the explanation because it makes the mechanism easy to see.","sents":["To begin with, small actions are far from insignificant when multiplied by millions.","When several countries introduced charges for plastic bags, for example, shoppers quickly began bringing their own, and bag use fell dramatically within a year.","No law forced any single customer to change; each one simply decided to.","Habits spread, too, as neighbours and colleagues copy behaviour they see.","The sum of those decisions removed an enormous amount of plastic from the environment, which suggests that individuals are not as powerless as the statement claims."]},"model":["It is sometimes argued that only governments and large corporations can protect the environment, and that ordinary people can achieve very little. I strongly disagree with this view, because individual choices matter in themselves and, collectively, they force the powerful to act. To dismiss personal responsibility is both inaccurate and unhelpful.","To begin with, small actions are far from insignificant when multiplied by millions. When several countries introduced charges for plastic bags, for example, shoppers quickly began bringing their own, and bag use fell dramatically within a year. No law forced any single customer to change; each one simply decided to. Habits spread, too, as neighbours and colleagues copy behaviour they see. The sum of those decisions removed an enormous amount of plastic from the environment, which suggests that individuals are not as powerless as the statement claims.","Moreover, individuals shape what companies and governments do. Businesses respond to what consumers buy, and firms accused of damaging forests have often reformed their supply chains after customers abandoned their products. Voters, likewise, influence policy, as public pressure has repeatedly led governments to adopt stricter targets on emissions. Even the largest corporations depend, in the end, on public goodwill. It follows that the groups named in the statement are not separate from individuals but accountable to them.","In conclusion, I believe that governments and corporations are essential, but the claim that only they can make a difference is mistaken. Responsible individual behaviour has a direct effect and, equally importantly, creates the pressure that drives larger change, from cleaner industry to stronger laws."],"band7":{"para":2,"text":"Moreover, individuals can shape what companies and governments do. Business responds to what consumers buys, and companies which were accused of destroying forests has often changed their supply chains after customers stop buying their products. Voters also can influence policy, public pressure have made governments to adopt stricter targets on emissions. So the groups in the statement is not different from individuals but they depend on them.","faults":[["Business responds to what consumers buys","Businesses respond to what consumers buy","Agreement in both clauses."],["companies which were accused of destroying forests has often changed","firms accused of damaging forests have often reformed","A reduced relative clause is more economical; <i>has<\/i> must be <i>have<\/i>."],["after customers stop buying their products","after customers abandoned their products","Tense (the action is completed) and a more natural verb."],["Voters also can influence policy, public pressure have","Voters, likewise, influence policy, as public pressure has repeatedly","A comma splice and an agreement error."],["made governments to adopt","led governments to adopt","<i>Make<\/i> is followed by the base verb, without <i>to<\/i>; <i>lead … to<\/i> fits better."],["So the groups in the statement is not different from","It follows that the groups named in the statement are not separate from","<i>So<\/i> is informal, and <i>groups … are<\/i>."]]},"ideas":[["Individuals can act","Small choices add up across millions of people.","Plastic bag charges that cut bag use quickly."],["Individuals can act","Consumers can pressure companies to change.","Customers abandoning brands linked to deforestation."],["Individuals can act","Voters can push governments to introduce stronger policies.","Climate marches followed by new emission targets."],["Individuals can act","People set social norms that others copy.","Cycling to work in a city where it was once unusual."],["Governments and companies","Only they can build large-scale infrastructure.","Wind farms, public transport networks, recycling plants."],["Governments and companies","Laws apply to everyone, so they can be more effective than voluntary action.","Bans on the most polluting vehicles."],["Balance","Both levels are needed: laws set the framework, individuals make them work.","Recycling schemes need both collection systems and citizens who sort their waste."]],"vocab":[["collectively / in aggregate","Taken together: <i>collectively, they force the powerful to act<\/i>."],["carbon footprint","The amount of CO₂ a person or company produces."],["single-use plastic","Plastic made to be thrown away after one use."],["supply chain","The route from raw material to product."],["accountable to","Responsible to someone: <i>accountable to their customers<\/i>."],["reform / overhaul","Change something thoroughly."],["insignificant / negligible","So small it can be ignored: <i>far from insignificant<\/i>."],["emissions targets","Legal goals for reducing greenhouse gases."],["it follows that","A formal link to a conclusion."],["sustainable / eco-friendly","Not harmful to the environment in the long term."]],"notes":{"TR":"A strong, clear position (<i>strongly disagree<\/i>) with a logical idea running through both body paragraphs: individual acts matter directly, and they also move the groups the statement names.","CC":"Body 1 = direct effect (with example); body 2 = indirect effect on companies and governments. The last sentence of body 2 returns to the exact wording of the statement.","LR":"<i>collectively, insignificant, supply chains, accountable to, drives larger change<\/i>.","GRA":"Concession and contrast, participle clauses (<i>firms accused of…<\/i>), cleft-style emphasis (<i>No law forced…; each one simply decided to<\/i>) and consistent tenses."},"task":2},{"id":"t2-04","etype":"opinion","label":"Opinion · health","short":"Banning junk-food adverts","title":"Should unhealthy food advertising be banned?","minutes":40,"prompt":"Many countries have a growing number of people who are overweight. Some people think that the best way to tackle this is for governments to ban the advertising of unhealthy food.<br><br>To what extent do you agree or disagree?","decode":{"q":"Many countries have a growing number of people who are overweight. Some people think that [[the best way to tackle this]] is for governments to [[ban the advertising of unhealthy food]]. [[To what extent do you agree or disagree?]]","why":"<b>Topic:<\/b> obesity and a policy solution. <b>Trap:<\/b> “the <i>best<\/i> way” is a strong claim. You can agree that a ban helps without agreeing that it is the best or only way. <b>Task words:<\/b> “To what extent” invites a partial position.","toks":[["Many",-1],["countries",-1],["have",-1],["a",-1],["growing",-1],["number",-1],["of",-1],["people",-1],["who",-1],["are",-1],["overweight.",-1],["Some",-1],["people",-1],["think",-1],["that",-1],["the",0],["best",0],["way",0],["to",0],["tackle",0],["this",0],["is",-1],["for",-1],["governments",-1],["to",-1],["ban",1],["the",1],["advertising",1],["of",1],["unhealthy",1],["food",1],[".",-1],["To",2],["what",2],["extent",2],["do",2],["you",2],["agree",2],["or",2],["disagree?",2]],"n":3},"plan":{"thesis":["A ban on advertising is a useful measure, especially to protect children, but I do not agree that it is the best way to tackle obesity on its own.","I completely agree that banning all advertising will solve obesity.","Obesity is a serious problem in many countries and there are several solutions."],"ans":0,"why":"A partly agrees (the ban helps), partly disagrees (it is not the <i>best<\/i> way), which answers “to what extent”. B is absolute and unrealistic; C names the topic but takes no position.","pairs":[["Advertising shapes the food preferences of young children.","Cartoon characters on sugary cereal boxes make children ask for those products."],["A ban alone cannot change eating habits formed at home and at school.","A child who eats fast food every week because parents are busy is unaffected by a missing advert."],["Education and price measures act on adults as well as children.","A sugar tax on soft drinks that led manufacturers to reduce the sugar in their recipes."]],"note":"The first idea supports the part of the question you agree with; ideas two and three explain why a ban is not <i>the best<\/i> way. Each example is a specific situation."},"upgrade":[["Advertising makes children want unhealthy food.",["Advertising is very powerful and children are always wanting unhealthy food because of it.","Advertising makes children want junk food and this is a big problem for families.","Repeated exposure to bright, entertaining advertisements shapes children's preferences long before they can judge nutritional value."],2,"C explains the mechanism (<i>repeated exposure … shapes preferences<\/i>) and why children are vulnerable. A and B simply restate the claim in simple vocabulary."],["A ban is not enough to solve obesity.",["A ban is not enough because obesity is a big problem with many causes.","A ban on adverts would be only one part of the solution, as obesity has complex causes, including diet at home, inactivity and cost.","A ban will not solve obesity, and there are lots of other things to do."],1,"B is precise (<i>only one part of the solution<\/i>) and lists the other causes. A and C use vague words (<i>big problem, other things<\/i>)."],["Parents should be more responsible.",["Parents should take more responsibility for what their children eat.","Parents have a significant influence, so campaigns that help them cook affordable, healthy meals may succeed where a ban would not.","Parents must be responsible because children copy parents."],1,"B turns an opinion into an argument with a consequence (<i>may succeed where a ban would not<\/i>) and a specific measure."]],"order":{"para":1,"note":"The paragraph moves from the main reason (children's exposure) → how advertising works → a specific example → why this supports a ban. <i>This is particularly true<\/i> narrows the claim to children.","sents":["The main argument in favour of a ban is that advertising strongly influences what children want to eat.","Young people cannot judge nutritional value, and repeated exposure to colourful, entertaining adverts, such as cartoon characters on sugary cereals, encourages them to demand these products.","This is particularly true when advertisements are broadcast during children's programmes.","Removing that pressure would therefore reduce the pull of unhealthy food at an age when habits are formed."]},"model":["Rising obesity is a serious concern worldwide, and some argue that governments should respond by banning advertisements for unhealthy food. I agree that such a ban would be a useful measure, particularly for protecting children, but I do not believe that it is the best way to tackle the problem by itself.","The main argument in favour of a ban is that advertising strongly influences what children want to eat. Young people cannot judge nutritional value, and repeated exposure to colourful, entertaining adverts, such as cartoon characters on sugary cereals, encourages them to demand these products. This is particularly true when advertisements are broadcast during children's programmes. Removing that pressure would therefore reduce the pull of unhealthy food at an age when habits are formed.","However, a ban would address only part of a complex problem. Obesity is also linked to the food that families can afford and cook at home, to the amount of exercise children take, and to the snacks sold in schools. A child whose parents are too busy to cook is unlikely to change simply because an advertisement has disappeared. Measures such as taxing sugary drinks, improving school meals and teaching cooking skills would act on adults as well as children, and some have already persuaded manufacturers to reduce sugar in their recipes.","In conclusion, banning advertisements for unhealthy food would help to protect children, but it should form one element of a wider strategy that also includes taxation, education and support for families, because no single measure can reverse a trend with so many causes."],"band7":{"para":1,"text":"The main argument for a ban is that advertising influence what children wants to eat. Young people cannot to judge nutritional value, and seeing colourful adverts many times, like cartoon characters on sugary cereals, make them demand these products. This is especially true when advertisements are on during children programmes. So removing it would reduce the pull of unhealthy food at an age when habits is formed.","faults":[["advertising influence what children wants to eat","advertising strongly influences what children want to eat","Agreement in both verbs, and an adverb adds precision."],["cannot to judge","cannot judge","A modal is followed by the base verb, without <i>to<\/i>."],["seeing colourful adverts many times, like cartoon characters on sugary cereals, make them demand","repeated exposure to colourful, entertaining adverts, such as cartoon characters on sugary cereals, encourages them to demand","A noun phrase is more academic than <i>seeing … many times<\/i>; <i>such as<\/i> not <i>like<\/i>; agreement."],["when advertisements are on during children programmes","when advertisements are broadcast during children's programmes","A collocation (<i>broadcast<\/i>) and the possessive form."],["So removing it would reduce","Removing that pressure would therefore reduce","A clear noun reference instead of <i>it<\/i>, and a more formal linker."],["when habits is formed","when habits are formed","Agreement."]]},"ideas":[["Agree: a ban helps","Children are especially vulnerable to persuasion.","Advertisements during children's programmes."],["Agree: a ban helps","Advertising is designed to make food look desirable and normal.","Bright packaging and celebrity endorsements."],["Agree: a ban helps","Some countries have already limited advertising to children.","Restrictions on junk-food adverts before a certain time of day."],["Disagree: a ban is not enough","Obesity has many causes: diet, inactivity, cost, stress.","Families who cannot afford fresh food."],["Disagree: a ban is not enough","Advertisers find other routes: sponsorship and social media.","Sports sponsorship by food brands."],["Disagree: a ban is not enough","Other measures can reach adults too.","Sugar taxes, school meals, nutrition labels."],["Balance","Combine measures: restrict adverts, tax sugar, teach cooking.","A national strategy with several policies working together."]],"vocab":[["obesity / overweight","Medical term for being very overweight."],["nutritional value","How healthy food is: <i>children cannot judge nutritional value<\/i>."],["exposure to","How much you see or experience something: <i>repeated exposure to adverts<\/i>."],["a complex / multi-faceted problem","A problem with many causes."],["broadcast","To send out on TV or radio."],["sugary drinks / processed food","Common collocations in this topic."],["act on / target","To affect or aim at: <i>measures that act on adults as well as children<\/i>."],["form a habit","Habits are formed in childhood."],["a wider strategy","A broader plan combining several measures."],["persuade / encourage sb to + verb","Verb patterns for influence."]],"notes":{"TR":"A partly agreeing position that answers <i>to what extent<\/i> (a ban helps but is not the best way). Body 1 supports the agreement with a mechanism; body 2 explains the limits with specific alternatives.","CC":"The progression is logical: introduction with position → why a ban helps → why it is not enough → conclusion. <i>However, therefore, simply, also<\/i> help without sounding mechanical.","LR":"<i>nutritional value, repeated exposure, a complex problem, act on adults, manufacturers, reduce sugar<\/i>.","GRA":"A concession (<i>I agree… but I do not believe…<\/i>), a passive (<i>are broadcast<\/i>), a relative clause (<i>whose parents<\/i>-type structure) and present perfect (<i>some have already persuaded<\/i>)."},"task":2},{"id":"t2-05","etype":"opinion","label":"Opinion · crime","short":"Prison or rehabilitation","title":"Is prison an effective way to reduce crime?","minutes":40,"prompt":"Prison is not an effective way to reduce crime. Governments should invest in community-based punishments and rehabilitation programmes instead.<br><br>To what extent do you agree or disagree?","decode":{"q":"[[Prison is not an effective way to reduce crime]]. Governments should [[invest in community-based punishments and rehabilitation programmes instead]]. [[To what extent do you agree or disagree?]]","why":"<b>Topic:<\/b> punishment and crime reduction. <b>Two claims:<\/b> prison does not work, and money should go to alternatives. You may accept one claim and reject the other. <b>Task words:<\/b> “To what extent” asks for a degree of agreement, so a partly agreeing answer is natural.","toks":[["Prison",0],["is",0],["not",0],["an",0],["effective",0],["way",0],["to",0],["reduce",0],["crime",0],[".",-1],["Governments",-1],["should",-1],["invest",1],["in",1],["community-based",1],["punishments",1],["and",1],["rehabilitation",1],["programmes",1],["instead",1],[".",-1],["To",2],["what",2],["extent",2],["do",2],["you",2],["agree",2],["or",2],["disagree?",2]],"n":3},"plan":{"thesis":["I largely agree that rehabilitation and community sentences work better for most offenders, although prison must remain for dangerous criminals.","Prison is the only way to stop crime, because criminals must suffer for what they have done.","Crime is a problem in many countries, and there are different ways to punish people."],"ans":0,"why":"A takes a clear but qualified position and previews the structure (why prison fails, why alternatives work, the exception). B is extreme and C does not answer the question.","pairs":[["Prison can turn minor offenders into hardened criminals.","A teenager jailed for shoplifting spends months among violent offenders and learns new criminal habits."],["Rehabilitation tackles the causes of crime, such as unemployment and addiction.","Training and drug-treatment programmes help former offenders find work and stay out of trouble."],["Prison still protects the public from violent criminals.","Someone convicted of repeated armed robbery cannot safely be supervised in the community."]],"note":"Ideas 1 and 2 support the claim you agree with, and idea 3 is the exception that makes the position realistic. Each example is a specific case."},"upgrade":[["Prison is bad because criminals learn more crime there.",["Prison is not good because there are many reasons why criminals learn more crime there.","Prisons can function as schools for crime, exposing minor offenders to hardened criminals and weakening their ties to family and work.","Prison is very bad and does not stop crime at all."],1,"B names the mechanism (exposure to hardened criminals) and the consequence (weakened ties). A and C are vague and absolute (<i>many reasons, at all<\/i>)."],["Community punishments are cheaper than prison.",["Community punishments are cheaper than prison, which is a big benefit for the government.","Supervised community sentences cost a fraction of a prison place, freeing public money for education and policing.","Community punishments are better because they are less costly than prison."],1,"B gives a precise comparison (<i>a fraction of<\/i>) and the consequence (<i>freeing public money for…<\/i>). A and C repeat the idea in simple words."],["Some criminals are dangerous so they must go to prison.",["Dangerous criminals must go to prison because they are dangerous for people.","Prison remains essential for violent offenders, whose release would put others at risk.","Some criminals are very dangerous, so prison is necessary for them and it is a good thing."],1,"B uses a relative clause (<i>whose release would…<\/i>) to give the reason without repeating <i>dangerous<\/i>."]],"order":{"para":1,"note":"Topic sentence (the main weakness) → a concrete case → what happens next → summary of the effect → supporting evidence. <i>In this way<\/i> signals that the previous example is being generalised.","sents":["The main weakness of imprisonment is that it often makes offenders more likely to reoffend.","A young person jailed for a minor theft, for example, spends months surrounded by hardened criminals, loses a job and drifts away from family.","On release, finding work is difficult, and returning to crime becomes the easiest option.","In this way, prison can act as a school for crime rather than a deterrent.","Several countries that emphasise rehabilitation, such as Norway, have reported much lower rates of reoffending, which suggests that a different approach is possible."]},"model":["Some people claim that prison fails to reduce crime and that governments should spend their money on community punishments and rehabilitation instead. I largely agree with this view for the majority of offenders, although I believe that prison must remain an option for the most dangerous criminals.","The main weakness of imprisonment is that it often makes offenders more likely to reoffend. A young person jailed for a minor theft, for example, spends months surrounded by hardened criminals, loses a job and drifts away from family. On release, finding work is difficult, and returning to crime becomes the easiest option. In this way, prison can act as a school for crime rather than a deterrent. Several countries that emphasise rehabilitation, such as Norway, have reported much lower rates of reoffending, which suggests that a different approach is possible.","Community sentences and rehabilitation programmes, by contrast, deal with the causes of crime. An offender who completes a training course or receives treatment for drug addiction has a real chance of finding work, and unpaid community service allows the offender to repay society visibly. These measures are also considerably cheaper than a prison place. However, prison cannot be abolished altogether. Violent offenders who pose a serious danger to others, for instance, must be kept away from the public.","In conclusion, prison is a blunt and costly tool that too often produces more crime. Governments should therefore invest mainly in community-based punishments and rehabilitation, while reserving prison for dangerous criminals. This balance would protect the public while giving most offenders a genuine second chance."],"band7":{"para":1,"text":"The main weakness of imprisonment is that it often make offenders more likely to reoffend. A young person who jailed for a minor theft, for example, spends months with hardened criminals, lose a job and goes away from family. When released, it is difficult to find work, so return to crime becomes the easiest. In this way, prison is a school for crime and not a deterrent.","faults":[["it often make offenders more likely","it often makes offenders more likely","Subject–verb agreement."],["who jailed for a minor theft","jailed for a minor theft","A reduced passive relative clause, with no extra <i>who<\/i>."],["spends months with hardened criminals, lose a job and goes away from family","spends months surrounded by hardened criminals, loses a job and drifts away from family","Agreement in a list of verbs, and a stronger collocation (<i>drifts away<\/i>)."],["When released, it is difficult to find work","On release, finding work is difficult","A dangling participle: <i>it<\/i> cannot be released."],["so return to crime becomes the easiest","and returning to crime becomes the easiest option","A gerund as the subject, and the noun the adjective needs."],["prison is a school for crime and not a deterrent","prison can act as a school for crime rather than a deterrent","A hedge (<i>can<\/i>) and a more formal contrast."]]},"ideas":[["Prison has limits","Prison can increase reoffending by exposing minor offenders to hardened criminals.","A first-time offender who comes out with new contacts and no job."],["Prison has limits","A criminal record and time away make employment harder.","Employers who reject applicants with convictions."],["Prison has limits","Prison places are very expensive.","The annual cost of one prison place compared with a supervised community sentence."],["Alternatives work","Rehabilitation deals with causes: addiction, poor skills, unemployment.","Drug treatment, vocational training."],["Alternatives work","Community service makes offenders repay the community and keeps family and work ties.","Cleaning parks or helping charities while living at home."],["Alternatives work","Some countries with a rehabilitation focus report lower reoffending.","Norway is often cited for its approach."],["The exception","Dangerous and violent offenders need to be separated from the public.","Repeat armed robbers, violent attackers."],["The exception","Prison can act as a deterrent and as justice for serious crimes.","Long sentences for murder."]],"vocab":[["reoffend / reoffending rates","To commit a crime again: <i>more likely to reoffend<\/i>."],["rehabilitation","Helping an offender return to normal life: <i>rehabilitation programmes<\/i>."],["a deterrent","Something that stops people doing a thing: <i>rather than a deterrent<\/i>."],["a community sentence / non-custodial punishment","A punishment served outside prison."],["hardened criminals","People who have committed many serious crimes."],["tackle the root causes","Deal with the basic reasons: <i>deal with the causes of crime<\/i>."],["a blunt and costly tool","A criticism of prison: not precise and expensive."],["pose a danger to","Be a threat to: <i>offenders who pose a serious danger to others<\/i>."],["reserve for","Keep for a special group: <i>reserving prison for dangerous criminals<\/i>."],["on release","A time phrase: <i>on release, finding work is difficult<\/i>."]],"notes":{"TR":"A qualified position (<i>largely agree<\/i>) with a clear exception. Each body paragraph has an argument, a specific example and a link to the position.","CC":"Body 1 is the problem with prison, body 2 the alternative and its limit. <i>In this way, by contrast, however<\/i> are used for logic, not decoration.","LR":"<i>reoffend, deterrent, hardened criminals, rehabilitation, community service, pose a danger, reserving<\/i>.","GRA":"A participle phrase (<i>surrounded by<\/i>), a relative clause (<i>that emphasise rehabilitation<\/i>), and a concession with <i>although<\/i> and <i>However<\/i>."},"task":2},{"id":"t2-06","etype":"discussion","label":"Discussion · education","short":"Homework for children","title":"Should children do homework every day?","minutes":40,"prompt":"Some people think that teachers should give children homework every day to help them learn. Others believe that homework is harmful and that children need time to play and rest.<br><br>Discuss both views and give your own opinion.","decode":{"q":"Some people think that [[teachers should give children homework every day]]. Others believe that [[homework is harmful]] and that [[children need time to play and rest]]. [[Discuss both views and give your own opinion.]]","why":"<b>Topic:<\/b> homework. <b>Two views:<\/b> daily homework helps learning; homework is harmful because children need free time. <b>Task words:<\/b> “Discuss both views” means one body paragraph per view, and “give your own opinion” means you must also say which you prefer, clearly.","toks":[["Some",-1],["people",-1],["think",-1],["that",-1],["teachers",0],["should",0],["give",0],["children",0],["homework",0],["every",0],["day",0],[".",-1],["Others",-1],["believe",-1],["that",-1],["homework",1],["is",1],["harmful",1],["and",-1],["that",-1],["children",2],["need",2],["time",2],["to",2],["play",2],["and",2],["rest",2],[".",-1],["Discuss",3],["both",3],["views",3],["and",3],["give",3],["your",3],["own",3],["opinion.",3]],"n":4},"plan":{"thesis":["Both views have merit, but I believe that regular homework in moderate amounts benefits children more than it harms them.","Homework is harmful, so teachers should stop giving it.","Some children like homework and some do not, so it depends on the child."],"ans":0,"why":"A announces both views and states a clear, balanced opinion. B ignores the first view and C avoids giving an opinion.","pairs":[["Homework helps children practise and remember what they have learned.","A pupil who repeats multiplication exercises at home recalls them quickly in a test."],["Homework teaches responsibility and independent study.","A child who must plan when to finish a project learns to manage time before reaching university."],["Too much homework causes stress and removes time for play and family.","Children who spend several hours on homework each evening may have little time left for sport or sleep."]],"note":"Ideas 1 and 2 support the view that homework helps; idea 3 supports the view that it harms. A discussion essay needs strong support for both sides before you give your opinion."},"upgrade":[["Homework is good because children learn more.",["Homework is good because it makes children learn a lot more things.","Regular homework consolidates classroom learning by giving pupils the chance to practise independently what they have just been taught.","Children learn better with homework, and this is very good for them."],1,"B explains how homework works (<i>consolidates … practise independently<\/i>). A and C use vague words (<i>a lot, very good<\/i>)."],["Too much homework is bad for children's health.",["Too much homework is very bad because children are tired and unhealthy.","Excessive homework can damage children's wellbeing, leaving little time for sleep, exercise and family life.","Children are tired from too much homework, so it is bad."],1,"B hedges (<i>can<\/i>) and lists specific losses with a participle clause. A and C are absolute and simple."],["I think teachers should give some homework but not too much.",["I think that some homework is good but too much homework is not good.","In my view, a moderate amount of well-designed homework offers the benefits without the harm.","Teachers should give a medium amount of homework, and children will be happy."],1,"B states the opinion precisely (<i>moderate, well-designed<\/i>) and answers both sides in one sentence."]],"order":{"para":1,"note":"Claim (learning needs repetition) → example (multiplication) → a second benefit (independence) → a third (teachers' information). <i>Also<\/i> and <i>moreover<\/i> add reasons; the example makes the first idea concrete.","sents":["Supporters of daily homework emphasise that learning needs repetition.","A pupil who practises multiplication exercises at home, for instance, is likely to recall them more quickly in a test than one who has seen them only once in class.","Homework also teaches independence: a child who must decide when to complete a project learns to organise time, a skill that is just as valuable at university and in employment.","Teachers, moreover, can use homework to see which topics need further explanation."]},"model":["Opinions differ on whether children should be given homework every day. While some argue that it is essential for learning, others believe it harms children by taking away time for play and rest. Although both views have merit, I believe that moderate, well-planned homework is more beneficial than harmful.","Supporters of daily homework emphasise that learning needs repetition. A pupil who practises multiplication exercises at home, for instance, is likely to recall them more quickly in a test than one who has seen them only once in class. Homework also teaches independence: a child who must decide when to complete a project learns to organise time, a skill that is just as valuable at university and in employment. Teachers, moreover, can use homework to see which topics need further explanation.","Critics, however, point to the cost to children's wellbeing. When pupils spend several hours on homework each evening, they have little time left for sport, creative hobbies or sleep, and the stress can reduce their enjoyment of school. Time with family is also important for social development, and tired children rarely learn effectively in class the following day. These concerns are particularly serious for younger children, whose concentration is limited.","In conclusion, I believe the solution is not to abolish homework but to limit it. Short, purposeful tasks, increasing with age, give children the benefits of practice and independence without exhausting them. Schools that set a reasonable time limit, therefore, can satisfy both sides of the debate. Parents and teachers should also talk to children about how they feel, so that the amount of homework can be adjusted when it becomes too much."],"band7":{"para":2,"text":"Critics, but, point to the cost for children wellbeing. When pupils spend several hours on homework each evening, they has little time left for sport, creative hobbies or sleep, and the stress can reduce their enjoyment of school. Time with family is also important for social development, and tired children rarely learn effective in class the following day. These concerns are particular serious for younger children, which concentration is limited.","faults":[["Critics, but, point to the cost for children wellbeing","Critics, however, point to the cost to children's wellbeing","The correct linker, the right preposition, and the possessive."],["they has little time left","they have little time left","Agreement."],["learn effective in class","learn effectively in class","An adverb modifies a verb."],["particular serious","particularly serious","An adverb modifies an adjective."],["which concentration is limited","whose concentration is limited","Possession: <i>whose<\/i>."]]},"ideas":[["Homework helps","Repetition helps memory and understanding.","Practising multiplication tables or vocabulary at home."],["Homework helps","It builds independence and time management.","Planning a project over a week."],["Homework helps","It shows teachers and parents what the child has understood.","A parent seeing mistakes in maths exercises."],["Homework harms","It reduces time for play, sport and sleep.","A child who finishes homework late at night."],["Homework harms","It causes stress and can create a dislike of school.","A pupil anxious about incomplete tasks."],["Homework harms","It can widen inequality between children with and without help at home.","A child with no quiet place or helpful parent."],["Balance","Short, purposeful tasks, increasing with age, give the benefits without the harm.","Twenty minutes of focused practice for a young child."]],"vocab":[["consolidate learning","To make learning stronger by practice."],["independent study skills","Skills for learning without a teacher."],["wellbeing","A person's health and happiness: <i>the cost to children's wellbeing<\/i>."],["excessive / moderate","Too much / a reasonable amount."],["purposeful tasks","Tasks with a clear aim."],["time management","Organising time well."],["concentration span","How long a person can focus: <i>whose concentration is limited<\/i>."],["play a role in","Contribute to."],["a reasonable limit","A sensible maximum."],["satisfy both sides of the debate","A phrase for a balanced conclusion."]],"notes":{"TR":"Both views are developed with reasons and examples, and a clear, balanced opinion (<i>moderate, well-planned homework<\/i>) is stated in the introduction and repeated in the conclusion.","CC":"Introduction with the two views and the opinion → view 1 → view 2 → a conclusion in which the opinion is developed. <i>moreover, however, therefore<\/i> mark each move.","LR":"<i>consolidates, independence, wellbeing, purposeful, exhausting, reasonable limit<\/i>.","GRA":"Concession (<i>Although both views…<\/i>), a relative clause (<i>whose concentration is limited<\/i>), a participle (<i>increasing with age<\/i>) and parallel structure."},"task":2},{"id":"t2-07","etype":"discussion","label":"Discussion · media","short":"Good news or bad news","title":"Should the news report only good news?","minutes":40,"prompt":"Some people think that the news media should report all events accurately, even when the news is bad. Others think that they should focus on positive stories to protect the public's mood.<br><br>Discuss both views and give your own opinion.","decode":{"q":"Some people think that the news media should [[report all events accurately, even when the news is bad]]. Others think that they should [[focus on positive stories]] to [[protect the public's mood]]. [[Discuss both views and give your own opinion.]]","why":"<b>Topic:<\/b> what the news media should report. <b>Two views:<\/b> report everything honestly versus report positive stories. <b>Task words:<\/b> discuss both views, then give your opinion. A balanced opinion (accurate reporting, with more constructive stories) is allowed.","toks":[["Some",-1],["people",-1],["think",-1],["that",-1],["the",-1],["news",-1],["media",-1],["should",-1],["report",0],["all",0],["events",0],["accurately,",0],["even",0],["when",0],["the",0],["news",0],["is",0],["bad",0],[".",-1],["Others",-1],["think",-1],["that",-1],["they",-1],["should",-1],["focus",1],["on",1],["positive",1],["stories",1],["to",-1],["protect",2],["the",2],["public's",2],["mood",2],[".",-1],["Discuss",3],["both",3],["views",3],["and",3],["give",3],["your",3],["own",3],["opinion.",3]],"n":4},"plan":{"thesis":["I believe the media should report all important events honestly, while giving more space to constructive stories than they do today.","The media should show only positive news because bad news makes people sad.","Newspapers and television are important sources of information for everyone."],"ans":0,"why":"A states a position on both views at once, which becomes the structure of the whole essay. B ignores the other view and C does not answer the question.","pairs":[["Citizens need accurate information about problems to make good decisions.","Voters who learn about a failing hospital system can demand reform at the next election."],["Constant bad news can leave people anxious and helpless.","Viewers who watch rolling coverage of disasters every evening may feel that nothing can ever improve."],["Solution-focused stories can inspire action.","A report on a town that halved its waste encourages neighbouring communities to copy it."]],"note":"Idea 1 supports the first view, idea 2 the second view's concern, and idea 3 shows how both can be combined in your opinion."},"upgrade":[["The media must tell the truth because people want to know.",["The media must tell the truth because it is what people want.","A free press that reports uncomfortable facts accurately holds governments to account and lets citizens make informed choices.","People want to know the truth, so the media must always tell it."],1,"B explains why truth matters in terms of two results (accountability and informed choice). A and C only restate the claim."],["Too much bad news makes people sad.",["Too much bad news can make people sad and not happy at all.","A constant diet of negative headlines can leave audiences anxious and helpless, discouraging them from engaging with public issues.","Bad news is not good for people because it makes them sad."],1,"B uses a precise metaphor (<i>a constant diet of<\/i>), specific adjectives (<i>anxious, helpless<\/i>) and a consequence."],["The media should show good news too.",["The media should show more good news too and this would be better.","The media would serve the public better by balancing coverage of problems with reports on practical solutions.","Good news is also important, so the media should show it too."],1,"B turns an opinion into a recommendation with a clear method (<i>balancing … with …<\/i>)."]],"order":{"para":1,"note":"Claim (citizens need information) → example (voters and a hospital system) → an argument by contradiction (what happens without bad news) → conclusion about a free press. <i>If … would …<\/i> makes the argument logical.","sents":["The case for honest reporting is that citizens cannot act on problems they do not know about.","Voters who learn that a hospital system is failing, for example, can demand reform at the next election, and journalists who expose corruption often force governments to change course.","If the media filtered out bad news, the public would receive a distorted picture of the world, and those in power would face less scrutiny.","A free press therefore depends on reporting uncomfortable facts."]},"model":["People disagree about whether the news media should report every event honestly or concentrate on cheerful stories. Although I understand the wish to protect audiences from distress, I believe the media should report all important events accurately, while also giving more attention to constructive stories than they currently do.","The case for honest reporting is that citizens cannot act on problems they do not know about. Voters who learn that a hospital system is failing, for example, can demand reform at the next election, and journalists who expose corruption often force governments to change course. If the media filtered out bad news, the public would receive a distorted picture of the world, and those in power would face less scrutiny. A free press therefore depends on reporting uncomfortable facts.","Those who favour positive stories make a fair point about the effect of constant bad news. Viewers who watch rolling coverage of disasters every evening may come to feel anxious and powerless, and may even switch off from public affairs altogether. Reports on solutions can counter this: a story about a town that halved its waste, for instance, might inspire neighbouring communities to copy it. However, selecting only cheerful stories would be a form of censorship, not a remedy.","In conclusion, the media's first duty is to report events truthfully, including unwelcome ones. To protect the public's wellbeing, however, they should balance coverage of problems with examples of progress, so that audiences are informed without being overwhelmed. A press that does both would earn the trust that every healthy democracy needs."],"band7":{"para":1,"text":"The case for honest reporting is that citizens cannot act to problems what they do not know. Voters who learn that a hospital system fails, for example, can demand reform in the next election, and journalists who expose corruption often force governments to change. If the media filter out bad news, the public receive a distort picture of the world, and people in power would face less scrutiny. So free press depends on report uncomfortable facts.","faults":[["cannot act to problems what they do not know","cannot act on problems they do not know about","Preposition, no <i>what<\/i>, and the phrasal ending."],["a hospital system fails","a hospital system is failing","A situation in progress needs the continuous form."],["in the next election","at the next election","A fixed preposition."],["If the media filter out bad news, the public receive a distort picture","If the media filtered out bad news, the public would receive a distorted picture","A second conditional, and a past participle used as an adjective."],["So free press depends on report uncomfortable facts","A free press therefore depends on reporting uncomfortable facts","An article, a more formal linker, and <i>-ing<\/i> after a preposition."]]},"ideas":[["Report all events","Citizens need accurate information to vote and act.","Voters learning about a failing hospital system."],["Report all events","A free press holds governments and companies to account.","Journalists exposing corruption."],["Report all events","Hiding bad news damages trust in the media.","Audiences who discover that important facts were left out."],["Focus on positive stories","Constant negative news can cause anxiety and helplessness.","Rolling coverage of disasters."],["Focus on positive stories","Positive and solution-focused stories can inspire action.","A town that halved its waste."],["Focus on positive stories","Some audiences switch off from the news completely.","Younger viewers who avoid news."],["Balance","Report problems honestly but add context and solutions.","A story on a flood followed by how the community rebuilt."]],"vocab":[["scrutiny","Close examination: <i>those in power would face less scrutiny<\/i>."],["a free press","News media not controlled by the government."],["hold … to account","Make officials explain their actions."],["a distorted picture","An inaccurate impression."],["rolling coverage","News broadcast continuously."],["switch off from","Stop paying attention to."],["constructive / solution-focused","Aimed at helping, not only reporting problems."],["censorship","Controlling what the public can see or read."],["a fair point","A reasonable argument from t
